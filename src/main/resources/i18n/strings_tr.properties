script.b93c5237457f=Bu lamda %,d kopya grubu var: aynı sonuç lamda "ad", "ad (2)", "ad (3)" biçiminde yan yana duruyor. Kopyalar farklı bölgeler içerebilir; hangisinin güncel olduğuna dışa aktarma karar veremez.\n\nÖrnekler (lam · ad: kopya numaraları; 1 = numarasız ad):\n%s\n\n"Tüm kopyalar": her anotasyon karo bölgesine ve (maske modunda) maskeye girer. Karo listesinin biçimi değişmez; kopyalar sonuç penceresinde ve çıktı klasöründeki ".kopyalar.txt" dosyasında listelenir.\n\n"Yalnız en yenisi": her grupta yalnız en yüksek numaralı kopya kalır; eski kopyalar ve içlerindeki anotasyonlar ne karo üretir ne maskeye girer. Lamdaki hiçbir şey silinmez.\n\nİptal: hiçbir şey dışa aktarılmaz.\n\nHangisi dışa aktarılsın?
script.348ff8ba06a5=Kopya grupları — seçim: yalnız en yenisi\n  %,d grup. Dışarıda bırakılan: %,d anotasyon (eski kopyalar ve içlerindekiler).
script.d41049f54dc2=Kopya grupları — seçim: tüm kopyalar\n  %,d grup. Kopyalar karo listesinde işaretli DEĞİLDİR; hangi sonucun güncel olduğunu aşağıdaki listeden kontrol edin.
