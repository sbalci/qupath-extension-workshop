script.3270e96f1d5e=Hafif (torch gerekmez). DICOM → SVS sihirbazı; DICOMtoSVS.py betiği AYRICA çalışma anında indirilir (depo LİSANSSIZ → paketlenmez). Sürümler yazarın README'sine sabitlenmiştir (pydicom 2.4.5, numpy 1.26.4).
script.58e78baba98b=Hepatocyte — karaciğer segmentasyon köprüsü
script.74211811727e=⚠️ Yalnızca Python ortamı. hepatocyte-app deposu + model ağırlığı (🔒 talep üzerine) AYRICA gerekir — Hepatosit sihirbazının ②③ butonları. openslide-bin, OpenSlide ikililerini pip ile getirir (conda gerekmez).
script.7d83676a4c70=MIDOG25 FCOS — mitoz dedektörü (torchvision)
script.7515de6c07f2=⚠️ Yalnızca Python ortamı. FCOS_x101.ckpt ağırlığı + MIDOG25 T1 referans KODU AYRICA gerekir — mitoz sihirbazının "Modeli yerel indir" butonu ikisini de çalışma anında çeker (ağırlık: v1.0.0 yayını; kod: sabit commit; paketlenmez, LİSANS dosyası yok → araştırma/eğitim, kullanıcı sorumluluğunda). SimpleITK + pyyaml + tqdm referans kodunun import ettikleridir — bu ortamı daha önce kurduysanız YENİDEN KURUN.
script.f9a631d7b789=MIDOG DA-RetinaNet (eski, DOĞRULANMAMIŞ)
script.2aeedb5adbab=⚠️ ESKİ/DOĞRULANMAMIŞ ortam. fastai 1.0.61 + modern torch bilinen bir kırılgan kombinasyondur; çözülmeyebilir ya da import hatası verebilir. Referans depo kodu + ağırlık çalışma anında indirilir (paketlenmez, LİSANS yok). Aşılmış — bunun yerine MIDOG25 FCOS önerilir.
script.cddfaa600bd9=MIDOG25 EffNetV2 — atipik sınıflandırıcı (timm)
script.dbd64be69c2f=⚠️ Yalnızca Python ortamı. Tipik/atipik SINIFLANDIRICI (dedektör değil — önce bir mitoz dedektörü çalıştırın). efficientnetv2_m_fold3_best.pth çalışma anında v1.0.0 yayınından indirilir (paketlenmez, LİSANS yok → araştırma/eğitim).
script.387eb0379c6b=Sanofi EFTD — atipik sınıflandırıcı (DINOv3-H+, KAPILI)
script.f32fefe9dc21=⚠️ Tipik/atipik SINIFLANDIRICI (MIDOG25 T2 birincisi). KISMEN KAPILI: LoRA adaptörleri açık ama DINOv3-H+ omurgası (facebook/dinov3-vith16plus) HF'te KAPILIDIR — Meta lisansı + `huggingface-cli login` gerekir (otomatik DEĞİL). QuPath menüsünde varsayılan DEVRE DIŞI. Ticari-olmayan araştırma lisansı.
script.2f1de9594a30=HoVer-NeXt — çekirdek segmentasyon + 7 sınıf (Lizard; NVIDIA GPU)
script.019fbf70e1c3=⚠️ NVIDIA CUDA GPU ZORUNLU (HoVer-NeXt CPU'da çalışmaz). Yalnızca Python ortamı: HoVer-NeXt KODU (GPL-3.0, sabit commit) ve Lizard AĞIRLIKLARI (Zenodo 10635618, CC BY-NC-SA 4.0 — ticari olmayan) sihirbazın "Modeli yerel indir" butonuyla çalışma anında indirilir; paketlenmez, kod ayrı süreç olarak çalıştırılır. Sürümler upstream'e sabitlenmiştir (torch 2.1.1 + CUDA 12.1, smp 0.1.0, timm 0.9.6, zarr 2.16 → numpy<2); çok yeni GPU mimarileri (ör. RTX 50xx) bu torch sürümüyle desteklenmeyebilir. Cihaz seçimi CPU ise kurulum yapılır ama HoVer-NeXt çalışmaz.
script.2d34aca978cc=Classpose — H&E hücre fenotipleme (Cellpose-SAM)
script.1c51a56a3693=⚠️ Yalnızca Python ortamı (~6 GB; GPU torch). Classpose KODU (CC BY-NC 4.0, sabit commit f6aeadd) bu ortama çalışma anında kurulur — atölyede paketlenmez; sihirbaz onu ayrı süreç olarak çalıştırır. Model dosyaları (Hugging Face classpose/classpose, ~1.2 GB/model) ve isteğe bağlı GrandQC ağırlıkları sihirbazdan indirilir ya da yerel klasörden kullanılır. Python 3.13 gerekir (uv kendisi indirir). Windows'ta GPU için sihirbaz TORCHDYNAMO_DISABLE=1 ayarlar (Triton yok). cellpose 4.0.8'e sabitlenir (bu commit yeni cellpose ile açılmaz); yayımlanan paket alt modülleri atladığından her ortam kurulumundan sonra sihirbazın ① adımında bir kez "Kurulumu tamamla" gerekir.
script.e0c715b1ff8f=CytoFormer — H&E hücre tipi sınıflama (ViT-g; NVIDIA GPU önerilir)
script.0c062d406eb1=⚠️ Yalnızca Python ortamı (~5 GB; GPU torch). CytoFormer KODU (PENN Academic Software License — yalnız dahili araştırma/ticari olmayan kullanım, yeniden dağıtım yok) sihirbazda lisans onayından SONRA sabit commit'ten (36b667e) veri köküne indirilir; atölyede paketlenmez, ayrı süreç olarak çalışır. Ağırlık (Hugging Face zhihuanglab/CytoFormer, KAPILI, CC BY-NC 4.0, 2.7 GB) yerel klasörden kullanılır ya da HF girişiyle indirilir. torchvision>=0.16 BİLEREK açıktır: upstream requirements.txt torchvision'ı listelemez, timm onu sınırsız çeker ve uv 0.2.0'a (2018) çözebilir → "torchvision.ops" hatası. timm 1.1 altında tutulur (mimariyi timm kurar; 1.0.29 doğrulandı). NVIDIA GPU yoksa ortamı cihaz = CPU ile kurun: CUDA torch'u CPU kipine zorlamak Windows'ta 0xC0000005 ile çöktü; CPU tekerleği sorunsuz (~1.5–2 hücre/sn).
script.33f0312f3c7c=HistoPLUS — H&E hücre segmentasyonu + 13 (+1) sınıf (CellViT/H0-mini; NVIDIA GPU önerilir)
script.92019aaeec71=⚠️ Yalnızca Python ortamı (~6 GB; GPU torch). HistoPLUS KODU (Owkin, CC BY-NC-ND 4.0 — ticari olmayan, türev PAYLAŞILMAZ) sabit commit'ten (576b94e) bu ortama çalışma anında kurulur; atölyede paketlenmez ve DEĞİŞTİRİLMEZ. Ağırlıklar (Hugging Face Owkin-Bioptimus/histoplus, KAPILI, ~285 MB × 2) sihirbazın ② adımından kendi HF hesabınızla indirilir ya da yerel klasörden kullanılır. Sürümler upstream uv.lock'a SABİTTİR (sabitlenmezse uv pandas 3 / OpenCV 5 çözer; upstream kodu bunlarla denenmedi). xformers torch 2.7.1'e bağlıdır: CUDA 12.6/12.8 indeksinde var, CUDA 11.8'de YOK (eski NVIDIA sürücüsü → sürücüyü güncelleyin ya da cihaz = CPU ile kurun). Cihaz = CPU ise standart PyPI tekerleği kullanılır (CPU indeksinde xformers yok). CPU çıkarımı çalışır ama çok yavaştır (~7 dk/mm²); GPU (RTX A4000) ~12 sn/mm².
script.020227967a6f=VALIS — WSI hizalama (native; JDK/Java AYRICA gerekir)
script.651fd7a2f468=⚠️ Yalnız NATIVE mod içindir. valis-wsi + pyvips[binary] (libvips ikilisi) + openslide-python & openslide-bin (OpenSlide ikilisi → .svs/.ndpi HIZLI okunur; yoksa VALIS yavaş Bio-Formats yoluna düşer) pip ile kurulur; torch CUDA wheel'i --torch-backend=auto ile otomatik seçilir (RTX A4000; GPU özellik-eşleştirmeyi hızlandırır — LAM OKUMA/DÖNÜŞTÜRME ise disk/IO bağımlıdır, GPU kullanmaz). AYRICA bir JDK (Bio-Formats/JPype) gerekir — sistemde Java varsa yeterlidir. ÖNERİLEN yol: Docker (cdgatenbee/valis-wsi; tüm bağımlılıklar hazır). Bkz. Kaynaklar → İleri kurulumlar → VALIS. Lisans: VALIS = MIT.
