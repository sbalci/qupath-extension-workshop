script.422a4173507c=Üst veride bölme varsa yok sayılamaz; şu denetimler HER ZAMAN yapılır ve kapatılamaz:\n  • aynı lam birden çok bölmeye yazılamaz,\n  • lamın karoları aynı kümede başka bölmede varsa durur,\n  • aynı hastanın başka lamı projede farklı bölmedeyse durur,\n  • bölmeli ve bölmesiz lamlar aynı kümeye yazılamaz,\n  • hasta kimliği yoksa durur (onayla devam yolu yoktur).\nBetik bölme atamaz; yalnız var olan bölmeyi okur.
script.1a6cade51ab0=Genel ilkeler\n  1. Ölçeği büyütmeyle değil µm/px ile verin; görüş alanı = karo (px) × µm/px.\n  2. Örtüşmeyi yalnız karolar yeniden birleştirilecekse ya da kenarda kesilen yapı önemliyse açın.\n     Örtüşen karolar neredeyse kopyadır: aynı bölmede kalmalıdır.\n  3. Bölmeyi karo düzeyinde değil hasta düzeyinde yapın (Bölme ve sızıntı sekmesi).\n  4. Arka planı ve artefaktı karodan önce dışlayın: Doku tespiti, Ignore* anotasyonları, en az kapsama.\n  5. Ayarları ve seçim stratejisini kaydedin: küme klasörünün adı ve karo listesi bunu taşır.\nTek bir doğru ayar yoktur; görev ve modele bağlıdır.
