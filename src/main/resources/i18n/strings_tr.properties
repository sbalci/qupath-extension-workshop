script.c5113f949edb=Karo dışa aktarımı anotasyonla sınırlıdır; lamdaki hiçbir anotasyon bulunamadı.\n\nÖnce bir bölge çizin (dikdörtgen/çokgen) ya da maske için sınıflı anotasyon\nüretin (Tümör/Stroma modülü), sonra tekrar deneyin.
