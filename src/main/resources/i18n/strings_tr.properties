script.21c3ca2ac0c8=%,d lamda birden çok GrandQC seti var: sihirbaz her çalıştırmada lama yeni bir set ekleyebilir ("GrandQC KK", "GrandQC KK (2)", "GrandQC KK (3)"). Setler farklı sayılar içerebilir; hangisinin güncel olduğuna bu araç karar veremez.\n\nÖrnekler (lam · ad: set numaraları; 1 = numarasız ad):\n%s\n\n"Tüm setler": her set ayrı bir satır olur ve satıra setin adını yazan bir "set_adi" sütunu eklenir.\n\n"Yalnız en yeni set": her lamdan yalnız en yüksek numaralı set özetlenir; "set_adi" sütunu hangi setin kullanıldığını gösterir. Lamdaki hiçbir şey silinmez.\n\nİptal: hiçbir şey yazılmaz.\n\nHangisi yazılsın?
script.a9f3bcb2d7f3=Birden çok set — seçim: yalnız en yeni set\n  %,d lamda birden çok set var. Dışarıda bırakılan: %,d eski set (%,d anotasyon).
script.edd54177c405=Birden çok set — seçim: tüm setler\n  %,d lamda birden çok set var; toplam %,d satır yazıldı. Her satırın kendi seti "set_adi" sütununda.
script.051b44368449=Son sütun "set_adi": satırın hangi GrandQC setinden geldiğini gösterir. Etkilenen lamlar (ad: set numaraları):
script.69a14deb3fc8=Bu betik Hematoxylin/Eosin renk ayrıştırma kanallarını kullanır; bunun için\ngörüntü tipi Brightfield (H&E) olmalı ve boya vektörleri tanımlı olmalı.\n\nÇözüm: Extensions → Atölye → Yardımcılar → Temel araçlar → Görüntü tipi ayarla ile tipi\nBrightfield (H&E) yapın, sonra bu betiği tekrar çalıştırın.
script.32246b235c40=Lamda piksel boyutu (µm/px) tanımlı değil; sınıflandırıcı çözünürlüğü hesaplanamaz.\n\nÇözüm: Extensions → Atölye → Yardımcılar → Temel araçlar → Kalibrasyon (piksel boyutu).\nSonra bu betiği tekrar çalıştırın.
script.036f0e16fc4a=Örnek modeli kurmak için: Extensions → Atölye → Yardımcılar → İçe ve dışa aktarma / veri →\n"Örnek tümör/stroma sınıflandırıcısını projeye kaydet".
script.65eb635495c1=Sihirbaz için: Extensions → Atölye → Modüller → Tümör/Stroma →\n"Tümör/Stroma sihirbazı".
script.764b3ea6a979=Bu görüntüde renk-dekonvolüsyon (boya) vektörleri yok.\n\nOlası neden: görüntü tipi brightfield değil (örn. floresan/diğer).\n\nÇözüm:\n  • [Extensions → Atölye → Yardımcılar → Temel araçlar → Görüntü tipi ayarla] ile tipi\n    Brightfield (H&E) ya da Brightfield (H-DAB) yapın.\n  • QuPath'in kendi komutu: Analyze → Preprocessing → Estimate stain vectors\n  • Ayrıntı:\u0020
script.f65782dc5773=Lamda piksel boyutu (µm) tanımlı değil.\n\nPiksel boyutunu ayarlamak için: Extensions → Atölye → Yardımcılar → Temel araçlar → Kalibrasyon (piksel boyutu).
script.61a716f3975b=Çizilebilir ölçüm bulunamadı.\n\nÖnce ölçümlü tespitler oluşturun (Hücre tespiti / Nükleer boya / Sitoplazmik boya /\nTümör içi Ki-67 modülleri), ya da fenotip/UMAP\netiketlerini içe aktarın (Extensions → Atölye → Yardımcılar → İçe ve dışa aktarma / veri →\nKümeleme/fenotip etiketlerini içe aktar (TSV)).\nSonra '⟳ Yenile'.
script.016778e1c1dd=Bu görüntüde renk dekonvolüsyonu (boya vektörü) tanımlı değil — büyük olasılıkla brightfield değil. Görüntü tipini ayarlayın (Yardımcılar → Temel araçlar → Görüntü tipi ayarla). Aşağıdaki Gaussian/eşik sayfaları gri (yoğunluk) kanalı üzerinden çalışır.
script.f385733c06d7=\n\nKurulum: Extensions → Atölye → Yardımcılar → Python köprüleri ve temel modeller → Atölye Python ortam yöneticisi → "HoVer-NeXt — çekirdek segmentasyon + 7 sınıf".\n
script.81fd41da95a2=Lamda piksel boyutu (µm) tanımlı değil; alan µm² olarak hesaplanamaz.\n\nPiksel boyutunu ayarlamak için: Extensions → Atölye → Yardımcılar → Temel araçlar → Kalibrasyon (piksel boyutu).
script.4b0f699b35dd=Lamda piksel boyutu (µm) tanımlı değil; alan µm² olarak üretilemez.\n\nPiksel boyutunu ayarlamak için: Extensions → Atölye → Yardımcılar → Temel araçlar → Kalibrasyon (piksel boyutu).
script.a446e942c76e=\n\nKurulum: Extensions → Atölye → Yardımcılar → Python köprüleri ve temel modeller → Atölye Python ortam yöneticisi → "MIDOG25 EffNetV2 — atipik sınıflandırıcı".\nKöprü: handson/python/midog/atypical_effnet.py
script.937dd59f4e8c=\n\nKurulum: Extensions → Atölye → Yardımcılar → Python köprüleri ve temel modeller → Atölye Python ortam yöneticisi → "Sanofi EFTD — atipik sınıflandırıcı".\nKöprü: handson/python/sanofi/eftd_runner.py
script.e8904d5e394e=\n\nKurulum: Extensions → Atölye → Yardımcılar → Python köprüleri ve temel modeller → Atölye Python ortam yöneticisi → "MIDOG25 FCOS — mitoz dedektörü".\n
script.3243671b1541=\n\nKurulum: Extensions → Atölye → Yardımcılar → Python köprüleri ve temel modeller → Atölye Python ortam yöneticisi → "MIDOG DA-RetinaNet (eski, CPU)".\n
script.5e383b8c6c80=\n\nKurulum: Extensions → Atölye → Yardımcılar → Python köprüleri ve temel modeller → Atölye Python ortam yöneticisi → "TIA Toolbox — bölge modelleri".\n
script.30860311b886=Model: Bu modül H&E mitoz için sabit "KongNet MIDOG" (MIDOG 2025 birincisi) kullanır — TIA Toolbox'ta mitoza uygun TEK model. Çekirdek/hücre dedektörleriyle (PanNuke/CoNIC/MONKEY/MapDe) deney için → Yardımcılar → Python köprüleri ve temel modeller → "TIA Toolbox bölgede çekirdek/mitoz tespiti" (hepsini sınıf-başına içe alımla çalıştırır). Model listesi ve lisanslar: modül sayfası "Mitoz modelleri".\nPython + köprü otomatik bulunur (tiatoolbox-runtime/.venv ve handson/python/tiatoolbox/). Cihaz: GPU için cuda.\nDuyarlılık eşiği: KongNet varsayılanı 0.99 (çok tutucu — az/hiç tespit). Daha çok mitoz için düşürün (ör. 0.5); boş = model varsayılanı. Düşük eşik daha çok tespit ama daha çok yanlış-pozitif demektir — tahminleri görsel doğrulayın.\nYerel model: "Modeli yerel indir" ağırlıkları BİR KEZ veri kökü altına indirir; ardından "Çevrimdışı çalış"ı işaretleyin → çalıştırmalarda ağa hiç çıkılmaz (GrandQC gibi).
script.53c041a466c1=Lamda piksel boyutu (µm) tanımlı değil; bant µm cinsinden üretilemez.\n\nPiksel boyutunu ayarlamak için: Extensions → Atölye → Yardımcılar → Temel araçlar → Kalibrasyon (piksel boyutu).
script.d333d0105aa6=Menüden açın: Yardımcılar → Python köprüleri ve temel modeller → Atölye Python ortam yöneticisi
script.13fdf447446f=Lamda piksel boyutu (µm) tanımlı değil; mesafe µm olarak hesaplanamaz.\n\nPiksel boyutunu ayarlamak için: Extensions → Atölye → Yardımcılar → Temel araçlar → Kalibrasyon (piksel boyutu).
script.14ae5da27c97=Cellpose çalıştırılamadı; hücre bazlı tespit Watershed yöntemiyle sürdürüldü (sonuç metninde dedektör adı yazar), piksel tabanlı H-score etkilenmedi. Cellpose'u kullanmak için ortamı denetleyin: Extensions → Atölye → Yardımcılar → Hücre ve çekirdek tespiti → Cellpose hücre/çekirdek tespiti sihirbazı.\nTeknik ayrıntı: %s
