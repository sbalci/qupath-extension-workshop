script.e2d76b86fc74=Kapsam   : %s\nDepo (klasör):\n  %s\n\n⚙️  Ayarlar\n──────────\n  Taban boyut : %,d × %,d px\n  Kanal       : %d\n  Parça (chunk): %d px\n  Sıkıştırma  : blosc (varsayılan)\n  Biçim       : OME-NGFF v0.4 (.ome.zarr)\n\n🗂️  Piramit düzeyleri (%d)\n──────────\n%s\n\n📊 Özet\n──────\n  Disk boyutu : %.1f MB\n  Süre        : %.1f sn\n\n📝 Sonraki adım:\n  • Depoyu QuPath'e geri sürükleyerek açabilirsiniz (Bio-Formats / OME-Zarr okuyucu).\n  • Python'da inceleyin: %s inspect <depo>\n  • Yöntem ve ekosistem: Ekler → OME-Zarr / OME-NGFF.\n\n⚠️ Yalnızca araştırma/eğitim amaçlı ölçüm üretir.
script.e649f679ad2d=Seçili anotasyon(lar) (%d)
script.7dadf189c987=Özellik matrisi - Makine öğrenmesi
script.90de9edecfc4=Her hücre (tespit) için sayısal ölçümleri, etiket sütunlarıyla (cell_class,\nregion_class) birlikte makine öğrenmesine hazır bir TSV matrisine yazacağım.\n\nBu betik MODEL EĞİTMEZ — yalnızca X (özellikler) + y (etiketler) matrisini\nüretir. Modelleme Python / R tarafında yapılır.\n\nÇıktı klasörü:\n  <proje-klasörü>/%s/YYYY-MM-DD_HHmmss/\n\nHangi modu istiyorsunuz?\n  • Sadece bu görüntü — açık lamın canlı hiyerarşisi\n  • Tüm proje         — her lam + birleştirilmiş _all_features.tsv
script.6f00dee0f094=%s → matris: %s
script.6de412d0fc6f=%s → readImageData: %s
script.b094ecb108ab=_feature_dictionary: %s
script.5ef9cb173fb5=\u0020\u0020(yok)
script.df131c7e65f3=\n\n💡 Hiç tespit bulunamadı. Önce ilgili modüllerde hücre tespiti çalıştırın.
script.252f1718ba6d=\n\n💡 cell_class ve region_class boş. Denetimli ML için etiket gerekir:\n  • cell_class için: hücreleri sınıflandırın (Nükleer boya / Tümör-Stroma modüllerinde).\n  • region_class için: tümör/stroma anotasyonu içinde tespit üretin (Tümör/Stroma modülü → Tümör içi Ki-67 modülü).
script.44a726d5ee88=\n\n⚠ Kalibrasyonsuz lam(lar) — centroid PİKSEL cinsinden yazıldı:\n
script.7212c823e683=\n  ... ve %d lam daha
script.bd4bae71b64b=\n\n⚠️ Bazı dosyalar yazılamadı:\n
script.f4b62501e6ae=Özellik matrisi — Tamamlandı 🧮
script.b30753ee4ba6=Mod: %s\nÇıktı klasörü:\n  %s\n\n📊 Özet\n──────\n  Lam sayısı       : %d\n  Toplam hücre (satır): %d\n  Özellik sütunu     : %d\n  Yazılan dosya      : %d\n  Süre               : %.1f sn\n\n🏷 cell_class dağılımı\n──────────────────\n%s\n\n🏷 region_class dağılımı\n────────────────────\n%s%s%s%s\n\n📝 Sonraki adım:\n  • `%s/%s/_all_features.tsv` (ya da <lam>__features.tsv) dosyasını\n    Python (pandas) / R ile okuyun. X = feature sütunları, y = cell_class veya region_class.\n  • Sütun grupları `_feature_dictionary.tsv` içinde id/label/feature olarak etiketlidir.\n  • Veri dışa aktarma modülünün web sayfasındaki 'Makine öğrenmesi için özellik matrisi' bölümünde\n    scikit-learn örneği var. Bu betik yalnızca matrisi üretir; model eğitmez.\n\n⚠️ Yalnızca araştırma/eğitim amaçlı ölçüm üretir.
script.56788b39ff7d=Kaynak yapı seçili değil.\n\nEtrafında bant oluşturulacak yapıyı (tümör, bez, lezyon vb.)\nALAN anotasyonu olarak çizin ve SEÇİN, sonra betiği tekrar çalıştırın.
