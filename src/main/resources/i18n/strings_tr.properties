script.b89b0d40335a=Warpy (qupath-extension-warpy, BIOP) KURULUMU — BIOP KATALOĞUNDAN önerilir:\n\n1. Extensions → Manage extensions → Manage extension catalogs → Add.\n2. Katalog URL'sini yapıştırın:\n\u0020\u0020\u0020\u0020\u0020
script.12e771e3b104=\u0020\u0020\u0020(aşağıdaki düğme bu adresi açar/panoya kopyalar.)\n3. Katalogdan Warpy'yi kurun — QuPath sürümünüzle EŞLEŞEN derlemeyi verir (elle .jar'dan güvenli;\n   yanlış sürüm elle .jar yüklenmeyebilir).\n4. QuPath'i YENİDEN BAŞLATIN.\n\nAYRICA Fiji gerekir (AYRI uygulama; hizalama Fiji'de yapılır):\n  • Fiji'yi\u0020
script.b8b1bb2d315d=\u0020adresinden indirin ("Fiji indir" düğmesi), arşivi açın.\n  • Fiji'de PTBIOP güncelleme sitesini açın + elastix wrapper'larını ayarlayın\n    (Plugins → BIOP → Set and Check Wrappers). BigWarp Fiji çekirdeğinde gelir.\n\nBIOP katalog sayfasını şimdi açayım mı?
script.a8d028214f86=FIJI EKLENTİLERİ (Warpy hizalaması için) — Fiji açıkken:\n\n1) PTBIOP güncelleme sitesi (BigDataViewer-Playground + Warpy komutları):\n   Help → Update… → (kontrol bitince) Manage update sites → listeden PTBIOP'u İŞARETLE →\n   Close → Apply changes → Fiji'yi YENİDEN BAŞLAT.\n   ⚠ İhtiyacınız olan menü "BigDataViewer-Playground"dur (tireli) — DÜZ "BigDataViewer" DEĞİL.\n   PTBIOP açıkken de "BigDataViewer-Playground" görünmüyorsa: Apply changes + yeniden başlat;\n   hâlâ yoksa PTBIOP'u kapatıp-açıp yeniden Apply edin (temiz indirme) ve Update penceresindeki hataları kontrol edin.\n   JAR kurulu (jars/bigdataviewer-playground-*.jar VAR) AMA menü yoksa: Fiji'nizde JAR ÇAKIŞMASI vardır\n   (deneysel "SciJava-Ops"/scijava3 -SNAPSHOT jar'ları klasik SciJava ile çakışır → menü kaydı düşer).\n   Bunlar genelde "Fiji-Latest" (nightly, sites.imagej.net/Fiji) güncelleme sitesinden gelir:\n   Manage Update Sites → "Fiji-Latest"i KAPAT (ImageJ/Fiji/PTBIOP/ElastixWrapper açık kalsın) → Apply → yeniden başlat.\n   Window → Console başlangıç hatasını gösterir. En güvenlisi: YALNIZ PTBIOP açık TEMİZ bir Fiji (fiji.sc).\n\n2) elastix (otomatik afin + spline; Fiji EKLENTİSİ DEĞİL, harici çalıştırılabilir):\n   • İndir (test edilen sürüm 5.0.1):\u0020
script.e3641b6e9da3=\u0020→ Windows zip → bir klasöre açın.\n   • Windows'ta çalışmazsa "Visual C++ redistributable" kurun.\n   • Fiji → Plugins → BIOP → Set and Check Wrappers → elastix.exe ve transformix.exe yollarını verin.\n\n3) BigWarp: Fiji çekirdeğinde gelir (kurulum gerekmez).\n\nSonra Fiji'yi yeniden başlatın; Warpy komutu Plugins → BigDataViewer-Playground → Sources → Register\naltında görünür. elastix sürüm sayfasını şimdi açayım mı?
