script.959092fda2c3=Model: MIDOG 2025 Görev 1 resmî referansı (FCOS-ResNeXt101), sabit. Ağırlık ve referans kodu paketlenmez; "Modeli yerel indir" ikisini de bir kez çeker (ağırlık: v1.0.0 yayını; kod: sabit commit — model kurulumu ve döşemeli çıkarım bu koddan değiştirilmeden çalıştırılır; LİSANS dosyası yok → araştırma/eğitim, kullanıcı sorumluluğunda). midog-fcos ortamını bu sürümden önce kurduysanız yeniden kurun (SimpleITK + pyyaml eklendi).\nPython + köprü otomatik bulunur (midog-fcos venv ve handson/python/midog/). Cihaz: GPU için cuda.\nHedef çözünürlük: ROI bu µm/px değerine yeniden örneklenip FCOS'a beslenir (varsayılan 0.25: model MIDOG görüntülerinin taban düzeyinde, ~40x, eğitildi; 0.5 girerseniz mitozlar modelin gördüğünün yarı boyutunda kalır). Duyarlılık eşiği: referans 0.548; daha çok tespit için düşürün (ör. 0.3) — daha çok yanlış-pozitif, görsel doğrulayın.
