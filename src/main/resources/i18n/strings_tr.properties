script.05de73d7717e=Bu sihirbaz yerel QuPath **InstanSeg eklentisini** kullanır; şu anda yüklü değil.\n\nKurulum:\n  1. [Extensions → Manage extensions] → InstanSeg → Install\n  2. QuPath'i yeniden başlatın\n  3. Bu sihirbazı tekrar açın\n\nAyrıntılı kurulum + modeller: Ekler → InstanSeg.\nNot: InstanSeg DJL ile QuPath içinde çalışır — ayrı bir Python ortamı (venv) GEREKMEZ.
