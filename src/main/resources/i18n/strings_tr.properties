script.1ef4a0b87c6e=Bu lamda bu yardımcının ürettiği %,d "%s" sınıflı bant anotasyonu zaten var (tüm kaynak yapılar için).\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni bantların adlarının sonuna "(%d)" eklenir ve ayrı bir set olurlar. Lamda iki set birlikte durur; bantlar örtüşebilir.\n\n"Değiştir" seçilirse önceki bantların TÜMÜ silinir — onlarda elle yaptığınız düzeltmeler de gider; bantların içindeki hücre tespitleri ve diğer nesneler korunur. Elle çizdiğiniz ya da adını değiştirdiğiniz anotasyonlara dokunulmaz.\n\nİptal: hiçbir şey üretilmez, hiçbir şey yazılmaz.\n\nÖnceki bantlar ne olsun?
