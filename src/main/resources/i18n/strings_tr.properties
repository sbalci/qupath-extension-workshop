script.f6a12e074eaa=Seçili bölge içinde hücre tespiti bulunamadı.\n\nÖnce Nükleer boya (Ki-67), ER/PR H-score, Membran boya (HER2),\nSitoplazmik boya (CD68) veya Tümör içi Ki-67 modüllerinden birini çalıştırın.
script.ef5f5e7143a3=Seçili bölgedeki tespitler henüz sınıflandırılmamış (yalnız sınıfsız çekirdekler var).\n\nÖnce pozitif/negatif veya hücre tipi sınıflandırması üreten bir modül çalıştırın.
