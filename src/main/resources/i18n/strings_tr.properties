script.7a5d76d61df4=Şerit ≠ hücre görünümü: renk şeridi ORTALAMA OD sayısının lejantıdır; granüler-güçlü ve yaygın-zayıf boyanma aynı ortalamayı paylaşabilir. Gerçek referans üstteki hücre kesitleridir.
script.23687f3eb12e=Çok büyük tespit kümelerinde her bırakışta yeniden sınıflandırma gecikme yaratabilir — bu yüzden "Canlı uygula" kapatılabilir.
script.345e0989fa7a=Dikkat: varsayılan eşikler DAB için kalibre edilmiştir; bu kromojen için başlangıç noktası olarak kullanın, doğrulanmış varsayılan değildir.
script.f4ed80f726f6=1) Şerit ≠ hücre görünümü — OD 0.4'teki düz renk örneği "2+ hücre böyle görünür" demek DEĞİLDİR; ortalama farklı boyanma desenlerinde aynı çıkabilir. Kesitler bu yüzden var.
script.c8e03db77b62=2) Renkler boya vektörüne bağlı — şerit, görüntünün güncel vektör tahmininden üretilir; yanlış tahmin yanlış renk gösterir. Önce Boya vektörleri sihirbazını çalıştırın (Yardımcılar → Boya ve renk).
script.7a646d23c8e4=3) Kesitler tek örnektir — her yuva hedef OD'ye EN YAKIN tek hücreyi gösterir; o değerin çevresindeki çeşitliliği gösteremez. Tüm dağılım histogramdadır.
script.e05d5a8d4fa6=4) Eşik sonucu doğrudan kaydırır — bir eşiği sürüklemek 1+/2+/3+ dağılımını ve H-score'u tanım gereği değiştirir; "doğru" tek eşik yoktur. Yöntem referansınızla tutarlı bir eşik seçip belgeleyin; aynı çalışmada lamdan lama değiştirmeyin. "Otomatik öner" (3-eşik Otsu) yalnızca veri-güdümlü bir başlangıç önerisidir — yöntemsel doğruluk iddiası taşımaz.
script.153e054395ab=5) Yalnızca yeniden sınıflandırır — tespit/genişletme parametrelerine dokunmaz (onlar için modülü yeniden çalıştırın). Piksel-bazlı H-score yeniden HESAPLANMAZ; bayat ölçümler her uygulamada temizlenir.
script.f82e77c97fbe=6) Canlı uygulamanın boyut maliyeti — büyük kümelerde her bırakışta yeniden sınıflandırma gecikebilir; bu yüzden açma/kapama seçeneğidir.
script.dfa197d9fb6c=7) Ölçüm üretir, yorum üretmez — klinik eşik/kategori önermez.
script.a3a5b4b6c6b0=8) Canlı uygulama geri-al yığınını tüketir — her uygulama bir Ctrl+Z adımı kaydeder ve QuPath 10 adım tutar; uzun ayar oturumundan sonra sihirbaz-öncesi duruma Ctrl+Z ile dönmeye güvenmeyin. Sıfırla + sürükleme, ölçümlerden kayıpsız geri dönüş yoludur.
script.22b9462393ab=9) Piksel-düzeyi alternatif — piksel renk eşikleme QuPath'te zaten var: Classify → Pixel classification → Create thresholder. Bu sihirbaz bir üst katmanda, hücre başına ortalama kromojen OD üzerinde çalışır; ikisi birbirinin yedeği değil tamamlayıcısıdır.
script.fa37f3451c5e=10) Varsayılan eşikler DAB için kalibredir — AEC gibi diğer kromojenlerde başlangıç noktasıdır, doğrulanmış varsayılan değildir.
