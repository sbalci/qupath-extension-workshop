script.94f0d15b2170=Bu görüntüde renk-dekonvolüsyon (boya) vektörleri yok.\n\nOlası neden: görüntü tipi brightfield değil (örn. floresan/diğer).\n\nÇözüm:\n  • [Extensions → Atölye → Yardımcılar → Görüntü tipi ayarla] ile tipi\n    Brightfield (H&E) ya da Brightfield (H-DAB) yapın.\n  • QuPath'in kendi komutu: Analyze → Preprocessing → Estimate stain vectors\n  • Ayrıntı:\u0020
script.d1571e7fdcdb=Seçili bölgenin pikselleri üzerinden boya vektörleri tahmin ediliyor. Lütfen bekleyin…
script.5f33cf07763a=Yeni vektörleri inceleyin. Uygunsa [Uygula] (geri alınabilir); değilse [◀ Rapora dön] — görüntü değişmez.
