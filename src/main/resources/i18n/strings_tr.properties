script.aab73e5d6aed=⚠ Seçtiğiniz kayıt yeri bulunamadı (%s); dosyalar proje varsayılan klasörüne yazıldı: %s\n  Başka bir klasör istiyorsanız aracı yeniden çalıştırıp var olan bir klasör seçin.
script.cc58e417f2b4=GeoJSON dosyası okunamadı. Dosyanın GrandQC'nin ürettiği geçerli bir .geojson olduğunu ve başka bir programda açık olmadığını denetleyin; gerekirse GrandQC adımını yeniden çalıştırın.\n\nTeknik ayrıntı: %s
script.a94ce369adb2=GeoJSON dosyası okunamadı. Aracın Python adımı çıktı dosyasını eksiksiz yazmamış olabilir: çalışma günlüğünü ve çıktı klasörünü denetleyin, sonra sihirbazda çalıştırmayı yeniden yapın.\n\nTeknik ayrıntı: %s
script.c0db56a2492e=tiles.json okunamadı. Python adımı bu dosyayı eksiksiz yazmamış olabilir: çalışma günlüğünü ve çıktı klasörünü denetleyin, sonra sihirbazda çalıştırmayı yeniden yapın.\n\nTeknik ayrıntı: %s
script.02b28b3b1773=predictions.json okunamadı. Python adımı bu dosyayı eksiksiz yazmamış olabilir: çalışma günlüğünü ve çıktı klasörünü denetleyin, sonra sihirbazda çalıştırmayı yeniden yapın.\n\nTeknik ayrıntı: %s
script.6b795b8e0033=Seçili bölge görüntünün dışında kalıyor ya da alanı yok. Doku üzerine kapalı bir bölge çizin (dikdörtgen, çokgen ya da fırça aracıyla), seçin (sınırı sarı görünsün) ve yeniden çalıştırın.
script.2e7a6ab0b16e=Seçili bölgenin pikselleri okunamadı. Bölgeyi daha küçük çizip yeniden çalıştırın; sürerse görüntü dosyasına erişilebildiğini denetleyin (taşınmış dosya, bağlantısı kopmuş ağ sürücüsü).\n\nTeknik ayrıntı: readRegion null döndü.
script.1a93ae5e5aa7=GeoJSON çıktısı ayrıştırılamadı. HoVer-NeXt adımı çıktı dosyasını eksiksiz yazmamış olabilir: çalışma günlüğünü ve çıktı klasörünü denetleyin, sonra sihirbazda çalıştırmayı yeniden yapın.\n\nTeknik ayrıntı: %s
script.6ce019695f08=Görüntü tipi açık lamda değişti ama diske kaydedilemedi. Değişikliği kalıcı yapmak için QuPath ana penceresinde Ctrl+S ile kaydedin; kaydetmezseniz lamı yeniden açtığınızda eski tip geri gelebilir.\nTeknik ayrıntı: %s
script.df5879c3213b=Dosya ayrıştırılamadı. Dosyanın geçerli bir GeoJSON olduğunu ve başka bir programda açık olmadığını denetleyin; dosyayı üreten araçtan yeniden dışa aktarıp tekrar deneyin.\n\nTeknik ayrıntı: %s
script.eb9286a1e87a=Açık lam diske kaydedilemedi; matris o lamın son kayıtlı halinden üretildi. Güncel hali için QuPath ana penceresinde Ctrl+S ile kaydedin ve aracı yeniden çalıştırın.\nTeknik ayrıntı: %s
script.983ebf08a70e=GeoJSON dosyası okunamadı. Seçtiğiniz dosyanın bozulmamış bir .geojson (Sectra GSPS dışa aktarımı) olduğunu ve başka bir programda açık olmadığını denetleyin; dosya bozuksa dışa aktarmayı yeniden yapıp tekrar deneyin.\n\nTeknik ayrıntı: %s
script.57c3b4c3f2ef=Aracın ürettiği hizalanmış GeoJSON dosyası okunamadı. Dosyanın tam yazıldığını ve başka bir programda açık olmadığını denetleyin; gerekirse sihirbazda hizalama adımını yeniden çalıştırın.\n\nTeknik ayrıntı: %s
script.28e2923d500a=Sol paneldeki Project sekmesinden bir lama çift tıklayın veya bir lam dosyasını (.svs, .ndpi, .tiff) doğrudan QuPath penceresine sürükleyip bırakın.
script.5ac5f501fc16=Hoş geldiniz — QuPath arayüz turu
script.c42f174d2352=Bu tur QuPath arayüzünü adım adım tanıtır. Her sayfada bir öğe anlatılır; ilgili sekme, düğme ya da bölge canlı pencerede turuncu bir çerçeveyle işaretlenir. Bazı adımlarda ilgili komut örnek olarak kendiliğinden çalıştırılır (ör. Parlaklık/Kontrast diyaloğu açılır, Points aracı etkinleşir). En verimli kullanım için önce bir lam açın\u0020
script.65df2bf027c3=böylece görüntüleyici ve meta veri sekmeleri de dolu olur.\n\nİleri / Geri düğmeleriyle gezinin; sihirbaz penceresi her zaman üstte kalsın isterseniz alttaki "Üstte tut" kutusu işaretli kalsın. "Otomatik göster" kutusu, her sayfada vurgu ve örnek komutu kendiliğinden tetikler. Bu sihirbaz Pete Bankhead'in qupath-extension-training eklentisinden esinlenmiştir (son sayfadaki bağlantı).
script.a0ac9f6e6995=Görüntüleyici — lamın görüldüğü merkez alan
script.5a8103642ca9=Görüntüleyici, lamın görüntülendiği merkezdeki büyük alandır. WSI'yi Google Haritalar gibi bir çözünürlük piramidi üzerinde gezersiniz: fare tekerleğiyle yakınlaşıp uzaklaşır, Move aracı etkinken tıklayıp sürükleyerek kaydırırsınız. Tüm tespit ve anotasyonlar bu alanın üzerine çizilir. Tüm lamı pencereye sığdırmak için View → Zoom → Zoom to fit.
script.904a5d4792e7=Genel bakış navigatörü (görüntüleyicinin sağ-üst köşesi)
script.51f94b4922bb=Görüntüleyicinin sağ-üst köşesindeki küçük genel bakış (navigatör) penceresi, tüm lamdaki konumunuzu gösterir — yüksek büyütmede "kayboldum" hissini önler. Üzerindeki dikdörtgen şu an görünen alandır; küçük pencereye tıklayarak hızla başka bir bölgeye atlayabilirsiniz. Konumu sabittir — QuPath onu her zaman sağ-üst köşeye yerleştirir (taşınamaz). Ayarlanabilen tek şey görünürlüğüdür: View menüsünden ya da araç çubuğundaki görüntüleyici görünüm menüsünden (ekran/monitör simgesi) genel bakışı gösterip gizleyebilirsiniz. Not: "Bu bölgeyi vurgula" tüm görüntüleyiciyi çerçeveler; navigatör bu çerçevenin sağ-üst köşesindeki küçük kutudur (görüntünün üstüne çizildiği için ayrı olarak işaretlenemez).
script.9ab2ba2874e2=Kenar paneli — analiz sekmeleri
script.ae676bbe55d9=Sol kenardaki panel analizin kumanda merkezidir; sekmeler hâlinde düzenlenmiştir: Project, Image, Annotations, Hierarchy ve Workflow. Bir sekmeye tıklayarak o görünüme geçersiniz. Sonraki sayfalarda her sekmeyi tek tek tanıyacağız. Panel dar geldiğinde kenarından tutup genişletebilirsiniz.
script.e96bf140c032=Project sekmesi — lam listesi
script.22efbeaa58e6=Project sekmesi, projedeki tüm lamları küçük resimleriyle listeler. Bir küçük resme çift tıklamak lamı görüntüleyicide açar; sağ tıklamak açıklama ekleme, görüntü tipi atama gibi işlemleri sunar. Projeler birden çok lamı bir arada tutmanın ve aynı analizi hepsine uygulamanın profesyonel yoludur. Henüz proje açmadıysanız bu sekme boş görünür.
script.6d57b33e67dd=Image sekmesi — piksel boyutu ve meta veri
script.dacefe61002e=Image sekmesi açık lamın meta verisini gösterir: piksel boyutu (µm/px), görüntü boyutları, tarayıcı modeli ve boya tipi. Buradaki en kritik sayı piksel boyutudur — QuPath fiziksel ölçeği buradan bilir ve her tespit/ölçüm buna bağlıdır. 1.0 µm/px görüyorsanız meta veri eksik demektir; Giriş modülündeki kalibrasyon adımına dönün. Görüntü tipi (Brightfield H&E / H-DAB / Fluorescence) de bu sekmede görünür ve boya ayrımını belirler.
script.237946e06110=Annotations sekmesi — çizilen ROI'ler ve sınıflar
script.7c9e7eb1969d=Annotations sekmesi, elle veya algoritmayla oluşturulan tüm ROI'leri (ilgi bölgelerini) ve onların sınıflarını listeler. Bir anotasyona tıklamak onu görüntüleyicide seçer; sağ tıklamayla sınıf atayabilir, ad verebilir veya silebilirsiniz. Tümör, stroma gibi sınıflar burada renklerle yönetilir.
script.08f2ef217f06=Hierarchy sekmesi — nesne ağacı (anotasyon → tespit)
script.29ffbfb5cce2=Hierarchy sekmesi nesnelerin ağaç yapısını gösterir: lam → anotasyon → tespit. Bir anotasyonun içinde bulunan hücre tespitleri bu ağaçta onun altında yer alır. Anotasyon ile tespit arasındaki fark burada görünür hâle gelir: anotasyon elle çizilen bölgedir, tespit ise algoritmanın bulduğu nesnedir ve daima bir anotasyonun içindedir.
script.32fdd39ff186=Workflow sekmesi — yaptıklarınızın kaydı
script.345d3241ab28=Workflow sekmesi, oturumda yaptığınız işlemleri sırayla kaydeder — bir tür otomatik günlük. Buradan tüm adımları yeniden çalıştırılabilir bir Groovy betiğine dönüştürebilirsiniz (Create script), böylece aynı analizi başka lamlara tekrarlamak kolaylaşır. Bir girdiye çift tıklamak o komutu aynı ayarlarla yeniden açar.
script.cdab116fd393=Araç çubuğu — genel bakış
script.9ef157ff5a11=Üstteki araç çubuğu en sık kullanılan komutları tek tıkla sunar: gezinme ve çizim araçları, parlaklık/kontrast, görünürlük anahtarları, ölçüm tabloları ve betik editörü. Bir düğmenin üzerine gelip beklerseniz adını ve kısayolunu gösteren ipucu belirir. Sonraki sayfalarda öne çıkan düğmeleri tanıyacağız.
script.cb78071c9a40=Çizim araçları — Move, Rectangle, Polygon, Brush, Wand
script.5ca0299c8177=Çizim araçları araç çubuğunda yan yana durur: Move (gezinme, kısayol M), Rectangle (R), Ellipse (O), Polygon (P), Brush (fırça, B) ve Wand (kenar takipli sihirli değnek, W). Bir bölge çizmek için ilgili aracı seçip görüntüleyicide sürüklersiniz. İş bitince Move aracına dönmek iyi alışkanlıktır — yoksa yanlışlıkla yeni anotasyon çizebilirsiniz. (Bu adım örnek olarak Move aracını etkinleştirir.)
script.c38d2983351b=Points — sayım / işaretleme aracı
script.295906432abf=Points (nokta) aracı, tek tek hücreleri elle işaretleyip saymak için kullanılır — örneğin bir referans sayımı yaparken. Her tıklama bir nokta bırakır; farklı sınıflar için ayrı nokta kümeleri oluşturabilirsiniz. Bu, otomatik tespitin doğruluğunu gözle denetlemenin pratik bir yoludur. (Bu adım örnek olarak Points aracını etkinleştirir.)
script.6cbb07189bc3=Alıştırma — bir DİKDÖRTGEN çizin
script.3bdaf922a3cf=Sıra sizde! Rectangle (R) aracı sizin için seçildi. Görüntü üzerinde tıklayıp sürükleyerek bir dikdörtgen anotasyon çizin. Sihirbaz çizimi algılayınca kendiliğinden bir sonraki alıştırmaya geçer. (Bu alıştırma açık bir lam ister; istemezseniz "İleri ▶" ile atlayabilirsiniz.)
script.fb8bc6b41545=Alıştırma — bir ELİPS çizin
script.ea5369c5b04a=Ellipse (O) aracı seçildi. Görüntü üzerinde tıklayıp sürükleyerek bir elips çizin. Shift ile sürüklerseniz daire olur. Çizim algılanınca otomatik ilerlenir.
script.e36003708bf9=Alıştırma — bir POLİGON çizin
script.be606e4f6b83=Polygon (P) aracı seçildi. Köşelere tek tek tıklayarak bir çokgen oluşturun; çift tıklayarak (ya da ilk noktaya dönerek) kapatın. İsterseniz tıklayıp sürükleyip bırakarak da çizebilirsiniz. Poligon tamamlanınca otomatik ilerlenir.
script.e9dcec55bf7c=Alıştırma — NOKTA ekleyin
script.3cbe2f1eadfb=Points aracı seçildi. Görüntüye tıklayarak bir veya birkaç nokta işaretleyin (sayım/işaretleme için kullanılır). Nokta ekleyince alttaki mesaj güncellenir; "İleri ▶" ile tura devam edin. Tebrikler — beş çizim aracını da denediniz!
script.385528c958ff=Seçim modu — çizmek yerine nesne seçmek
script.bda6c09402f6=Seçim modu (Selection mode) düğmesi, araçların davranışını "çizme"den "seçme"ye çevirir. Açıkken, çizim aracıyla sürüklediğiniz alan yeni bir anotasyon oluşturmaz; o alana düşen mevcut nesneleri seçer. Çok sayıda hücre veya anotasyonu toplu işlemek için kullanışlıdır. (Bu adım örnek olarak seçim modunu açar; tur kapanınca eski durumu geri yükler.)
script.6056e2ddcf11=Parlaklık & Kontrast — yalnızca ekranı değiştirir
script.866bf6eb5b76=Parlaklık & Kontrast diyaloğu (araç çubuğundaki güneş simgesi ya da Shift+C) yalnızca ekranda gördüğünüzü değiştirir; analizde kullanılan piksel değerlerine dokunmaz. Kontrastı rahatça oynatabilirsiniz — ölçümleriniz etkilenmez. H&E'de R/G/B kanallarını, H-DAB'de hematoksilen/DAB kanallarını açıp kapatarak sinyali ayırt edebilirsiniz. (Bu adım diyaloğu örnek olarak açar.)
script.dbd81eb0091d=Görünürlük: anotasyon/tespit göster-gizle, doldur
script.00c6061acb0e=Araç çubuğundaki görünürlük anahtarları kalabalık bir lamda neyi gördüğünüzü denetler: anotasyonları göster/gizle, tespitleri göster/gizle ve bunların içini doldur/boşalt. Binlerce hücre dış çizgisini "doldurulmuş" yapmak uzaktan dağılımı çok daha okunaklı kılar. Bağlantıları (connections) ve sınıflandırma kaplamasını da buradan açıp kapatırsınız. (Bu anahtarlar yalnızca vurgulanır; tetiklenirse nesneleri gizleyeceği için otomatik çalıştırılmaz.)
script.851924a132eb=Opaklık kaydırıcısı — kaplama saydamlığı
script.99f8427f435f=Opaklık kaydırıcısı, nesne ve sınıflandırma kaplamalarının saydamlığını ayarlar. Sola çekince kaplama silikleşir ve altındaki H&E daha çok görünür; sağa çekince kaplama belirginleşir. Bir piksel sınıflandırıcı maskesinin altındaki dokuyu kontrol ederken çok işe yarar.
script.ad1478919b5c=Ölçüm tabloları
script.bf10e9188237=Ölçüm tabloları düğmesi, seçili nesnelerin (anotasyon veya tespit) tüm ölçümlerini bir tabloda açar: alan, sayım, yoğunluk, boya optik yoğunluğu ve daha fazlası. Tablodaki bir satıra tıklamak ilgili nesneyi görüntüleyicide seçer. Bu tablolar dışa aktarmanın (Veri dışa aktarma modülü) temelidir. (Bu adım düğmenin menüsünü örnek olarak açar.)
script.6d8fa6fe8412=Betik düzenleyicisi — betikler ve konsol
script.948d5b2a6078=Betik düzenleyicisi (Script editor), QuPath'in Groovy konsoludur; tekrar eden işleri otomatikleştirmenin yoludur. Atölye eklentisinin tüm yardımcıları aslında buradan çalışan betiklerdir. Menüden Automate → Script editor ile de açılır. Korkmayın — çoğu işi menülerden yapabilirsiniz; betikler yalnızca tekrar ve ölçeklenme içindir. (Bu adım editörü örnek olarak açar.)
script.bc9428240283=Command List (Ctrl/⌘+L) — en hızlı navigasyon
script.cb1b72a4c6c8=Command List (Ctrl+L / ⌘+L), QuPath'in "komut paleti"dir: aratabileceğiniz bir pencere açar, menüleri gezmek yerine komutun adını yazıp çalıştırırsınız. "cell detection", "estimate stain vectors", "brightness" gibi aramalar menü yolunu ezberleme yükünü ortadan kaldırır. Bir komutu hatırlamadığınızda ilk refleksiniz bu olsun. (Bu adım Command List'i örnek olarak açar — bir araç çubuğu düğmesi değil, klavye kısayoludur; pencereyi kapatıp devam edin.)
script.23b149508e41=qupath-extension-training — resmî tur eklentisi (GitHub) ↗
script.5f614c5d208d=Tur tamam — sıradaki adımlar
script.39578be112a8=Turu tamamladınız. Bu sayfaların yazılı karşılığı, panel tablosu ve klavye kısayolları için QuPath'e Giriş — Arayüz turu bölümüne bakın. Daha derin, İngilizce ve buton-düzeyinde canlı vurgulu resmî tur için Pete Bankhead'in qupath-extension-training eklentisini kurabilirsiniz (aşağıdaki bağlantı). Sıradaki adım: Hücre Tespiti.\n\n⚠️ Bu sihirbaz yalnızca eğitim amaçlıdır; ölçüm veya klinik karar üretmez.
