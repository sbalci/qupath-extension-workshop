script.1040d592403d=Yalnız karo listesi (görüntü dosyası yazma)
script.98d64a817ebb=Önizleme görseli yaz (onizleme__<lam>.jpg)
script.f1a635a0162a=Bu klasörün altına, ayarları adında taşıyan bir küme klasörü açılır (karo_<boyut>px_<µm>um_ov<örtüşme>).
script.58df8e6cd188=Klasör düzeni:
script.4e822a8e755a=Derin öğrenme araçlarının çoğu <sınıf>/<dosya> bekler. Lam klasörü, lam düzeyinde bölmeyi kolaylaştırır.
script.84748e372086=<lam>__<Etiket>__ds<d>_x<X>_y<Y>. Kapalıysa: <lam>__ds<d>_x<X>_y<Y>.
script.80d2b88cd043=Açıksa bölme de dosya adına girer: <lam>__<bölme>__<Etiket>__…
script.d434f4a2895e=Karolar diske yazılmaz; yalnız koordinat listesi üretilir. Karoları sonradan kendi kodunuzla lamdan okursunuz (disk yeri ve kopya sorunu olmaz).
script.139d2010266b=Önizleme:
script.047616b9b247=Lamın küçük görüntüsü üzerinde yazılan karoların kutuları, etikete göre renkli. Dışa aktarımı gözle denetlemek için.
script.04ba91cd4df6=Karo listesi:
script.496470bc4e64=Her karo için bir satır: bölme, etiket, x, y, kapsama, dosya. Eğitimde klasörü değil bu listeyi kullanın.
script.10a585663b48=Üst veride bölme varsa HER ZAMAN okunur ve klasörlerin başına <Bölme>/ düzeyi gelir (train / val / test). Bölme yoksa bu düzey açılmaz.
script.0015bf40b9f7=Bölme anahtarları:
script.0a127b1e8d21=Önce anotasyonun, yoksa proje girdisinin üst verisinde aranır. Virgülle ayırın.
script.0290919acbbe=Hasta anahtarları:
script.3cf02b584048=Proje girdisinin üst verisinde hasta kimliğini taşıyan anahtarlar. Virgülle ayırın.
script.07acb8ed805e=Elle (ayarları ben seçerim)
script.79b872a2b147=Hiçbir ayara dokunulmaz. Diğer sekmelerde her şeyi kendiniz belirlersiniz.
script.6d0d550fbb7f=Karo sınıflandırma / lam düzeyi model (MIL)
script.e4ffb6e69c80=Örtüşme 0: aynı doku iki kez sayılmaz ve karolar arası ortak piksel olmaz.\n
script.15b89aa1087d=En az kapsama 50: çoğu arka plan ya da komşu bölge olan kenar karoları elenir.\n
script.accea3191a6b=Her lam aynı µm/px ile kesilir; 20× ve 40× taramalar aynı fiziksel alanı verir.
script.9ac0979c6429=Temel model (foundation model) ile özellik çıkarımı
script.6eee032e900d=Yaygın başlangıç: 224 px, 0,5 µm/px. ÖNCE model kartına bakın: karo boyutu ve µm/px modelin eğitildiği\n
script.496bf826f1f8=değerle aynı olmalıdır. Yanlış ölçekte model hata vermez, yanlış cevap verir.\n
script.54555cad1a86=Örtüşme 0: gömmeler lam düzeyinde toplanırken aynı doku iki kez ağırlık almaz.
script.d5463859d11d=Segmentasyon eğitimi (görüntü + maske)
script.6ef6daa0916f=Maske modu: her karoya eşleşen etiket maskesi yazılır (PNG zorunlu; JPG etiket değerlerini bozar).\n
script.36dc67156acc=Örtüşme 64 px: karo kenarında kesilen yapılar komşu karoda bütün görünür.\n
script.baa800711124=Kapsama 0: sınır karoları da gerekir; model sınırı öğrenir.
script.b8df358264a2=Hücre / çekirdek düzeyi eğitim
script.7994f09cb462=Hücre ayrıntısı için ince ölçek (≈ 0,25 µm/px, 40×). Lamın kendi µm/px değerinden ince ölçek yeni ayrıntı üretmez.\n
script.23bbc4f239aa=Küçük örtüşme: kenarda yarım kalan çekirdek komşu karoda bütündür.
script.550b104ad31f=Paylaşmak için karolar
script.2f452fa46f7f=Örtüşme 0: paylaşılan karolar arasında ortak bilgi olmamalıdır; karolardan lam yeniden kurulamamalıdır.\n
script.f4e68cd88337=Paylaşmadan önce dosya adlarına ve karo listesine bakın: lam adı kimlik taşımamalıdır.
