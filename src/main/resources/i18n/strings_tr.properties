script.1a1597c219e8=%,d görüntüde toplam %,d kopya grubu var: aynı özet lamda "ad", "ad (2)", "ad (3)" biçiminde yan yana duruyor. Kopyalar farklı sayılar içerebilir; hangisinin güncel olduğuna bu araç karar veremez.\n\nÖrnekler (lam · ad: kopya numaraları; 1 = numarasız ad):\n%s\n\n"Tüm kopyalar": her kopya kendi adıyla ayrı sütunlara yazılır ("ad · ölçüm", "ad (2) · ölçüm"); tabloya kopya bilgisi sütunu eklenir.\n\n"Yalnız en yenisi": her grupta yalnız en yüksek numaralı kopya tabloya girer. En yeni kopya kilitli değilse o grup tabloda hiç yer almaz. Lamdaki hiçbir şey silinmez.\n\nİptal: hiçbir şey yazılmaz.\n\nHangisi yazılsın?
