script.053cef2bd6fe=Warp hedefleri (ops., ÇOK-SEÇİM): kaynağın anotasyonu işaretli HER hedefe warp edilir (tek Python sürecinde, yeniden kayıt gerekmez). Kayıtlı bir hizalama varsa aşağıdaki "⚡ …" düğmesi yeniden KAYIT yapmadan yalnız warp'ı tekrar çalıştırıp OTOMATİK içe aktarır (merge/OME üretmez).
