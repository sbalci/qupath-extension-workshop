script.b48dce23d678=Öncekileri değiştir (bu yardımcının bölgelerinin tümü silinir)
script.2cef9c21c618=Önceki eşit alanlı bölgeler
script.345d108b15b1=Bu lamda bu yardımcının ürettiği %,d eşit alanlı bölge anotasyonu zaten var (sınıflar: %s; tüm kaynak alanlar için).\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni bölgelerin adlarının sonuna "(%d)" eklenir ve ayrı bir set olurlar. Lamda iki set birlikte durur; bölgeler üst üste biner.\n\n"Değiştir" seçilirse önceki bölgelerin TÜMÜ silinir — onlarda elle yaptığınız düzeltmeler de gider; bölgelerin içindeki hücre tespitleri ve diğer nesneler korunur. Elle çizdiğiniz ya da adını değiştirdiğiniz anotasyonlara dokunulmaz.\n\nİptal: hiçbir şey üretilmez, hiçbir şey yazılmaz.\n\nÖnceki bölgeler ne olsun?
script.4514d3b5f1bd=Önceki bölgeler silinecek
script.44bc4ade563e=%,d eşit alanlı bölge anotasyonu (%s; tüm kaynak alanlar için) silinecek; bölgelerde elle yaptığınız düzeltmeler KAYBOLUR. İçlerindeki nesneler korunur.\n\nDevam edilsin mi?
script.05748f3441b3=Bu lamda bu yardımcının ürettiği %,d eşit alanlı bölge anotasyonu (%s) zaten var. Hiçbir şey yazılmadı. Yeni bir set eklemek için -a mevcut=ekle, önceki bölgeleri değiştirmek için -a mevcut=degistir ile yeniden çalıştırın.
script.6d16aa739502=Bölge seti         : %d  (önceki set duruyor)
script.1167d104b3b2=DİKKAT — bu lamda önceki bölge seti de duruyor (%,d anotasyon: %s).\nHiçbir şey silinmedi. Eskisini kaldırmak için o bölgeleri seçip silin ya da yardımcıyı yeniden çalıştırırken "Öncekileri değiştir"i seçin. İki set üst üste biner; ikisinin içinde de çalışan bir analiz aynı bölgeyi iki kez sayabilir.
script.85eecb52630b=Önceki bölgeler değiştirildi: %,d anotasyon silindi (içlerindeki nesneler korundu).
script.a2d620f13645=Öncekini değiştir (bu betiğin ızgara kareleri ve özet anotasyonu silinir)
script.483dcf5a0d31=Önceki Ki-67 heterojenlik sonucu
script.fc0022c3c70a=Bu lamda bu betiğin ürettiği %,d anotasyon zaten var (ızgara kareleri ve özet).\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni sonuç ayrı bir set olur ("Ki-67 grid (2) 0,0" ve "Ki-67 Heterojenlik Özet (2)" gibi). Lamda iki set birlikte durur; dışa aktarım ve özetler ikisini de görür.\n\n"Değiştir" seçilirse önceki ızgara kareleri ve özet anotasyonu silinir. Kendi anotasyonlarınıza dokunulmaz; silinen karelerin içindeki nesneler korunur.\n\nİptal: hiçbir şey hesaplanmaz, hiçbir şey yazılmaz.\n\nÖnceki sonuç ne olsun?
script.fa2d2d520f90=Önceki Ki-67 heterojenlik sonucu silinecek
script.04bb9562edac=%,d anotasyon silinecek: bu betiğin önceki ızgara kareleri ve özet anotasyonu (adı "Ki-67 grid …" ya da "Ki-67 Heterojenlik Özet" olanlar). Bu adlardan birini kendiniz verdiyseniz o anotasyon da silinir; karelerde elle yaptığınız değişiklikler kaybolur. Karelerin içindeki nesneler korunur.\n\nDevam edilsin mi?
script.54ea69e92480=Bu lamda bu betiğin önceki sonucu zaten var (%,d anotasyon). Hiçbir şey yazılmadı. Yeni bir set eklemek için mevcut=ekle, önceki sonucu değiştirmek için mevcut=degistir ile yeniden çalıştırın.
script.b880deb01e0a=DİKKAT — önceki sonuç hâlâ lamda duruyor: %s. Hiçbir şey silinmedi. Eski seti kaldırmak için o addaki anotasyonları seçip silin ya da betiği yeniden çalıştırıp "Öncekini değiştir"i seçin. Dışa aktarım ve özetler iki seti de görür.\nBu çalıştırmanın özeti: %s
script.d0cc14f27b20=Önceki sonuç değiştirildi: %,d anotasyon silindi (içlerindeki nesneler korundu).
script.6c29143b08ce=Önceki yoğunluk haritası sonucu
script.e087287a1920=Bu lamda bu betiğin ürettiği %,d anotasyon zaten var (ızgara kareleri ve özet).\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni sonuç ayrı bir set olur ("Yoğunluk grid (2) 0,0" ve "Yoğunluk Özet (2)" gibi). Lamda iki set birlikte durur; dışa aktarım ve özetler ikisini de görür.\n\n"Değiştir" seçilirse önceki ızgara kareleri ve özet anotasyonu silinir. Kendi anotasyonlarınıza dokunulmaz; silinen karelerin içindeki nesneler korunur.\n\nİptal: hiçbir şey hesaplanmaz, hiçbir şey yazılmaz.\n\nÖnceki sonuç ne olsun?
script.7ac01d7e1a49=Önceki yoğunluk haritası sonucu silinecek
script.89d4eec58021=%,d anotasyon silinecek: bu betiğin önceki ızgara kareleri ve özet anotasyonu (adı "Yoğunluk grid …" ya da "Yoğunluk Özet" olanlar). Bu adlardan birini kendiniz verdiyseniz o anotasyon da silinir; karelerde elle yaptığınız değişiklikler kaybolur. Karelerin içindeki nesneler korunur.\n\nDevam edilsin mi?
script.bdcd95fa9aa5=Öncekine dokunma — yeni ızgarayı ayrı bir set olarak ekle (varsayılan)
script.ade103dec9d5=Öncekini değiştir (başka oturumdan kalan kalibrasyon ızgarası kareleri silinir)
script.c77c2e120b24=Lamda önceki kalibrasyon ızgarası var
script.a29b2b6957f7=Bu lamda, bu pencerenin koymadığı %,d kalibrasyon ızgarası karesi duruyor (başka bir pencereden ya da yarım kalmış bir oturumdan).\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni ızgara ayrı bir set olarak (adının sonunda "(2)" ile) üstüne konur ve iki ızgara üst üste görünür.\n\n"Değiştir" seçilirse o kareler silinir. Kendi anotasyonlarınıza dokunulmaz; karelerin içindeki nesneler korunur.\n\nİptal: ızgara konmaz, hiçbir şey yazılmaz.\n\nÖnceki ızgara ne olsun?
script.22f589664598=Önceki kalibrasyon ızgarası silinecek
script.e53de638f38c=%,d kalibrasyon ızgarası karesi silinecek: adı "__GozKarariKalibrasyonIzgarasi__" olan (ya da sonunda "(2)", "(3)" … bulunan) anotasyonlar. Bu adı kendiniz verdiyseniz o anotasyon da silinir. Karelerin içindeki nesneler korunur.\n\nDevam edilsin mi?
script.70c393244c98=Önceki kalibrasyon ızgarası değiştirildi: %,d kare silindi (içlerindeki nesneler korundu).
script.83a780dc32ca=DİKKAT — önceki kalibrasyon ızgarası hâlâ lamda duruyor: %s. Hiçbir şey silinmedi; yeni ızgara şu adı taşıyor: %s. Eskisini kaldırmak için o addaki anotasyonları seçip silin.
script.8a4dae7d669e=Her karo, sınıfına göre renkli ve kilitli bir ALT-TESPİT olarak, tek bir '%s' anotasyonunun altına yazıldı. '%s' ve tür olasılıkları Measurements panelinde.
script.cf2b125acbd1=DİKKAT — bu lamda önceki HistoART sonucu da duruyor: %s. Hiçbir şey silinmedi. Eski seti kaldırmak için o addaki anotasyonu (alt tespitleriyle birlikte) seçip silin ya da sihirbazı yeniden çalıştırıp "Öncekini değiştir"i seçin. Dışa aktarım ve kohort özetleri iki seti de görür.
script.efe4b0cffe78=Önceki HistoART sonucu değiştirildi: %,d set ve %,d karo tespiti silindi (setlerin altındaki başka nesneler korundu).
script.c2802cff0e95=Bu lamda önceki HistoART sonucu var (%,d set). Sihirbaz başsız kipte çalışmaz ve hiçbir şey yazmaz; QuPath arayüzünde çalıştırırsanız önceki sonuç için Ekle, Değiştir ya da İptal sorulur.
script.29368035df4e=Öncekini değiştir (bu sihirbazın HistoART setleri ve karo tespitleri silinir)
script.888850ebecac=Önceki HistoART sonucu
script.396142d67414=Bu lamda zaten %,d HistoART sonuç seti var (toplam %,d karo tespiti).\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni sonuç ayrı bir set olur ("HistoART KK (2)" gibi). Lamda iki set birlikte durur; dışa aktarım ve özetler ikisini de görür.\n\n"Değiştir" seçilirse önceki HistoART setleri ve altındaki karo tespitleri silinir. Kendi anotasyonlarınıza dokunulmaz; setlerin altına kendiniz koyduğunuz başka nesneler korunur.\n\nİptal: hiçbir şey çalıştırılmaz, hiçbir şey yazılmaz.\n\nÖnceki sonuç ne olsun?
script.ab565bd39998=Önceki HistoART sonucu silinecek
script.c8ad460799f4=%,d HistoART seti ve altındaki %,d karo tespiti silinecek (adı "HistoART KK" ya da "HistoART KK (2)", "(3)" … olan anotasyonlar). Bu adı kendiniz verdiyseniz o anotasyon da silinir; karo tespitlerinde elle yaptığınız sınıf düzeltmeleri kaybolur. Setlerin altındaki başka nesneler korunur.\n\nDevam edilsin mi?
script.0f11d2259312=Bu lamda önceki bir Ki-67 sonucu var ve ne yapılacağı belirtilmedi. Hiçbir şey yazılmadı.
script.c4402f967aba=Özet anotasyonu: %s. Bu lamda önceki Ki-67 sonucu da duruyor: %s. Hiçbir şey silinmedi; eski özeti kaldırmak için o addaki anotasyonu seçip silin ya da bir sonraki çalıştırmada "Değiştir"i seçin. Tumor anotasyonlarınıza yazılan ölçümler (ROI alanı, çekirdek sayıları, Ki-67 pozitif yüzdesi ve yoğunluk) BU çalıştırmayı gösterir; önceki özet anotasyonu eski değerleri göstermeye devam eder.
script.46f3c5cb9752=Önceki sonuç değiştirildi: %,d özet anotasyonu ve doğrudan içlerindeki %,d hücre tespiti silindi (özetlerin içindeki anotasyonlar korundu).
script.37eb5f471b98=Bu bölgenin altında önceki tespitler var ve ne yapılacağı belirtilmedi. Hiçbir şey silinmedi.
script.6ed907313908=Bu ölçümler "%s" anotasyonuna yazıldı. Özgün bölgedeki önceki tespitler ve ölçümler değişmedi; bu sayılar yalnız bu çalıştırmayı gösterir.
script.02e697219cf5=Bu lamda bu betiğin oluşturduğu %,d "Ki-67 Tümör Özet" anotasyonu zaten var. Hiçbir şey yazılmadı. Yeni bir özet eklemek için -a mevcut=ekle, önceki sonucu değiştirmek için -a mevcut=degistir ile yeniden çalıştırın.
script.718cddc070e2=Değiştir — önceki özet ve doğrudan içindeki hücre tespitleri silinir
script.430d53352d5b=Önceki Ki-67 sonucu
script.f6ee0826b713=Bu lamda zaten %,d "Ki-67 Tümör Özet" anotasyonu var (doğrudan içlerinde toplam %,d hücre tespiti).\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni sonuç ayrı bir özet olur ("Ki-67 Tümör Özet (2)" gibi). Lamda iki sonuç birlikte durur.\n\n"Değiştir" seçilirse yeni ölçüm başarıyla bittikten sonra önceki özet anotasyonları ve doğrudan içlerindeki hücre tespitleri silinir — bu tespitlerde elle yaptığınız düzeltmeler de gider. Özetlerin içine çizdiğiniz diğer anotasyonlara dokunulmaz.\n\nİptal: hiçbir şey çalıştırılmaz, hiçbir şey yazılmaz.\n\nÖnceki Ki-67 sonucu ne olsun?
script.fff8bd9bffe0=Önceki Ki-67 sonucu silinecek
script.327217399e62=%,d "Ki-67 Tümör Özet" anotasyonu ile doğrudan içlerindeki %,d hücre tespiti silinecek. Bu tespitlerde elle yaptığınız düzeltmeler KAYBOLUR. Bu adı elle verdiğiniz bir anotasyon da, betiğin kendi özetinden ayırt edilemediği için silinir. Özetlerin içindeki diğer anotasyonlar korunur.\n\nDevam edilsin mi?
script.c13fa0d17d1c=Ekle — öncekine dokunma, tespiti alanın yeni bir kopyasında yap (varsayılan)
script.7bdb766199cb=Değiştir — bu bölgenin altındaki önceki tespitler silinir
script.33c0a605d048=Bölgede önceki tespitler var
script.8a73b3757999=Seçili bölgenin altında zaten %,d hücre tespiti var.\n\n"Ekle" seçilirse hiçbir şey silinmez; tespit, aynı alanın yeni bir kopyasında ("Ki-67 tespit alanı" adlı anotasyon) yapılır ve sonraki adımlar o kopya üzerinde çalışır. Özgün bölge ve altındaki tespitler olduğu gibi kalır.\n\n"Değiştir" seçilirse bu bölgenin altındaki tespitler silinip yeniden üretilir. Tespitlerin nereden geldiği ayırt edilemez; başka bir modülle ya da elle eklenenler de silinir. Başka anotasyonların altındaki tespitlere dokunulmaz.\n\nİptal: hiçbir şey çalıştırılmaz, hiçbir şey yazılmaz.\n\nBölgedeki önceki tespitler ne olsun?
script.633240bd9ac7=Bölgedeki önceki tespitler silinecek
script.1dbc7aae12f6=Seçili bölgenin altındaki %,d hücre tespiti silinecek. Başka bir modülle ya da elle eklenenler ve elle yaptığınız düzeltmeler dahil KAYBOLUR. Yeni tespit hiç hücre bulamazsa silinenler geri konur.\n\nDevam edilsin mi?
script.c48f60adadd6=Bu lamda önceki bir "Ki-67 Tümör Özet" varsa, çalıştırmadan önce ne yapılacağı sorulur (varsayılan: hiçbir şey silinmez). Eşikleri değiştirip tekrar çalıştırabilirsiniz.
script.b88983480b0a=Bu bölgede önceki tespitler vardı ve hiçbirine dokunulmadı: yeni tespit "%s" anotasyonunda yapıldı. Sonraki adımlar (sınıflandırıcı ve yoğunluk) yalnız bu kopyada çalışır; önceki tespitler özgün bölgede duruyor. Eski olanı kaldırmak için o anotasyonu ya da altındaki tespitleri kendiniz silin.
script.c9e2eebbf5ad=Önceki sonuç değiştirildi: bölgenin altındaki %,d hücre tespiti silindi.
script.d1e6a0b30433=Bu lamda önceki bir Tümör/Stroma sonucu var ve ne yapılacağı belirtilmedi. Hiçbir şey yazılmadı.
script.98b0476bc643=ÖNCEKİ SONUÇ DURUYOR\nYeni sonuç: %s. Bu lamda önceki Tümör/Stroma sonucu da duruyor: %s. Hiçbir şey silinmedi; eski sonucu kaldırmak için o özet anotasyonunu (ve sınıf bölgelerini) seçip silin ya da bir sonraki çalıştırmada "Değiştir"i seçin. Yukarıdaki sayılar yalnız yeni çalıştırmayı gösterir; önceki özet anotasyonu eski değerleri göstermeye devam eder.
script.c926444eface=Ekle — öncekine dokunma, yeni bir sonuç olarak ekle (varsayılan)
script.a43bd962f751=Önceki Tümör/Stroma sonucu
script.f5c14d171336=Bu lamda bu betiğin oluşturduğu önceki bir Tümör/Stroma sonucu zaten var (%,d). Hiçbir şey yazılmadı. Yeni bir özet eklemek için -a mevcut=ekle, önceki sonucu değiştirmek için -a mevcut=degistir ile yeniden çalıştırın.
script.eebc097a5825=ÖNCEKİ SONUÇ DURUYOR\nÖzet anotasyonu: %s. Bu lamda önceki Tümör/Stroma sonucu da duruyor: %s. Hiçbir şey silinmedi; eski sonucu kaldırmak için o özet anotasyonunu seçip silin ya da bir sonraki çalıştırmada "Değiştir"i seçin. Seçtiğiniz bölge anotasyonlarına ölçüm yazıldıysa o ölçümler BU çalıştırmayı gösterir; önceki özet anotasyonu eski değerleri göstermeye devam eder.
script.665d4074c4fe=Mevcut hücrelere dokunma — tespiti çalıştırma (varsayılan)
script.6b4af35c53fe=Mevcut hücreleri değiştir — tespiti çalıştır
script.d0c7ed3d2fd2=Not: önceki %,d hücre değiştirildi.
script.25b257bce6d1=DURDU: -a mevcut için geçersiz değer "%s" (yalnızca degistir kabul edilir). Hiçbir şey değiştirilmedi.
script.b1cf692ac056=DURDU: hedef anotasyonda zaten %,d hücre tespiti var. Hiçbir şey değiştirilmedi. Bu hücrelerin (elle yapılmış sınıf ve düzeltmeler dahil) değiştirilmesini kabul ediyorsanız -a mevcut=degistir ile yeniden çalıştırın.
script.461bbed70a95=Seçili anotasyonda zaten %,d hücre bulunuyor; tespit bunları, elle yapılmış sınıf ve düzeltmeler dahil, değiştirecek.\n\nYalnız eşikleri değiştirmek istiyorsanız "İptal" deyip "Yeniden say (hızlı)" düğmesini kullanın; bu düğme hücreleri silmez.\n\nDevam edilsin mi? ("Tamam" = değiştir, "İptal" = hiçbir şey çalıştırılmaz)
script.0bce6aa77f6b=İptal edildi — hiçbir şey çalıştırılmadı, mevcut hücreler korundu.
script.24b91d6d005b=Seçili anotasyon(lar)da zaten %,d hücre tespiti var. Hiçbir şey yazılmadı. Bu hücreleri değiştirmek için -a mevcut=degistir ile yeniden çalıştırın.
script.0187c58bc6df=İptal edildi — hiçbir şey çalıştırılmadı, hiçbir şey değişmedi.
script.cb7f8ecd03c8=Seçili anotasyon(lar)da zaten %,d hücre var. Tespit bu hücrelerin yerini alacak; elle verdiğiniz sınıflar ve düzeltmeler de gider.\n\nDevam edilsin mi?\n\n"Hayır" derseniz hiçbir şey çalıştırılmaz ve hiçbir şey değişmez.
script.784fe373ea77=Önceki %,d hücre değiştirildi.
script.917f37316768=Stroma anotasyonlarında zaten %,d hücre tespiti var. Hiçbir şey yazılmadı. Bu hücreleri değiştirmek için -a mevcut=degistir ile yeniden çalıştırın.
script.d500c84220ca=Stroma anotasyonlarında zaten %,d hücre var. Tespit bu hücrelerin yerini alacak; elle verdiğiniz sınıflar ve düzeltmeler de gider.\n\nDevam edilsin mi?\n\n"Hayır" derseniz hiçbir şey çalıştırılmaz ve hiçbir şey değişmez.
script.df3a81761ec8=Seçili anotasyonda zaten %,d hücre var. Tespit bu hücrelerin yerini alacak; elle verdiğiniz sınıflar ve düzeltmeler de gider.\n\nDevam edilsin mi?\n\n"Hayır" derseniz hiçbir şey çalıştırılmaz ve hiçbir şey değişmez.
script.5383f68a2a7d=HATA: mevcut yalnız 'degistir' olabilir (verilen: %s). Hiçbir şey yazılmadı.
script.60b4a54b41fb=Seçili anotasyonda zaten %,d hücre tespiti var. Hiçbir şey yazılmadı. Bu hücreleri değiştirmek için -a mevcut=degistir ile yeniden çalıştırın.
script.e2b40df41cb4=Seçili TCR anotasyonunda zaten %,d hücre var. Tespit bu hücrelerin yerini alacak; elle verdiğiniz sınıflar ve düzeltmeler de gider.\n\nDevam edilsin mi?\n\n"Hayır" derseniz hiçbir şey çalıştırılmaz ve hiçbir şey değişmez.
script.2c044d4d8901=Seçili TCR anotasyonunda zaten %,d hücre tespiti var. Hiçbir şey yazılmadı. Bu hücreleri değiştirmek için -a mevcut=degistir ile yeniden çalıştırın.
script.320920522b08=Değiştir — önceki sınıf bölgeleri silinir; özet bölgeniz korunur ve aynı anotasyonda yeniden ölçülür
script.c30e648eac1e=Bu lamda zaten %,d Tümör-Stroma özeti var; Değiştir seçilirse silinebilecek sınıf bölgesi sayısı: %,d.\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni sonuç ayrı bir özet olur ("Tümör-Stroma Özet (2)" gibi) ve kendi sınıf bölgelerini taşır. Önceki özetler değişmeden kalır.\n\n"Değiştir" seçilirse bu modülün ürettiği önceki Tumor/Stroma sınıf bölgeleri silinir — onlarda elle yaptığınız düzeltmeler de gider. Özet olarak kullanılan bölgeniz ASLA silinmez: çizgisi, adı ve sınıfı korunur, yalnızca ölçümleri aynı anotasyonda yeniden hesaplanır. Yalnızca aracın kendi oluşturduğu eski özet anotasyonları silinir; bu araçla işaretlenmemiş (eski sürümden kalma) özetler olduğu gibi kalır. İçlerindeki diğer nesneler (hücre tespitleri, kendi anotasyonlarınız) silinmez.\n\nİptal: hiçbir şey çalıştırılmaz, hiçbir şey yazılmaz.\n\nÖnceki Tümör/Stroma sonucu ne olsun?
script.2c478add6c37=Önceki sınıf bölgeleri silinecek
script.f7a62bf61fe4=Bu lamda %,d Tümör-Stroma özeti var; %,d sınıf bölgesi silinecek. Sınıf bölgelerinde elle yaptığınız düzeltmeler KAYBOLUR. Özet olarak kullanılan bölgeniz silinmez: yerinde yeniden ölçülür. Yalnızca aracın kendi oluşturduğu eski özet anotasyonları silinir; sizin çizdiğiniz ya da işaretlenmemiş özetler korunur. İçlerindeki diğer nesneler de korunur.\n\nDevam edilsin mi?
script.04273d6ac80a=ÖNCEKİ SONUÇ DEĞİŞTİRİLDİ\n%,d sınıf bölgesi ve aracın kendi oluşturduğu %,d eski özet anotasyonu silindi (içlerindeki diğer nesneler korundu). Sizin çizdiğiniz bölge ya da işaretlenmemiş özet silinmedi; özet bölgesi korundu ve ölçümler onda yeniden hesaplandı.
script.a2c2f2d27f11=Bu lamda zaten %,d Tümör-Stroma özeti var; Değiştir seçilirse silinebilecek sınıf bölgesi sayısı: %,d.\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni sonuç ayrı bir özet olur ("Tümör-Stroma Özet (2)" gibi) ve kendi sınıf bölgelerini taşır (özet kapalıysa yeni bölgeler "Tumor (2)" gibi adlanır). Önceki özetler değişmeden kalır.\n\n"Değiştir" seçilirse bu sihirbazın ürettiği önceki Tumor/Stroma sınıf bölgeleri silinir — onlarda elle yaptığınız düzeltmeler de gider. Özet olarak kullanılan bölgeniz ASLA silinmez: çizgisi, adı ve sınıfı korunur, yalnızca ölçümleri aynı anotasyonda yeniden hesaplanır. Yalnızca aracın kendi oluşturduğu eski özet anotasyonları silinir; bu araçla işaretlenmemiş (eski sürümden kalma) özetler olduğu gibi kalır. İçlerindeki diğer nesneler (hücre tespitleri, kendi anotasyonlarınız) silinmez.\n\nİptal: hiçbir şey çalıştırılmaz, hiçbir şey yazılmaz.\n\nÖnceki Tümör/Stroma sonucu ne olsun?
script.96d140502a36=DURDU: bilinmeyen kopyalar değeri "%s". Geçerli değerler: hepsi | enyeni. Hiçbir şey dışa aktarılmadı.
