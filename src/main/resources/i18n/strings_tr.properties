script.5a0e444ce2a3=Anotasyon yok — arka plan/artefakt karoları gömmeyi/dikkati seyreltir. Önce doku maskesi/anotasyon çıkarın (bkz. Kalite Kontrol eki).
script.af351c8fee8e=Genelleme/batch etkisi: FM gömmeleri biyolojiden çok tarayıcı/merkez imzasını kodlayabilir (de Jong 2025). Çok-merkez doğrulayın; gerekirse boyama normalizasyonu (Boyama normalizasyonu eki) uygulayın.
script.6f3b61683409=Girdi bütünlüğü: FM çıktısı gözle görülmeyen düşmanca pertürbasyonlarla bozulabilir (UTAP — Wang ve ark. 2026). Yalnız güvenilir, değiştirilmemiş pikselleri besleyin; çıktıyı makullük açısından denetleyin.
script.76074ad52153=Doğrulama: hiçbir FM çıktısı, Yapay Zekâ Araçlarını Değerlendirme ekinin makullük/doğrulama kontrollerini geçmeden klinik karara dönüşmemeli.
script.f403fc30553d=\n⚠️ Yalnızca araştırma/eğitim amaçlı ölçüm üretir; klinik karar üretmez.
script.b6cfae86b4bd=Açık lam okunamadı:\u0020
script.9b0927a8bf3d=Görüntü işleme kavramları — kendi lamınızda
script.220d9ae88abc=Bu tur, dijital patolojide hücre tespitinin "perde arkasını" kendi açık lamınız üzerinde adım adım gösterir. En verimli kullanım için çekirdek içeren KÜÇÜK bir bölge (R aracı) çizip seçin; bir seçim yoksa görüntüleyici görünümü kullanılır. Önizlemeler salt okunurdur — lamınızı değiştirmez.\n\nKaynak: Pete Bankhead'in dijital patoloji için görüntü-işleme sözlüğü (CC-BY 4.0). Aynı kavramların atölyedeki karşılıkları için: Ek — Görüntü Analizi Temelleri.
script.77541b99a7d2=1 · Dijital görüntü ve LUT
script.6bd2b7b26c6b=Bir görüntü, her hücresi bir piksel değeri olan sayısal bir ızgaradır. Ekranda gördüğünüz renk, bu sayıların bir "bakış tablosu" (LUT — lookup table) ile boyanmış hâlidir. LUT ya da parlaklık/kontrast yalnız EKRANI değiştirir; analizde kullanılan piksel değerlerine dokunmaz. Solda özgün RGB, sağda aynı verinin gri (yoğunluk) gösterimi — veri aynı, görünüm farklı.
script.a17ad1020ef7=2 · RGB → kanallar
script.e128d75f9823=Bir RGB görüntüde her pikselin üç değeri vardır: kırmızı, yeşil, mavi. Bunlar ayrı yoğunluk düzlemleridir; toplanınca ekrandaki rengi verir. H&E'de hematoksilenin maviye yakın olması kırmızı kanalda koyu, mavi kanalda açık görünmesine yol açar — renk ayrımının temeli budur.
script.134b38eac0bf=3 · Renk dekonvolüsyonu (Hematoksilen + DAB/Eozin)
script.2bdab0b9ee96=Renk dekonvolüsyonu, RGB'yi boya rengine göre tek-kanallı yoğunluk görüntülerine ayırır (Ruifrok–Johnston). Solda hematoksilen, sağda ikinci boya (DAB/Eozin) yoğunluğu — koyu = çok boya.\n\nSınırlar (Bankhead): yöntem "imkânsız" sonuç verebilir (negatif boya değerleri); kuvvetli DAB-pozitif (kahverengi) pikseller genelde yüksek hematoksilen değeri de taşır. Doğru boya vektörü için: Yardımcılar → Boya ve renk → Boya vektörleri sihirbazı.
script.4cac2d8a0f94=4 · Gaussian filtre (σ)
script.680d9ae4b848=Gaussian filtre, her pikseli komşularının ağırlıklı ortalamasıyla değiştirerek gürültüyü azaltır. σ (sigma) büyüdükçe yumuşatma artar. Çok küçük σ tek çekirdeği parçalara bölebilir; çok büyük σ bitişik çekirdekleri birbirine karıştırır. (σ burada önizleme pikseli; QuPath'te µm.)\n\nHematoksilen kanalında soldan sağa artan σ — yumuşamanın etkisini izleyin.
script.723b960da15f=5 · Eşikleme → ikili (binary) görüntü
script.ac866a2671c5=Eşikleme, bir yoğunluk değerinin üstündeki pikselleri "ön plan" (beyaz), altındakileri "arka plan" (siyah) yapar. Aynı kanalda üç farklı eşik — eşik seçiminin bulunan nesnelerin sayısını ve şeklini ne kadar değiştirdiğine dikkat edin. Bankhead'in dersi: eşik TEK BAŞINA çekirdek tespiti için yetmez; devamında daha çok işlem (mesafe + watershed) gerekir.
script.0a1bc8ded132=6 · Mesafe dönüşümü + watershed
script.da1f1264ef91=İkili maskede birbirine değen çekirdekler tek bir nesneye yapışır. Mesafe dönüşümü, her ön plan pikseline en yakın arka plana olan uzaklığı atar — çekirdek merkezleri en yüksek değeri alır. Bu merkezler "tohum" olur; watershed bölgeleri tohumlardan büyütüp bitişik çekirdekleri ayırır (hepsini değil). Aşağıda eşiklenmiş maske + tahmini merkezler (mesafe tepe noktaları) işaretli. Gerçek bölme QuPath'in watershed tespitinde olur: Hücre tespiti modülü.
script.1a6c1dcf6571=7 · İş akışını birleştir — bu, Hücre tespiti modülüdür
script.86296f1f8b47=Bu adımları birleştirince bir hücre-tespit boru hattı çıkar:\n   dekonvolüsyon → Gaussian (σ) → eşik (ikili) → mesafe + watershed → nesneler.\nHücre tespiti modülü tam olarak bunu yapar; "Gelişmiş ayarlar"daki eşik ve σ, gördüğünüz adımları kontrol eder.\n\nBankhead'in uyarısı: bu kadar basit bir hat yalnız birkaç görüntüde ve düşük büyütmede iyi görünür; yüksek büyütmede hatalar belirginleşir. Gerçek uygulamalar çok daha fazla ayarlanabilir parametre gerektirir — bu yüzden Hücre tespiti modülü sonrası eşikleri kendi lamınızda kalibre edersiniz.\n\n
