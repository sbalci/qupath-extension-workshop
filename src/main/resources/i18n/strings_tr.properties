script.aab9acb25376=Önceki Warpy aktarımı
script.3cad69a43512=Bu lamda bu sihirbazın önceki aktarımından %,d anotasyon var ("%s").\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni aktarım ayrı bir set olur ("%s (2)" gibi). Lamda iki set birlikte durur.\n\n"Değiştir" seçilirse önceki aktarımın anotasyonları silinir — onlarda elle yaptığınız düzeltmeler de gider. Onlarla birlikte aktarılmış nesneler (ör. hücre tespitleri) de silinir; içlerine sonradan kendi eklediğiniz nesneler lamda kalır. Bu sürümden önce yapılmış aktarımların içindeki nesneler işaretli olmadığından lamda kalır; gerekirse elle silin. Kendi çizdiğiniz anotasyonlara dokunulmaz.\n\nİptal: hiçbir şey çalıştırılmaz, hiçbir şey yazılmaz.\n\nÖnceki aktarım ne olsun?
script.72b2fc13ba69=Önceki Warpy aktarımı silinecek
script.793ec45d606c="%2$s" adlı %1$,d anotasyon silinecek ve yerine yenisi aktarılacak. Bu anotasyonlarda elle yaptığınız düzeltmeler KAYBOLUR; onlarla birlikte aktarılmış nesneler de silinir. İçlerine sonradan kendi eklediğiniz nesneler kalır.\n\nDevam edilsin mi?
script.b953a9fa8fe1=DİKKAT — bu lamda önceki Warpy aktarımı da duruyor: %1$s. Hiçbir şey silinmedi; yeni set "%2$s" adıyla eklendi. Eski seti kaldırmak için o addaki anotasyonları seçip silin ya da yeniden aktarırken "Öncekini değiştir"i seçin. Dışa aktarım ve ölçümler iki seti de görür.
script.9bc28ae951f1=Önceki Warpy aktarımı değiştirildi: %,d anotasyon silindi ve onlarla aktarılmış nesneler (sonradan eklediğiniz nesneler korundu).
script.a4536559d5c3=Önceki hizalama aktarımı
script.9e93c5be3e96=Bu lamda bu sihirbazın önceki aktarımından %,d anotasyon var ("%s").\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni aktarım ayrı bir set olur ("%s (2)" gibi). Lamda iki set birlikte durur.\n\n"Değiştir" seçilirse önceki aktarımın anotasyonları silinir — onlarda elle yaptığınız düzeltmeler de gider. Onlarla birlikte aktarılmış nesneler (ör. hücre tespitleri) de silinir; içlerine sonradan kendi eklediğiniz nesneler lamda kalır. Bu sürümden önce yapılmış aktarımların içindeki nesneler işaretli olmadığından lamda kalır; gerekirse elle silin. Kendi çizdiğiniz anotasyonlara dokunulmaz.\n\nİptal: hiçbir şey çalıştırılmaz, hiçbir şey yazılmaz (otomatik hizalama da başlamaz).\n\nÖnceki aktarım ne olsun?
script.49dce785c700=Önceki hizalama aktarımı silinecek
script.2d499cfac317=DİKKAT — bu lamda önceki hizalama aktarımı da duruyor: %1$s. Hiçbir şey silinmedi; yeni set "%2$s" adıyla eklendi. Eski seti kaldırmak için o addaki anotasyonları seçip silin ya da yeniden aktarırken "Öncekini değiştir"i seçin. Dışa aktarım ve ölçümler iki seti de görür.
script.a5361261ace9=Önceki hizalama aktarımı değiştirildi: %,d anotasyon silindi ve onlarla aktarılmış nesneler (sonradan eklediğiniz nesneler korundu).
script.149bd436c4c0=Önceki VALIS aktarımı
script.8d9a98b918d7=%2$,d hedef lamda toplam %1$,d VALIS anotasyonu zaten var.\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni sonuç ayrı bir set olur ("VALIS (2)" gibi). Lamda iki set birlikte durur.\n\n"Değiştir" seçilirse önceki VALIS anotasyonları silinir — onlarda ELLE yaptığınız düzeltmeler de gider. Onlarla birlikte aktarılmış nesneler de silinir. Kendi anotasyonlarınıza ve sonradan eklediğiniz nesnelere dokunulmaz. Bu sürümden önce yapılmış aktarımların içindeki nesneler işaretli olmadığından lamda kalır; gerekirse elle silin.\n\nİptal: hiçbir şey çalıştırılmaz, hiçbir şey yazılmaz.\n\nÖnceki VALIS sonucu ne olsun?
script.158fb27b6582=Önceki VALIS sonucu silinecek
script.49f4a0940d50=%1$,d VALIS anotasyonu (%2$,d lamda) silinip yeniden aktarılacak. Bu anotasyonlarda elle yaptığınız düzeltmeler KAYBOLUR. Lam açık değilse sonuç diske kaydedilir ve geri alınamaz.\n\nDevam edilsin mi?
script.768b9abc88f3=HATA: mevcut yalnız 'ekle' ya da 'degistir' olabilir (verilen: %s). Hiçbir şey yazılmadı.
script.c95f4645fae9=Başsız kipte hiçbir şey yazılmadı. Önceki VALIS sonucu olan bir lama aktarım için QuPath arayüzünde sihirbazı açın ya da (destekleyen betiklerde) mevcut=ekle (kopya olarak ekle) / mevcut=degistir (öncekini değiştir) ile yeniden çalıştırın.
script.b2d8f3f095c9=DİKKAT — önceki VALIS sonucu lamda duruyor: %1$s. Hiçbir şey silinmedi; yeni set "%2$s" adını aldı. Eskisini kaldırmak için o addaki anotasyonları seçip silin ya da yeniden aktarırken "Öncekini değiştir"i seçin.
script.600a7fca5a26=Önceki VALIS sonucu değiştirildi: %,d anotasyon silindi ve onlarla aktarılmış nesneler (sonradan eklediğiniz nesneler korundu).
script.c5e460ca07d9=Öncekini değiştir (bu alandaki KongNet mitoz noktaları ve özetleri silinir)
script.c83e335af033=Seçili alanda zaten %,d KongNet mitoz noktası ve %,d KongNet özeti var.\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni sonuç ayrı bir özet olur ("KongNet Mitoz Özet (2)" gibi) ve yeni noktalar öncekilerin yanında durur. Bu durumda seçili anotasyonların ölçümleri değiştirilmez.\n\n"Değiştir" seçilirse bu alandaki önceki KongNet noktaları, etiket halkaları ve özetleri silinir — onlarda elle yaptığınız düzeltmeler de gider. Kendi anotasyonlarınıza, başka modellerin mitoz noktalarına ve özetlerin içindeki diğer nesnelere dokunulmaz.\n\nİptal: hiçbir şey çalıştırılmaz, hiçbir şey yazılmaz.\n\nÖnceki KongNet sonucu ne olsun?
script.3bcf3505b270=%,d KongNet mitoz noktası (etiket halkalarıyla birlikte) ve %,d özet silinip yeniden içe aktarılacak. Bunlarda elle yaptığınız düzeltmeler KAYBOLUR.\n\nDevam edilsin mi?
script.9bb2e191ad74=Özet adı             : %s
script.3b56d23e7de4=DİKKAT — bu alanda önceki KongNet sonucu da duruyor (özet: %s; %,d mitoz noktası). Hiçbir şey silinmedi ve seçili anotasyonların ölçümleri değiştirilmedi. Eskisini kaldırmak için o adlı özeti ve KongNet mitoz noktalarını (etiket halkalarıyla) silin ya da yeniden içe aktarırken "Öncekini değiştir"i seçin.
script.fd1ddf2819cb=Önceki KongNet sonucu değiştirildi: %,d mitoz noktası, %,d etiket halkası ve %,d özet silindi (özetlerin içindeki diğer nesneler korundu).
script.e5a087722a44=Öncekilere dokunma — yeni bir set olarak ekle (varsayılan)
script.d6d66a75bdb5=Öncekileri değiştir (bu alandaki bu sihirbazın model noktaları, konsensüs noktaları ve özetleri silinir)
script.ef91aba02af7=Önceki karşılaştırma sonucu
script.3c32fc06f493=Seçili alanda bu sihirbazın önceki sonuçları var:\n\n%s\n  • Konsensüs noktası: %,d\n  • Karşılaştırma özeti: %,d\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni sonuç ayrı bir özet olur ("Mitoz — model karşılaştırması (2)" gibi). Aynı modelin yeni noktaları, öncekilerle aynı sınıfta ve aynı yerlerde üst üste durur.\n\n"Değiştir" seçilirse bu alandaki bu sihirbazın önceki model noktaları, konsensüs noktaları, etiket halkaları ve özetleri silinir — onlarda elle yaptığınız düzeltmeler de gider. Bu çalıştırmada başarısız olan bir modelin önceki noktalarına dokunulmaz. Kendi anotasyonlarınıza, başka sihirbazların mitoz noktalarına ve özetlerin içindeki diğer nesnelere dokunulmaz.\n\nİptal: hiçbir şey çalıştırılmaz, hiçbir şey yazılmaz.\n\nÖnceki sonuçlar ne olsun?
script.f846780dee33=Önceki karşılaştırma sonuçları silinecek
script.29aeb07526e8=Bu alandaki bu sihirbazın %,d mitoz noktası (konsensüs dahil, etiket halkalarıyla birlikte) ve %,d özeti silinip yeniden yazılacak. Bunlarda elle yaptığınız düzeltmeler KAYBOLUR.\n\nDevam edilsin mi?
script.a308d8282914=Özet adı: %s
script.94e565c1330a=DİKKAT — bu alanda önceki karşılaştırma sonucu da duruyor (özet: %s; %,d mitoz noktası). Hiçbir şey silinmedi. Eskisini kaldırmak için o adlı özeti ve model/konsensüs noktalarını (etiket halkalarıyla) silin ya da yeniden çalıştırırken "Öncekileri değiştir"i seçin.
script.02035b0fc0aa=Önceki sonuçlar değiştirildi: %,d mitoz noktası, %,d etiket halkası ve %,d özet silindi (özetlerin içindeki diğer nesneler korundu).
script.661a7459b516=DİKKAT — bu lamda önceki sonuç da duruyor:\u0020
script.e61302cdacaf=Hiçbir şey silinmedi. Eski seti kaldırmak için o addaki anotasyonları seçip silin ya da yeniden çalıştırırken "Öncekini değiştir"i seçin. Dışa aktarım ve kohort özetleri iki seti de görür.
script.c8839122f795=Önceki sonuç değiştirildi: %,d anotasyon silindi (içlerindeki alt nesneler korundu).
script.37ab92155fc9=HATA: mevcut yalnızca 'ekle' ya da 'degistir' olabilir (verilen: %s). Hiçbir şey yazılmadı.
script.aa128578d32a=Bu görüntüde bu sihirbazın %,d önceki sonuç anotasyonu var. Hiçbir şey yazılmadı. Yeniden çalıştırırken mevcut=ekle (yeni set olarak ekler, eskiye dokunmaz) ya da mevcut=degistir (eski sonucu siler) verin.
script.4aeb56ddf562=Öncekini değiştir (bu sihirbazın önceki nokta-anotasyonları silinir)
script.1fb8a9b94699=Önceki bölge tespiti sonucu
script.81b9362b534a=Bu lamda bu sihirbazın %,d önceki nokta-anotasyonu var ("TIA bölge tespiti · …").\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni sonuç ayrı bir set olur (adın sonuna "(2)" gibi bir numara eklenir). Lamda iki set birlikte durur.\n\n"Değiştir" seçilirse önceki sonuç anotasyonları silinir. Kendi anotasyonlarınıza dokunulmaz.\n\nİptal: hiçbir şey çalıştırılmaz, hiçbir şey yazılmaz.\n\nÖnceki sonuç ne olsun?
script.0e2a5d553a9f=Önceki bölge tespiti sonucu silinecek
script.6f7505af723c=%,d önceki nokta-anotasyonu silinecek ve yeni sonuç yazılacak. Bu anotasyonlarda elle yaptığınız değişiklikler KAYBOLUR.\n\nDevam edilsin mi?
script.76eabac9f122=Önceki sonuçları değiştir (her görüntüde bu sihirbazın önceki nokta-anotasyonları silinir)
script.6fa94af07aed=Proje geneli tespit
script.ca63d66f5544=Projedeki %,d görüntünün her biri için tespit çalıştırılacak ve sonuç her girdiye diske KAYDEDİLECEK.\n\nBu sihirbazın önceki sonucu olan görüntülerde ne yapılacağını seçin. "Ekle" hiçbir şey silmez; yeni sonuç "… (2)" gibi ayrı bir set olur. Önceki sonucu olmayan görüntüler sormadan eskisi gibi işlenir.\n\nİptal: hiçbir şey çalıştırılmaz.\n\nÖnceki sonuçlar ne olsun?
script.6fede02d4565=Önceki sonuçlar silinecek
script.d5b504eb0223=Önceki sonucu olan HER görüntüde bu sihirbazın önceki nokta-anotasyonları (elle yaptığınız değişiklikler dahil) silinip yeni sonuç yazılacak ve diske kaydedilecek. Bu işlem geri alınamaz.\n\nDevam edilsin mi?
script.19827e4eab38=önceki sonuç duruyor
script.2513915f923e=Set adı   :\u0020
script.004ee1831264=Hiçbir şey silinmedi. Eski maskeyi kaldırmak için o addaki anotasyonu seçip silin ya da yeniden çalıştırırken "Öncekini değiştir"i seçin. Alan ölçümleri ve kohort özetleri iki maskeyi de görür.
script.2927902834a3=Önceki doku maskesi değiştirildi: %,d anotasyon silindi (içlerindeki alt nesneler korundu).
script.71653619f6db=Bu görüntüde bu sihirbazın %,d önceki doku maskesi anotasyonu var. Hiçbir şey yazılmadı. Yeniden çalıştırırken mevcut=ekle (yeni set olarak ekler, eskiye dokunmaz) ya da mevcut=degistir (eski maskeyi siler) verin.
script.6caef5af8fda=Öncekini değiştir (bu sihirbazın önceki doku maskesi silinir)
script.48b4a67ec4b3=Önceki doku maskesi
script.afda6cf6f06c=Bu lamda bu sihirbazın %,d önceki doku maskesi anotasyonu var ("Doku maskesi (TIA Toolbox)").\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni maske ayrı bir set olur ("Doku maskesi (TIA Toolbox) (2)" gibi). Lamda iki maske birlikte durur.\n\n"Değiştir" seçilirse önceki doku maskesi anotasyonları silinir — onlarda ELLE yaptığınız düzeltmeler de gider. Kendi anotasyonlarınıza ve içlerindeki nesnelere dokunulmaz.\n\nİptal: hiçbir şey çalıştırılmaz, hiçbir şey yazılmaz.\n\nÖnceki doku maskesi ne olsun?
script.e9551c85492d=Önceki doku maskesi silinecek
script.07448503a423=%,d doku maskesi anotasyonu silinip yerine yenisi yazılacak. Bu anotasyonlarda elle yaptığınız düzeltmeler KAYBOLUR.\n\nDevam edilsin mi?
script.60998bbceb32=Öncekini değiştir (bu sihirbazın eklediği "Doku" anotasyonları silinir)
script.52853a7c428d=Önceki Doku sonucu
script.043a1b6afd3c=Bu lamda "Doku" sınıflı, adı "Doku" ya da "Doku (2)" gibi olan %,d anotasyon zaten var.\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni sonuç ayrı bir set olur ("Doku (2)" gibi). İki doku anotasyonu lamda birlikte durur; alan ölçümlerini toplarken ikisini de saymayın.\n\n"Değiştir" seçilirse bu anotasyonlar silinir; üzerlerinde ELLE yaptığınız düzeltmeler de gider. Anotasyonların içindeki nesnelere (ör. hücre tespitleri) ve başka adlı ya da başka sınıflı anotasyonlarınıza dokunulmaz.\n\nİptal: hiçbir şey yazılmaz.\n\nÖnceki Doku sonucu ne olsun?
script.428da4197ab8=Önceki Doku sonucu silinecek
script.3b4bb905f07c="Doku" sınıflı, adı "Doku" ya da "Doku (2)" gibi olan %,d anotasyon silinecek ve yerine yeni sonuç eklenecek. Bu anotasyonlarda elle yaptığınız düzeltmeler KAYBOLUR; içlerindeki nesneler korunur.\n\nDevam edilsin mi?
script.b687630159b5=DİKKAT — bu lamda önceki Doku sonucu da duruyor: %s\nHiçbir şey silinmedi. Eskisini kaldırmak için o adlı anotasyonu seçip silin ya da yeniden uygularken "Öncekini değiştir"i seçin.
script.e4a2b21cde56=Önceki Doku sonucu değiştirildi: %,d anotasyon silindi (içlerindeki nesneler korundu).
script.4f47ef9c32bf=Bu lamda "Doku" sınıflı, bu sihirbazın eklediği %,d anotasyon zaten var. Hiçbir şey yazılmadı. Yeni bir kopya eklemek için -a mevcut=ekle, önceki sonucu değiştirmek için -a mevcut=degistir ile yeniden çalıştırın.
script.867c6553cd5f=Bir ALAN ölçümüdür — klinik yorum/grade/tanı üretmez. Kilitli 'Doku' anotasyonu eklenir; lamda önceki sonuç varsa 'Uygula' önce sorar.
script.1c7f212dcbd3=Öncekini değiştir (bu sihirbazın önceki nesneleri silinir)
script.4e8e0af236b8=Önceki tomurcuk sonucu
script.e09d59235832=Bu lamda bu sihirbazın önceki sonucundan kalan %,d nesne var: sınıfı "Tumor bud" olan tespitler ve (cephe ya da TMA kipinde) sihirbazın oluşturduğu bant / çekirdek bölgesi anotasyonları.\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni sonuç ayrı bir set olur ("Tumor bud (2)" gibi) ve seçili bölgelerdeki ölçüm adlarına "(2)" eklenir. İki set lamda birlikte durur; tomurcukları sayarken ikisini toplamayın.\n\n"Değiştir" seçilirse bu nesneler silinir; üzerlerinde ELLE yaptığınız düzeltmeler de gider. Seçtiğiniz anotasyonlara ve sınıfı "Tumor bud" olmayan nesnelere (ör. hücre tespitleri) dokunulmaz.\n\nİptal: hiçbir şey çalıştırılmaz, hiçbir şey yazılmaz.\n\nÖnceki tomurcuk sonucu ne olsun?
script.2a445666bd81=Önceki tomurcuk sonucu silinecek
script.220920d88ad6=%,d nesne silinecek: sınıfı "Tumor bud" olan tüm tespitler (elle sınıfladıklarınız dahil) ve cephe / TMA kipinde sihirbazın oluşturduğu bant / çekirdek bölgesi anotasyonları. Bunlarda elle yaptığınız düzeltmeler KAYBOLUR; anotasyonların içindeki diğer nesneler korunur.\n\nDevam edilsin mi?
script.9a0b0897a5e7=DİKKAT — lamda önceki tomurcuk sonucu da duruyor: %s\nHiçbir şey silinmedi. Bu sayımın sonucu "%s" adını taşır. Eskisini kaldırmak için o nesneleri seçip silin ya da yeniden sayarken "Öncekini değiştir"i seçin. Dışa aktarım ve özetler iki sonucu da görür.
script.1ae5e41c44be=Seçili bölgelerdeki ölçümler "%1$s" son ekiyle yazıldı (ör. "Tomurcuk sayısı%1$s"); önceki ölçümler değişmedi.
script.2f88f960c3b6=Önceki tomurcuk sonucu değiştirildi: %,d nesne silindi (anotasyonların içindeki diğer nesneler korundu).
script.53ec67e56b06=Model omurgasına erişim izniniz yok gibi görünüyor. Bu model Hugging Face'te kapılıdır; erişim otomatik verilmez.\n\nYapılacaklar:\n  1. huggingface.co/facebook/dinov3-vith16plus-pretrain-lvd1689m sayfasını açın, oturum açın ve lisans koşullarını kabul edin.\n  2. Erişim onayını bekleyin (süresi Meta'ya bağlıdır).\n  3. Hugging Face hesabınızda Settings → Access Tokens bölümünden "read" türünde bir jeton oluşturun.\n  4. Bir komut penceresi açın (Windows: Başlat → "cmd"), şu komutu çalıştırın ve jetonu yapıştırın:\n       %s\n  5. Sihirbazı yeniden çalıştırın.\n\nErişim gelene kadar "Atipik sınıflandırma — MIDOG25 EffNetV2" girişini kullanabilirsiniz; o model kapılı değildir.
script.edd17dfa3e74=(tanımlı boya yok)
script.e7502113ef47=DURDU: görüntü tipi H-DAB ama "Hematoxylin" adlı boya yok (tanımlı boyalar: %s). Hiçbir şey değiştirilmedi. Varsayılan H-DAB boya vektörlerinin uygulanmasını (mevcut vektörlerin değişmesini) kabul ediyorsanız -a boya=varsayilan ile yeniden çalıştırın.
script.9d995633289c=Boya vektörleri değişecek
script.fcd4e17529fd=Bu lamın görüntü tipi Brightfield (H-DAB), ancak "Hematoxylin" adlı bir boya tanımlı değil.\nTanımlı boyalar: %s\n\nBu araç Hematoxylin ve DAB kanallarına ihtiyaç duyar. Devam etmek için QuPath'in varsayılan H-DAB boya vektörleri uygulanmalıdır. Bu işlem lamın MEVCUT boya vektörlerini DEĞİŞTİRİR; kendiniz tahmin ettiğiniz vektörler varsa kaybolur.\n\nVarsayılan H-DAB boya vektörleri uygulansın mı?\n\n"Hayır" derseniz hiçbir şey değiştirilmez ve araç açılmaz.
script.e9d070cff4f1=Hiçbir şey değiştirilmedi. Aracı kullanmak için boya vektörlerini kendiniz ayarlayın: Extensions → Atölye → Yardımcılar → Boya ve renk → Boya vektörleri sihirbazı. Boyalardan birinin adı "Hematoxylin" olmalıdır. Sonra bu aracı yeniden çalıştırın.
script.e6b0dca2f71e=Öncekine dokunma — yeni bir özet olarak ekle (varsayılan)
script.58a389002eb4=Öncekini değiştir (bu betiğin önceki özet anotasyonları silinir)
script.5237b5cec33c=Önceki sonuç
script.b86513216eaf=Bu lamda bu betiğin önceki çalıştırmasından kalan %,d özet anotasyonu var ("%s").\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni özet ayrı bir anotasyon olur ("%s" gibi) ve lamda iki özet birlikte durur.\n\n"Değiştir" seçilirse önceki özet anotasyonları silinir. Kendi anotasyonlarınıza dokunulmaz.\n\nHer iki seçenekte de karolardaki "Hotspot sırası" ölçümü yeni çalıştırmaya göre güncellenir.\n\nİptal: hiçbir şey hesaplanmaz, hiçbir şey yazılmaz.\n\nÖnceki sonuç ne olsun?
script.89a856ac207d=Önceki özet silinecek
script.4ea846e9c562=%,d özet anotasyonu silinecek: %s.\n\nYalnızca bu betiğin önceki özet anotasyonları silinir (adı tam ya da "ad (N)" biçiminde olan ve betiğin ölçümlerini taşıyanlar). Kendi anotasyonlarınıza ve içlerindeki nesnelere dokunulmaz. Bu işlem geri alınamaz.\n\nDevam edilsin mi?
script.da8de65c00dc=Bu lamda bu betiğin önceki sonucu zaten var (%,d özet anotasyonu: %s). Hiçbir şey yazılmadı. Yeni bir kopya eklemek için -a mevcut=ekle, önceki sonucu değiştirmek için -a mevcut=degistir ile yeniden çalıştırın.
script.9cf501b5b9fc=DİKKAT — bu lamda önceki sonuç da duruyor: %s\nHiçbir şey silinmedi. Bu çalıştırmanın özeti "%s" adını aldı. Karolardaki "Hotspot sırası" ölçümü YENİ çalıştırmayı yansıtır; önceki özet anotasyonu ise önceki değerleri gösterir. Eskisini kaldırmak için o anotasyonu seçip silin ya da betiği yeniden çalıştırırken "Öncekini değiştir"i seçin.
script.d495b71072f5=Önceki sonuç değiştirildi: %,d özet anotasyonu silindi.
script.ce3bec237956=Bu lamda bu betiğin önceki çalıştırmasından kalan %,d özet anotasyonu var ("%s").\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni özet ayrı bir anotasyon olur ("%s" gibi) ve lamda iki özet birlikte durur.\n\n"Değiştir" seçilirse önceki özet anotasyonları silinir. Kendi anotasyonlarınıza dokunulmaz.\n\nHer iki seçenekte de hücrelerdeki "En yakın komşu (µm)" ölçümü yeni değerle üzerine yazılır.\n\nİptal: hiçbir şey hesaplanmaz, hiçbir şey yazılmaz.\n\nÖnceki sonuç ne olsun?
script.b73539319fd1=DİKKAT — bu lamda önceki sonuç da duruyor: %s\nHiçbir şey silinmedi. Bu çalıştırmanın özeti "%s" adını aldı. Hücrelerdeki "En yakın komşu (µm)" ölçümü YENİ çalıştırmayı yansıtır; önceki özet anotasyonu ise önceki değerleri gösterir. Eskisini kaldırmak için o anotasyonu seçip silin ya da betiği yeniden çalıştırırken "Öncekini değiştir"i seçin.
script.53bd9d440cf6=Bu lamda bu betiğin önceki çalıştırmasından kalan %,d özet anotasyonu var ("%s").\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni özet ayrı bir anotasyon olur ("%s" gibi) ve lamda iki özet birlikte durur.\n\n"Değiştir" seçilirse önceki özet anotasyonları silinir. Kendi anotasyonlarınıza dokunulmaz.\n\nHer iki seçenekte de A hücrelerindeki "%s" ölçümü yeni değerle üzerine yazılır.\n\nİptal: hiçbir şey hesaplanmaz, hiçbir şey yazılmaz.\n\nÖnceki sonuç ne olsun?
script.21087de35ce6=DİKKAT — bu lamda önceki sonuç da duruyor: %s\nHiçbir şey silinmedi. Bu çalıştırmanın özeti "%s" adını aldı. A hücrelerindeki "%s" ölçümü YENİ çalıştırmayı yansıtır; önceki özet anotasyonu ise önceki değerleri gösterir. Eskisini kaldırmak için o anotasyonu seçip silin ya da betiği yeniden çalıştırırken "Öncekini değiştir"i seçin.
script.3e13de12fd69=Bu lamda bu betiğin önceki çalıştırmasından kalan %,d özet anotasyonu var ("%s").\n\n"Ekle" seçilirse hiçbir şey silinmez; yeni özet ayrı bir anotasyon olur ("%s" gibi) ve lamda iki özet birlikte durur.\n\n"Değiştir" seçilirse önceki özet anotasyonları silinir. Kendi anotasyonlarınıza dokunulmaz.\n\nHer iki seçenekte de seçili anotasyonlardaki "Sınıf sayım: …" ölçümleri yeni değerlerle değiştirilir.\n\nİptal: hiçbir şey hesaplanmaz, hiçbir şey yazılmaz.\n\nÖnceki sonuç ne olsun?
