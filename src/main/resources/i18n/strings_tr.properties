script.826589053e36=Klasörleme:
script.62f462526d47=Karoların etiketi: anotasyonun sınıfı, adı ya da ikisi. Sınıfsız ve adsız anotasyon: Sinifsiz.
script.5a43cd90414c=Etiketler:
script.5e1546d7005c=Bu lamda, seçili kapsam ve klasörlemeyle oluşacak etiketler ve anotasyon sayıları. İşareti kaldırılan etiket atlanır. Liste, kapsam / klasörleme / dışlama değişince yenilenir.
script.75a003f9b6e1=Dışlama sınıfları:
script.f27a45f5aa8f=Virgülle ayırın; sonda * önek demektir (ör. Ignore*, Artifact, Fold, Blur). Bu sınıflar karo üretmez.
script.996b19cd30a9=Katlantı ya da kalem izi gibi dışlama anotasyonları diğer bölgelerden kesilip atılır.
script.2e28ed29431a=Doku içinde Tümör gibi iç içe anotasyonlarda üst bölge, alt bölge çıkarılarak döşenir.
script.d3cb3ce18941=En az kapsama (%):
script.f30261966e0c=Karonun alanının en az bu kadarı etiket bölgesinde olmalı. 0 = herhangi bir örtüşme yeter; kenar karolarını elemek için ör. 50.
script.32d8b49ffe28=Sınır karoları: bir karo iki etiket bölgesine değiyorsa yalnız kapsaması en büyük etikete yazılır. Aynı pikseller hiçbir zaman iki klasöre girmez; bu ayar kapatılamaz.
script.fdb43c93704e=En az doku (%):
script.fb6f8a35b97d=Karonun piksellerinin en az bu kadarı doku olmalı (beyazlık eşiğinden koyu). 0 = kapalı. Anotasyon geniş çizildiyse boş cam karolarını eler.
script.9c5c32899757=Beyazlık eşiği (0–255):
script.536f7b7253a3=Gri değeri bunun altındaki piksel doku sayılır. 220 yaygın bir başlangıçtır; soluk boyamada yükseltin.
script.5da3306ceb16=Etiket başına en çok:
script.96c634df2520=0 = sınırsız. Sayı verirseniz her etiketten rastgele (yinelenebilir) bu kadar karo seçilir. Sınır BU LAM içindir ve doku süzgecinden sonra uygulanır; küme genelindeki dengeyi sonuç penceresindeki küme özeti gösterir.
script.f6d7fb2b11e1=Dosya adına etiketi yaz
script.203a66546c4b=Dosya adına bölmeyi yaz
