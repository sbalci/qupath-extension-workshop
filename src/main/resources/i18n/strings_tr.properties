script.509962e49777=Varsayılan kanal modu, yukarıda "Boya"su elle seçilmemiş ve adından H&E çıkarılamayan İHK lamlarına uygulanır: hed = Hematoksilen + DAB (ÖNERİLEN) · dab = yalnız DAB · rgb = ham RGB. H&E lamları satırdaki "Boya = H&E" ile Hematoksilen + Eozin üretir. Seviye 0 = tam çözünürlük (yavaş/büyük), 2 ≈ görüntüleme için iyi denge; "↻ Yeniden birleştir" ile hızlı denerken seviye 3 daha da hızlıdır (küçük warp+yazma).
script.943812e20891=İKİ ÇIKTI TÜRÜ — amacınıza göre seçin (ayrıntı: Ekler → Görüntü Hizalama § 7.2):\n  • BİLEŞİK KAPALI (varsayılan) → ÇOK-KANALLI multipleks (multiplex_*.ome.tiff). QuPath'te tür = FLUORESCENCE; her kanalı ayrı aç/kapat, 2–3 markerı üst üste bindir. Markerları AYIRT/KARŞILAŞTIR için budur.\n  • BİLEŞİK AÇIK → DOĞAL-RENK parlak alan RGB (multiplex_composite_*.ome.tiff, Beer-Lambert). QuPath'te tür = BRIGHTFIELD; beyaz zemin, doğal boya renkleri, "LAM GİBİ" görünür — ama TEK görüntüdür, kanal seçilemez. Tek lamda doğal görünüm; çok lamda sentetik bileşik (çakışan boyalar koyulaşır).
