script.cc9c09df8737=Bir TÜMÖR (epitel) anotasyonu çizip SEÇİN (kenarı sarı), sonra "Çalıştır".\nBirincil metrik piksel bazlı H-score (her zaman çalışır); hücre bazlı ring\nH-score isteğe bağlıdır (Cellpose varsa kullanılır, yoksa Watershed ile çalışır).\nEşikleri değiştirince "Eşikleri yeniden uygula (hızlı)" ile hücre tespitini tekrarlamadan güncelleyebilirsiniz.
