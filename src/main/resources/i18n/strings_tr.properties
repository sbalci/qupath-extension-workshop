script.babcdc19a188=Örtüşme (px):
script.77a5385ee45f=Komşu karolar arası ortak piksel. 0 = örtüşme yok. >0 ise karo düzeyinde rastgele bölme sızıntıya yol açar.
script.9a5649a42cb2=Format:
script.cdc98ea4bae3=PNG: kayıpsız. JPG: küçük ama kayıplı. TIFF: kayıpsız, büyük. Maske modunda PNG'ye zorlanır.
