script.e9ecd278fd33=Açık lamın DOSYASINDA gömülü ICC renk profili arar; görüntüyü, renkleri veya analizinizi değiştirmez.\n\nQuPath 0.7+ OpenSlide ile ICC profilini isteğe bağlı uygulayabilir; 0.6 bu özelliği içermez. Profilin dosyada bulunması, görüntüde etkin olduğunu göstermez. Kullanılan okuyucuyu ve ICC tercihini ayrıca kontrol edin. Bu araç etkin renk dönüşümünü sınamaz.
