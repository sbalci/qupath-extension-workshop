script.7b23b64c0297=Model: HoVer-NeXt Lizard (7 sınıf). "Modeli yerel indir" seçili modelin ağırlığını Zenodo'dan (CC BY-NC-SA 4.0, MD5 doğrulanır) ve HoVer-NeXt kodunu (GPL-3.0, sabit commit; paketlenmez, ayrı süreç olarak çalıştırılır) bir kez indirir; ImageNet omurgasını da önbelleğe almaya çalışır — yine de ilk çalıştırmada internet gerekebilir.\nModel seçimini değiştirirseniz önce "Kaydet", sonra yeniden "Modeli yerel indir". Cihaz: yalnız CUDA (HoVer-NeXt CPU'da çalışmaz). Batch size: GPU belleği yetmezse düşürün (ör. 8). TTA: test-zamanı artırma görünümü (HoVer-NeXt varsayılanı 4; 1 = daha hızlı).
