script.aa6579253a46=Fiji AYRI bir uygulamadır (fiji.sc). "Fiji indir" ile indirip arşivi açın; çalıştırılabilir yolunu "…" ile seçin. Sonra Fiji eklentilerini kurun: PTBIOP güncelleme sitesi + elastix wrapper'ları (BigWarp Fiji ile gelir).
