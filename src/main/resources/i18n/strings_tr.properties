dialog.jarReload.body=QuPath bu eklenti JAR'ını başlatma sırasında okudu, ama dosya bundan sonra değişmiş görünüyor (büyük olasılıkla eklentinin yeni bir sürümü kuruldu).\n\nÇözüm:\n  1. QuPath'i tamamen kapatın (yalnızca projeyi değil)\n  2. QuPath'i yeniden açın\n  3. Atölye menüsünü tekrar deneyin\n\nHata devam ederse JAR kopyasını yeniden indirin.
