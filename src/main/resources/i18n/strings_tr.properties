script.540c7a7a0d5c=Hücre bazlı tespit atlandı; piksel tabanlı H-score yine de hesaplandı ve geçerlidir. Hücre bazlı karşılaştırma gerekiyorsa ortamı denetleyin (Extensions → Atölye → Ortam kontrolü…) ve aracı yeniden çalıştırın.\nTeknik ayrıntı: %s
