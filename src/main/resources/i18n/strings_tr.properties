script.3dccd7576426=Tahmin için temsilî bir BÖLGE seçili olmalı.\n\nYapın:\n  1. Dikdörtgen/çokgen anotasyon aracı ile iki boyayı + biraz arka planı\n     içeren KÜÇÜK bir alan çizin (büyük bölge gereksiz yere örneklemeyi düşürür)\n  2. O anotasyonu seçili bırakın (üzerine tıklayın)\n  3. Aşağıdan "↻ Tekrar dene"\n\nQuPath tahmini bu bölgenin pikselleri üzerinden yapar.\n(Resmî komut: Analyze → Preprocessing → Estimate stain vectors ·\u0020
