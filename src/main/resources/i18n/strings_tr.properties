script.1c91713d87b9=Annotations paneli → sınıfı seçin → Brush (B) ile birkaç temsilî bölge çizin.\nZorunlu sınıflar: Tumor, Stroma, Ignore* (boş cam/arka plan — modelin dokuyu\nTümör/Stroma'ya zorlamasını engeller). İsteğe bağlı sınıfları işaretlerseniz\nmodele ayrı sınıf olarak katılır; işaretsizler eğitime girmez.\nKüçük ve çeşitli örnekler çizin; geniş dolu alan örnek bütçesini boşa harcar.\nNot: Model yalnız BU lamdan öğrenir; başka lamlara genellemesi sınırlıdır —\nçoklu-slayt eğitim için Anotasyon Stratejisi eki §4b.
