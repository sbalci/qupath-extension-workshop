script.ec0253d9c853=Fiji açıldıktan sonra (menü: BigDataViewer-Playground — TİRELİ; düz "BigDataViewer" DEĞİL. Yoksa ②'deki PTBIOP'u kurun):\n  a) Plugins → BigDataViewer-Playground → BDVDataset → Create BDV Dataset (QuPath) → project.qpproj'u açın (birim: mm).\n  b) Plugins → BigDataViewer-Playground → Sources → Register → QuPath - Create Warpy Registration:\n     rigid → elastix afin → elastix spline → (ops.) BigWarp → dönüşüm QuPath projesine YAZILIR (transform_<hedef>_<kaynak>.json).
