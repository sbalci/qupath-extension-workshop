script.87cbe5c77839=Dışa aktarım sırasında bir hata oluştu:\n\n
script.398f438f3011=\n\nOlası nedenler:\n  • Disk dolu ya da çıktı klasörüne yazma izni yok.\n  • Çok büyük tüm lam yazımı kesildi — bir bölge (anotasyon) deneyin.\n  • QuPath 0.6.0+ gerekir (OME-Zarr yazıcısı bu sürümde geldi).\n\nDetay: View → Show log dialogue.\n\n⚠️ Yalnızca araştırma/eğitim amaçlı ölçüm üretir.
script.81282c2148ad=\u0020\u0020Düzey %d: downsample %.0f → %,d × %,d px
