script.c10fbc709b72=Hizalanacak lamları işaretleyin (kaynakla AYNI klasörde olmalı; VALIS ≥2 lamı birlikte hizalar). "Marker adı" = kanal adı ön-eki. "Boya" = renk ayrıştırma tipi: İHK için H-DAB (→ {marker}-DAB + -Hematoksilen), H&E için H&E (→ -Hematoksilen + -Eozin); ad "HE" içerenler otomatik H&E seçilir. "Renk" = o markerın İŞARET kanalının (DAB/Eozin) QuPath'teki rengi — her marker için farklı renk seçin (varsayılanlar zaten ayrıktır). Renk yalnız ÇOK-KANALLI multipleksi etkiler; doğal-renk bileşik gerçek boya rengini kullanır. Hematoksilen daima mavi-mor.
