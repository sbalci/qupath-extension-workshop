script.dfcd82089a2a=Çıktılar (results / ome / geojson / multiplex) çıktı klasörünün altına yazılır; boşsa çalışma klasörü kullanılır. Native modda çıktı başka bir sürücüde olabilir (ör. büyük OME-TIFF'ler için E:\\). Docker modu: girdi VE çıktı çalışma klasörünün ALTINDA olmalı (tek mount → /work). Native mod: python.exe VALIS venv'ini göstermeli; libvips + Java ayrıca kurulmalı. WSL modu (Windows'ta ÖNERİLEN — yerel Windows VALIS bu makinede çökebilir): WSL içindeki python yolunu (valis-wsi + pyvips[binary] kurulu venv) verin; Windows yolları otomatik /mnt/... olarak çevrilir. Docker'ın tek-kök şartı WSL'de YOKTUR.
