pref.tip.atolye.nuclear1=🩺 Klinik: Çok soluk nükleer DAB boyanmasını negatif çekirdekten ayıran alt sınır (Ki-67, ER, PR).\n💻 Matematik: Çekirdek içi ortalama Beer–Lambert DAB OD ≥ bu değer ise ≥1+ atanır (tipik 0.10–0.25, varsayılan 0.20).
pref.tip.atolye.nuclear2=🩺 Klinik: Orta şiddette kahverengi nükleer İHK boyanma sınırı (H-score'da ×2 ağırlık alır).\n💻 Matematik: Çekirdek DAB OD mean ≥ bu değer ise ≥2+ atanır; 1+ < 2+ < 3+ şarttır (varsayılan 0.40).
pref.tip.atolye.nuclear3=🩺 Klinik: Koyu, yoğun nükleer DAB boyanma sınırı (H-score'da ×3 ağırlık alır).\n💻 Matematik: Çekirdek DAB OD mean ≥ bu değer ise 3+ atanır (tipik 0.50–0.80, varsayılan 0.60).
pref.tip.atolye.membrane1=🩺 Klinik: Zayıf/silik membranöz DAB halkasını negatiften ayıran alt sınır (HER2 İHK).\n💻 Matematik: Hücre zarı kompartmanında DAB OD mean ≥ bu değer ise ≥1+ atanır (varsayılan 0.15).
pref.tip.atolye.membrane2=🩺 Klinik: Orta şiddette çevresel membranöz DAB boyanma sınırı.\n💻 Matematik: Membran DAB OD mean ≥ bu değer ise ≥2+ atanır (tipik 0.30–0.50, varsayılan 0.40).
pref.tip.atolye.membrane3=🩺 Klinik: Güçlü, kalın membranöz DAB boyanma sınırı.\n💻 Matematik: Membran DAB OD mean ≥ bu değer ise 3+ atanır (tipik 0.55–0.85, varsayılan 0.70).
pref.tip.atolye.cyto1=🩺 Klinik: Makrofaj/sitoplazmik belirteçlerde (CD68) hafif granüler DAB sınırı.\n💻 Matematik: Sitoplazma halkası DAB OD mean ≥ bu değer ise ≥1+ atanır (varsayılan 0.10).
pref.tip.atolye.cyto2=🩺 Klinik: Orta yoğunlukta sitoplazmik DAB boyanma sınırı.\n💻 Matematik: Sitoplazma DAB OD mean ≥ bu değer ise ≥2+ atanır (varsayılan 0.20).
pref.tip.atolye.cyto3=🩺 Klinik: Yoğun sitoplazmik DAB boyanma sınırı.\n💻 Matematik: Sitoplazma DAB OD mean ≥ bu değer ise 3+ atanır (varsayılan 0.35).
pref.tip.atolye.pixDab1=🩺 Klinik: Tek tek hücre sınırı çizilemediğinde zayıf kahverengi doku piksellerini sayan eşik.\n💻 Matematik: Renk ayrıştırma DAB kanalında piksel OD ≥ bu değer ise 1+ piksel sayılır (varsayılan 0.10).
pref.tip.atolye.pixDab2=🩺 Klinik: Piksel düzeyinde orta şiddetli DAB boyalı alan sınırı.\n💻 Matematik: Piksel DAB OD ≥ bu değer ise 2+ dilimine girer (varsayılan 0.30).
pref.tip.atolye.pixDab3=🩺 Klinik: Piksel düzeyinde koyu DAB boyalı alan sınırı.\n💻 Matematik: Piksel DAB OD ≥ bu değer ise 3+ dilimine girer (varsayılan 0.60).
pref.tip.atolye.pixHmask=🩺 Klinik: Boş cam ve lümeni dışlayıp yalnız çekirdek/doku içeren pikselleri paydaya katar.\n💻 Matematik: Hematoksilen OD ≥ bu değer VEYA DAB ≥ 1+ koşulunu sağlayan pikseller toplam doku paydasını oluşturur (varsayılan 0.05).
pref.tip.atolye.cellposeModel=🩺 Klinik: HER2 membran modülünde hücre sınırlarını çizecek ön eğitimli derin öğrenme modeli.\n💻 Matematik: Cellpose ağ ağırlığı seçimi (cyto3: genel tam hücre, cyto2: önceki sürüm, nuclei: yalnız çekirdek).
pref.tip.atolye.cellposeDiameter=🩺 Klinik: Kesitteki tipik tümör hücresinin piksel cinsinden genişliği.\n💻 Matematik: Giriş karolarını ağın eğitim ölçeğine yeniden örnekleyen hedef çap (px; 0 = otomatik tahmin, varsayılan 25).
pref.tip.atolye.cellposeFamily=🩺 Klinik: Cellpose yardımcı sihirbazında seçilen bölütleme ailesi.\n💻 Matematik: Çıkarım omurgası (cyto3, cyto2, nuclei veya Transformer tabanlı cpsam).
pref.tip.atolye.cellposeFlow=🩺 Klinik: Düzensiz şekilli tümör hücrelerinin kabul edilme esnekliği.\n💻 Matematik: Üretilen gradyan akış alanı ile ağ tahmini arasındaki izin verilen maksimum MSE hatası (varsayılan 0.4).
pref.tip.atolye.cellposeCellprob=🩺 Klinik: Soluk boyanan hücrelerin yakalanma duyarlılığı (düşürülürse soluk hücreler de dahil edilir).\n💻 Matematik: Pikselin hücre içi sayılması için aşması gereken logit eşiği (-6 ile +6 arası, varsayılan 0.0).
pref.tip.atolye.stardistThreshold=🩺 Klinik: Üst üste binen kalabalık çekirdeklerde yanlış pozitif çekirdek sayımını dizginler.\n💻 Matematik: Yıldız-konveks poligon merkezlerinin NMS öncesi minimum nesne olasılık eşiği [0, 1] (varsayılan 0.5).
pref.tip.atolye.stardistPixelSize=🩺 Klinik: StarDist'in çekirdek ararken sanal lamı hangi büyütme çözünürlüğünde okuyacağı (0.5 µm ≈ 20×).\n💻 Matematik: Piramitten okunan karoların fiziksel örnekleme aralığı (µm/px > 0, varsayılan 0.5).
pref.tip.atolye.stardistCellExpansion=🩺 Klinik: Çekirdek sınırından dışarı doğru tahmin edilen sanal sitoplazma kuşağı genişliği.\n💻 Matematik: Komşu hücrelerle Voronoi sınırında çarpışana dek uygulanan Öklid genişleme yarıçapı (µm, varsayılan 5.0).
pref.tip.atolye.pixelSize=🩺 Klinik: Klasik çekirdek tespitinin çalışacağı mikroskop büyütme karşılığı (0.5 µm ≈ 20×).\n💻 Matematik: Watershed öncesi görüntünün yeniden örnekleneceği MPP değeri (µm/px; yarıya inerse piksel sayısı ×4 artar, varsayılan 0.5).
pref.tip.atolye.cellExpansionNuclear=🩺 Klinik: Nükleer İHK ve H&E analizlerinde çekirdek çevresine eklenen tahmini sitoplazma halkası.\n💻 Matematik: Çekirdek konturundan dışa doğru kısıtlı morfolojik dilasyon mesafesi (µm, varsayılan 5.0).
pref.tip.atolye.cellExpansionCyto=🩺 Klinik: Geniş sitoplazmalı makrofaj (CD68) ve epitel membran (HER2) ölçümleri için geniş halka.\n💻 Matematik: Çekirdekten dışa doğru Voronoi kısıtlı dilasyon yarıçapı (µm, varsayılan 7.0).
pref.tip.atolye.sigma=🩺 Klinik: Kaba kromatin topaklarının tek bir çekirdeği birden fazla parçaya bölmesini engeller.\n💻 Matematik: Tepe tespiti öncesi uygulanan 2B izotropik Gauss çekirdeğinin standart sapması σ (µm, varsayılan 1.5).
pref.tip.atolye.backgroundRadius=🩺 Klinik: Kesit kenarı veya kıvrım komşuluğundaki zemin boyanma dalgalanmasını dengeler.\n💻 Matematik: Morfolojik açma (opening) ile yerel arka plan çıkarımında kullanılan yapısal eleman yarıçapı (µm; 0 = kapalı, varsayılan 8.0).
pref.tip.atolye.minArea=🩺 Klinik: Apoptotik kırıntı, trombosit ve toz taneciklerinin hücre diye sayılmasını önler.\n💻 Matematik: Bölütlenen bağlı bileşenlerin kabul edilmesi için alt alan sınırı (µm², varsayılan 10.0).
pref.tip.atolye.maxArea=🩺 Klinik: Dev artefakt lekelerinin veya ayrışmamış büyük doku kitlelerinin tek hücre sayılmasını engeller.\n💻 Matematik: Bölütlenen çekirdek poligonu için üst alan sınırı (µm² ≥ minArea, varsayılan 400.0).
pref.tip.atolye.medianRadius=🩺 Klinik: Kamera/tarayıcı kaynaklı ince noktasal gürültüyü çekirdek kenarını bulandırmadan temizler.\n💻 Matematik: Doğrusal olmayan 2B medyan sıra-istatistiği filtresi yarıçapı (µm; 0 = kapalı, varsayılan 0.0).
pref.tip.atolye.detectionThreshold=🩺 Klinik: Soluk veziküler çekirdeklerin yakalanabilmesi için gereken en düşük boya koyuluğu.\n💻 Matematik: Arka plan çıkarımı sonrası çekirdek tohumlaması için minimum optik yoğunluk eşiği (OD, varsayılan 0.1).
pref.tip.atolye.detectionChannel=🩺 Klinik: Çekirdeklerin hangi boya bileşeninden aranacağını belirler (DAB çok koyuysa toplam OD seçilebilir).\n💻 Matematik: Dekonvolüsyon sonrası bölütleme giriş kanalı (Hematoxylin OD veya Optical density sum).
pref.tip.atolye.watershed=🩺 Klinik: Birbirine değen kalabalık tümör/lenfosit çekirdeklerini tek dev hücre yerine ayrı ayrı sayar.\n💻 Matematik: Mesafe dönüşümü ve yoğunluk vadileri üzerinde işaretçi kontrollü Watershed bölütlemesi (varsayılan açık).
pref.tip.atolye.pixScale=🩺 Klinik: Geniş doku alanlarında piksel H-score tarama hızını artırır.\n💻 Matematik: Piramit alt örnekleme (downsample) çarpanı ≥ 1.0 (1.0 = tam çözünürlük).
pref.tip.atolye.classifierName=🩺 Klinik: Eğittiğiniz tümör–stroma doku ayırıcısının proje içinde çağrılacağı ad.\n💻 Matematik: project/classifiers/pixel_classifiers/ altındaki JSON model tanımlayıcısı (varsayılan tumor-stroma-RF).
pref.tip.atolye.minObjectArea=🩺 Klinik: Stroma içindeki tekil yanlış pozitif piksel beneklerinin tümör adacığı sayılmasını engeller.\n💻 Matematik: Piksel sınıflandırıcı maskesinden poligon üretirken elenecek minimum bağlı bileşen alanı (µm², varsayılan 10000.0).
pref.tip.atolye.minHoleArea=🩺 Klinik: Tümör adası içindeki küçük bez lümeni veya çekirdek arası boşlukları tek parça tümör yatağında kapatır.\n💻 Matematik: Poligon topolojisinde doldurulacak maksimum iç boşluk (hole) alanı (µm², varsayılan 5000.0).
pref.tip.atolye.maxTrainingSamples=🩺 Klinik: Çok geniş eğitim çizimlerinde bilgisayarın donmasını önler.\n💻 Matematik: Random Forest / yapay sinir ağı matrisine rastgele örneklenecek üst piksel sınırı (0 = sınırsız, varsayılan 100000).
pref.tip.atolye.warnNuclearCount=🩺 Klinik: Az hücreli küçük biyopsi odaklarında yüzdelerin birkaç hücreyle sert oynayabileceği uyarısını verir.\n💻 Matematik: Nükleer İHK özetinde örneklem büyüklüğü N < bu eşik olduğunda tetiklenen kalite kontrol bayrağı (varsayılan 500).
pref.tip.atolye.warnGenericCount=🩺 Klinik: Genel sayım modüllerinde yetersiz hücre sayısına karşı kullanıcıyı uyarır.\n💻 Matematik: Toplam tespit sayısı N < bu eşik olduğunda sonuç raporuna uyarı satırı ekler (varsayılan 200).
pref.tip.atolye.warnTissueAreaMm2=🩺 Klinik: Çok dar seçilmiş alanların tüm kesiti temsil etmeyebileceğini hatırlatır.\n💻 Matematik: Seçili ROI alanı (mm²) < bu eşik olduğunda küçük örnekleme alanı uyarısı üretir (varsayılan 1.0 mm²).
pref.tip.atolye.exportFolder=🩺 Klinik: İstatistik/Excel analizine gidecek ölçüm tablolarının proje içinde toplanacağı klasör adı.\n💻 Matematik: Proje kök dizinine göreli çıktı alt dizini (varsayılan exports).
pref.tip.atolye.exportSeparator=🩺 Klinik: Türkçe Excel/R/Python'da ondalık virgül karışıklığını önlemek için TAB (.tsv) önerilir.\n💻 Matematik: Düz metin tablo sütun ayracı karakteri ('\\t' veya ',').
pref.tip.atolye.exportScope=🩺 Klinik: Yalnız ekrandaki sanal lamı mı yoksa projedeki tüm olguları mı tabloya dökeceğinizi seçer.\n💻 Matematik: İterasyon kapsamı ('image' = aktif ImageData, 'project' = tüm ProjectImageEntry listesi).
pref.tip.atolye.exportDet=🩺 Klinik: Her bir hücrenin ayrı satır olduğu ayrıntılı tabloyu dışa aktarır (yüz binlerce satır olabilir).\n💻 Matematik: PathDetectionObject ölçüm listelerinin serileştirilmesi anahtarı.
pref.tip.atolye.exportAnn=🩺 Klinik: Çizdiğiniz her tümör/odak bölgesinin tek özet satır olduğu tabloyu dışa aktarır.\n💻 Matematik: PathAnnotationObject özet ölçümlerinin serileştirilmesi anahtarı.
pref.tip.atolye.exportGeo=🩺 Klinik: Çizdiğiniz bölge sınırlarını başka yazılımlara veya Python/yapay zekâ iş akışlarına taşır.\n💻 Matematik: JTS poligon koordinatlarının RFC 7946 GeoJSON FeatureCollection olarak dışa aktarımı.
pref.tip.atolye.exportColumnsMode=🩺 Klinik: Tabloda yüzlerce ham sütun yerine yalnız seçtiğiniz özet ölçümleri tutmanızı sağlar.\n💻 Matematik: Sütun projeksiyon modu ('all' = tam şema, 'subset' = beyaz liste filtresi).
pref.tip.atolye.exportColumns=🩺 Klinik: Alt küme modunda tabloya yazılacak ölçüm başlıkları.\n💻 Matematik: '|' ayracıyla birleştirilmiş sütun adı dizgesi (boşsa varsayılan özet sütunlar).
pref.tip.atolye.exportPrefix=🩺 Klinik: Çalışma veya kohort kodunu dosya adına otomatik ekler (hasta adı yazmayın).\n💻 Matematik: Çıktı dosya adının başına eklenen sabit dizge öneki.
pref.tip.atolye.exportDateSubfolder=🩺 Klinik: Farklı günlerde yaptığınız analizlerin birbirinin üzerine yazılmasını önler.\n💻 Matematik: Çıktı yoluna ISO-8601 (YYYY-AA-GG) tarih alt dizini ekler.
pref.tip.atolye.exportLocation=🩺 Klinik: Tabloları proje klasörü dışında ortak bir araştırma klasörüne kaydetmek için kullanılır.\n💻 Matematik: Mutlak dizin yolu (boş bırakılırsa <proje>/<exportFolder> kullanılır).

# Cell detection script: display text only; preference keys and measurements stay stable.
cell.noImage.title=Görüntü açık değil
cell.noImage.body=Önce bir lam açın (sol Proje panelinden çift tıklayın), sonra bu betiği tekrar çalıştırın.
cell.noRoi=Önce ölçmek istediğiniz alan anotasyonunu seçin (üst araç çubuğundan Dikdörtgen [R], Çokgen [P] veya Fırça [B] ile çizip üzerine tıklayın; seçili anotasyonun kenarı SARI görünür).
cell.noScale=Piksel kalibrasyonu yok; mm² hesaplanamaz (Yardımcılar → Kalibrasyon).
cell.results=Parametreler : eşik=%.2f  sigma=%.2f  genişletme=%.1f µm\n────────────────────────────\n  Toplam hücre        : %,d\n  Anotasyon alanı     : %.2f mm²\n  Hücre yoğunluğu     : ~%,d hücre/mm²\n  Süre                : %.1f sn\n\n⚠️ Yalnızca araştırma/eğitim amaçlı ölçüm üretir.
cell.title=Hızlı hücre tespiti
cell.instructions=Bir dikdörtgen anotasyon (R) çizip SEÇİN (kenarı sarı), sonra "Çalıştır".\nEşikleri değiştirip yeniden çalıştırabilirsiniz; sonuç aşağıda güncellenir.\nPerde arkası: dekonvolüsyon → Gaussian (σ) yumuşatma → eşik (ikili maske) → mesafe dönüşümü + watershed (bitişik çekirdekleri ayır). Bu adımları kendi lamınızda görmek için: Yardımcılar → Görüntü işleme kavramları.
cell.threshold.tip=İkili maske eşiği: Hematoxylin OD bu değerin ÜSTÜNDEKİ pikseller çekirdek\nadayı olur. Eşik, bulunan nesnelerin sayısını ve şeklini doğrudan değiştirir\n(Bankhead: binary image / eşikleme). Eşik tek başına yetmez — devamında\nmesafe dönüşümü + watershed bitişik çekirdekleri ayırır.
cell.sigma.tip=Gaussian filtre: σ (sigma) büyüdükçe görüntü daha çok yumuşatılır.\nDaha büyük σ aşırı bölünmeyi azaltır ama bitişik çekirdekleri birleştirebilir;\nçok küçük σ tek bir çekirdeği parçalara bölebilir.
cell.expansion.tip=ROI genişletme (µm): çekirdek maskesini dışa doğru büyüterek yaklaşık bir\nhücre/sitoplazma bölgesi tanımlar. 0 = yalnız çekirdek.
