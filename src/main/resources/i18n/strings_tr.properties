script.08b4993f18ec=AFİN HİZALAMA — (A) otomatik vs (B) elle:\n\n⚠ ÖNEMLİ: Sihirbazın (A) OTOMATİK yolu, Align'ın "AutoAligner" sınıfını İÇEREN bir derlemesini ister.\n   YAYINLANMIŞ 0.5.0 sürümü bunu İÇERMEZ (AutoAligner yalnız geliştirme/main dalındadır). Yani Align'ı\n   kursanız bile 0.5.0'da (A) KAPALI kalır — bu normaldir. O sürümde:\n     • [Analyze → Alignment → Interactive image alignment] ile hizalayın (Align KURULU olmalı),\n     • gösterilen 6 sayıyı (B) Elle matris kutusuna yapıştırıp "Elle matrisle aktar" deyin.\n   (A) yalnız AutoAligner içeren bir Align derlemesi kurulursa otomatik etkinleşir.\n\nqupath-extension-align KURULUMU (Interactive image alignment için — (B) yolu ve GUI hizalama):\n\nEN İYİSİ — resmî KATALOGDAN kurun (sürümünüzle EŞLEŞEN derlemeyi verir):\n  Extensions → Manage extensions → Manage extension catalogs → resmî QuPath kataloğu → Align → kur.\n\nElle .jar ile:\n  1. GitHub sürüm sayfasını açın (aşağıda), QuPath SÜRÜMÜNÜZLE uyumlu en son sürümü bulun.\n  2. "qupath-extension-align-X.Y.Z.jar" indirin — "-javadoc"/"-sources" ya da kaynak (zip/tar.gz) DEĞİL; düz .jar (~48 KB).\n  3. .jar'ı QuPath penceresine SÜRÜKLEYİP BIRAKIN.\n  4. QuPath'i YENİDEN BAŞLATIN; bu sihirbazı tekrar açın.\n\nZATEN KURDUYSANIZ AMA TANINMIYORSA (Analyze → Alignment menüsü de YOKSA):\n  Büyük olasılıkla SÜRÜM UYUMSUZLUĞU — QuPath uyumsuz eklentiyi yükleMEZ (menü çıkmaz, sınıfları görünmez).\n  • QuPath sürümünüzü kontrol edin (Help → About).\n  • Log'a bakın (View → Show log; "align" arayın) — uyumsuzluk/yükleme hatası orada yazar.\n  • Elle .jar yerine KATALOGDAN, sürümünüzle eşleşen Align'ı kurun (0.5.0 bazı 0.6/0.7 sürümlerinde yüklenmeyebilir).\n\nGitHub sürüm sayfasını şimdi açayım mı?
