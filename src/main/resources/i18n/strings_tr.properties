script.71a4bb03610a=Yalnızca Python ortamı. Ağırlıklar (didsr/HistoArt, AÇIK) sihirbazın ③ "Modeli indir" düğmesiyle ayrıca çekilir. DLA varyantı açık/CC0 (~94 MB); FMA varyantı ince ayarlı UNI'dir ve omurgası (MahmoodLab/uni) KAPILIDIR (CC-BY-NC-ND 4.0 + HF erişim onayı) — timm yalnız FMA için gerekir. Upstream requirements.txt'teki nvidia-*/triton tekerlekleri BİLEREK alınmaz (Linux kilit dosyası; CUDA torchBackend ile çözülür).
script.bd9a4f9844ab=Yalnızca Python ortamı. Ağırlık (nuclick_original-pannuke, ~255 MB) sihirbazın ③ düğmesiyle ayrıca çekilir; PanNuke ile eğitildiği için CC BY-NC-SA 4.0'dır (ticari kullanım yok). Ağ, TIA Toolbox'ın BSD-3-Clause yeniden uygulamasıdır — upstream nuclick_torch (CC BY-NC-SA) paketlenmez. scikit-image>=0.26: NuClick.postproc `remove_small_objects(..., max_size=)` çağırır; bu kwarg 0.26 ile geldi (tiatoolbox 2.1.3 zaten sabitler, taban açıkça yazılır).
