script.3270e96f1d5e=Lightweight (no torch needed). DICOM → SVS wizard; the DICOMtoSVS.py script is ALSO downloaded at run time (the repository is UNLICENSED → not bundled). Versions are pinned to the author's README (pydicom 2.4.5, numpy 1.26.4).
script.58e78baba98b=Hepatocyte — liver segmentation bridge
script.74211811727e=⚠️ Python environment only. The hepatocyte-app repository + model weight (🔒 on request) are ALSO required — buttons ②③ of the Hepatocyte wizard. openslide-bin brings the OpenSlide binaries via pip (no conda needed).
script.7d83676a4c70=MIDOG25 FCOS — mitosis detector (torchvision)
script.7515de6c07f2=⚠️ Python environment only. The FCOS_x101.ckpt weight + the MIDOG25 T1 reference CODE are ALSO required — the mitosis wizard's "Download model locally" button fetches both at run time (weight: the v1.0.0 release; code: a pinned commit; not bundled, no LICENSE file → research/education, at the user's own responsibility). SimpleITK + pyyaml + tqdm are what the reference code imports — if you installed this environment earlier, REINSTALL it.
script.f9a631d7b789=MIDOG DA-RetinaNet (legacy, UNVERIFIED)
script.2aeedb5adbab=⚠️ LEGACY/UNVERIFIED environment. fastai 1.0.61 + modern torch is a known fragile combination; it may not resolve or may raise an import error. The reference repository code + weight are downloaded at run time (not bundled, no LICENSE). Superseded — MIDOG25 FCOS is recommended instead.
script.cddfaa600bd9=MIDOG25 EffNetV2 — atypical classifier (timm)
script.dbd64be69c2f=⚠️ Python environment only. A typical/atypical CLASSIFIER (not a detector — run a mitosis detector first). efficientnetv2_m_fold3_best.pth is downloaded at run time from the v1.0.0 release (not bundled, no LICENSE → research/education).
script.387eb0379c6b=Sanofi EFTD — atypical classifier (DINOv3-H+, GATED)
script.f32fefe9dc21=⚠️ Typical/atypical CLASSIFIER (MIDOG25 T2 winner). PARTLY GATED: the LoRA adapters are open but the DINOv3-H+ backbone (facebook/dinov3-vith16plus) is GATED on HF — a Meta licence + `huggingface-cli login` are required (NOT automatic). DISABLED by default in the QuPath menu. Non-commercial research licence.
script.2f1de9594a30=HoVer-NeXt — nucleus segmentation + 7 classes (Lizard; NVIDIA GPU)
script.019fbf70e1c3=⚠️ NVIDIA CUDA GPU REQUIRED (HoVer-NeXt does not run on CPU). Python environment only: the HoVer-NeXt CODE (GPL-3.0, pinned commit) and the Lizard WEIGHTS (Zenodo 10635618, CC BY-NC-SA 4.0 — non-commercial) are downloaded at run time with the wizard's "Download model locally" button; not bundled, the code is run as a separate process. Versions are pinned to upstream (torch 2.1.1 + CUDA 12.1, smp 0.1.0, timm 0.9.6, zarr 2.16 → numpy<2); very new GPU architectures (e.g. RTX 50xx) may not be supported by this torch version. If the device selection is CPU the installation proceeds but HoVer-NeXt will not run.
script.2d34aca978cc=Classpose — H&E cell phenotyping (Cellpose-SAM)
script.1c51a56a3693=⚠️ Python environment only (~6 GB; GPU torch). The Classpose CODE (CC BY-NC 4.0, pinned commit f6aeadd) is installed into this environment at run time — not bundled with the workshop; the wizard runs it as a separate process. The model files (Hugging Face classpose/classpose, ~1.2 GB/model) and the optional GrandQC weights are downloaded from the wizard or used from a local folder. Python 3.13 is required (uv downloads it itself). On Windows the wizard sets TORCHDYNAMO_DISABLE=1 for GPU use (no Triton). cellpose is pinned to 4.0.8 (this commit does not open with the new cellpose); because the published package skips submodules, after every environment installation "Complete installation" must be run once in step ① of the wizard.
script.e0c715b1ff8f=CytoFormer — H&E cell type classification (ViT-g; NVIDIA GPU recommended)
script.0c062d406eb1=⚠️ Python environment only (~5 GB; GPU torch). The CytoFormer CODE (PENN Academic Software License — internal research/non-commercial use only, no redistribution) is downloaded into the data root from the pinned commit (36b667e) AFTER the licence confirmation in the wizard; not bundled, it runs as a separate process. The weight (Hugging Face zhihuanglab/CytoFormer, GATED, CC BY-NC 4.0, 2.7 GB) is used from a local folder or downloaded with an HF login. torchvision>=0.16 is DELIBERATELY explicit: the upstream requirements.txt does not list torchvision, timm pulls it without a bound and uv may resolve it to 0.2.0 (2018) → "torchvision.ops" error. timm is kept below 1.1 (timm builds the architecture; 1.0.29 verified). If you have no NVIDIA GPU, install the environment with device = CPU: forcing the CUDA torch into CPU mode crashed with 0xC0000005 on Windows; the CPU wheel works fine (~1.5–2 cells/s).
script.33f0312f3c7c=HistoPLUS — H&E cell segmentation + 13 (+1) classes (CellViT/H0-mini; NVIDIA GPU recommended)
script.92019aaeec71=⚠️ Python environment only (~6 GB; GPU torch). The HistoPLUS CODE (Owkin, CC BY-NC-ND 4.0 — non-commercial, derivatives are NOT shared) is installed into this environment at run time from the pinned commit (576b94e); it is not bundled with the workshop and is NOT MODIFIED. The weights (Hugging Face Owkin-Bioptimus/histoplus, GATED, ~285 MB × 2) are downloaded from step ② of the wizard with your own HF account or used from a local folder. Versions are PINNED to the upstream uv.lock (if unpinned, uv resolves pandas 3 / OpenCV 5; the upstream code has not been tested with them). xformers depends on torch 2.7.1: it exists on the CUDA 12.6/12.8 index, NOT on CUDA 11.8 (old NVIDIA driver → update the driver or install with device = CPU). If the device is CPU the standard PyPI wheel is used (the CPU index has no xformers). CPU inference works but is very slow (~7 min/mm²); GPU (RTX A4000) ~12 s/mm².
script.020227967a6f=VALIS — WSI registration (native; JDK/Java ALSO required)
script.651fd7a2f468=⚠️ For NATIVE mode only. valis-wsi + pyvips[binary] (libvips binary) + openslide-python & openslide-bin (OpenSlide binary → .svs/.ndpi are read FAST; otherwise VALIS falls back to the slow Bio-Formats path) are installed with pip; the torch CUDA wheel is chosen automatically with --torch-backend=auto (RTX A4000; the GPU speeds up feature matching — SLIDE READING/CONVERSION is disk/IO bound and does not use the GPU). A JDK (Bio-Formats/JPype) is ALSO required — Java on the system is enough. RECOMMENDED route: Docker (cdgatenbee/valis-wsi; all dependencies ready). See Kaynaklar → İleri kurulumlar → VALIS. Licence: VALIS = MIT.
