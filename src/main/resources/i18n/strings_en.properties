script.3cad69a43512=This slide already holds %,d annotation(s) from an earlier transfer by this wizard ("%s").\n\n"Add" deletes nothing; the new transfer becomes a separate set (named like "%s (2)"). Both sets stay on the slide.\n\n"Replace" deletes the annotations of the earlier transfer, including any manual corrections you made to them. Objects transferred with them (for example cell detections) are deleted too; objects you added inside them afterwards stay on the slide. Objects inside transfers made before this version carry no mark and stay on the slide; delete them by hand if needed. Annotations you drew yourself are not touched.\n\nCancel: nothing is run and nothing is written.\n\nWhat should happen to the earlier transfer?
