pref.tip.atolye.nuclear1=🩺 Clinical: Lower cutoff separating faint nuclear DAB staining from negative nuclei (Ki-67, ER, PR).\n💻 Computation: Assigns ≥1+ when intra-nuclear Beer–Lambert DAB OD mean ≥ cutoff (typical 0.10–0.25, default 0.20).
pref.tip.atolye.nuclear2=🩺 Clinical: Moderate nuclear IHC brown staining cutoff (weighted ×2 in H-score).\n💻 Computation: Assigns ≥2+ when nuclear DAB OD mean ≥ cutoff; requires 1+ < 2+ < 3+ (default 0.40).
pref.tip.atolye.nuclear3=🩺 Clinical: Strong, dense nuclear DAB staining cutoff (weighted ×3 in H-score).\n💻 Computation: Assigns 3+ when nuclear DAB OD mean ≥ cutoff (typical 0.50–0.80, default 0.60).
pref.tip.atolye.membrane1=🩺 Clinical: Faint membranous DAB rim cutoff separating 1+ from negative (HER2 IHC).\n💻 Computation: Assigns ≥1+ when membrane compartment DAB OD mean ≥ cutoff (default 0.15).
pref.tip.atolye.membrane2=🩺 Clinical: Moderate circumferential membranous DAB staining cutoff.\n💻 Computation: Assigns ≥2+ when membrane DAB OD mean ≥ cutoff (typical 0.30–0.50, default 0.40).
pref.tip.atolye.membrane3=🩺 Clinical: Strong, thick membranous DAB staining cutoff.\n💻 Computation: Assigns 3+ when membrane DAB OD mean ≥ cutoff (typical 0.55–0.85, default 0.70).
pref.tip.atolye.cyto1=🩺 Clinical: Weak granular cytoplasmic DAB cutoff for macrophage/cytoplasmic markers (CD68).\n💻 Computation: Assigns ≥1+ when cytoplasmic ring DAB OD mean ≥ cutoff (default 0.10).
pref.tip.atolye.cyto2=🩺 Clinical: Moderate cytoplasmic DAB staining cutoff.\n💻 Computation: Assigns ≥2+ when cytoplasmic DAB OD mean ≥ cutoff (default 0.20).
pref.tip.atolye.cyto3=🩺 Clinical: Strong cytoplasmic DAB staining cutoff.\n💻 Computation: Assigns 3+ when cytoplasmic DAB OD mean ≥ cutoff (default 0.35).
pref.tip.atolye.pixDab1=🩺 Clinical: Weak brown pixel threshold when individual cell boundaries cannot be segmented.\n💻 Computation: Counts pixel as 1+ when color-deconvolved DAB OD ≥ cutoff (default 0.10).
pref.tip.atolye.pixDab2=🩺 Clinical: Pixel-level moderate DAB-stained area cutoff.\n💻 Computation: Assigns pixel to 2+ bin when DAB OD ≥ cutoff (default 0.30).
pref.tip.atolye.pixDab3=🩺 Clinical: Pixel-level strong DAB-stained area cutoff.\n💻 Computation: Assigns pixel to 3+ bin when DAB OD ≥ cutoff (default 0.60).
pref.tip.atolye.pixHmask=🩺 Clinical: Excludes bare glass and empty lumen so only tissue/nuclear pixels enter the denominator.\n💻 Computation: Pixels with Hematoxylin OD ≥ cutoff OR DAB ≥ 1+ form the total tissue denominator (default 0.05).
pref.tip.atolye.cellposeModel=🩺 Clinical: Pretrained deep-learning model tracing whole-cell membranes in the HER2 module.\n💻 Computation: Cellpose weight selection (cyto3: general whole-cell, cyto2: legacy, nuclei: nuclear-only).
pref.tip.atolye.cellposeDiameter=🩺 Clinical: Typical tumor cell width in pixels on the current slide.\n💻 Computation: Target diameter rescaling input tiles to network training scale (px; 0 = auto-estimate, default 25).
pref.tip.atolye.cellposeFamily=🩺 Clinical: Segmentation model family used in the Cellpose helper wizard.\n💻 Computation: Inference backbone (cyto3, cyto2, nuclei, or Transformer-based cpsam).
pref.tip.atolye.cellposeFlow=🩺 Clinical: Tolerance for accepting irregularly shaped pleomorphic tumor cells.\n💻 Computation: Maximum allowed MSE between reconstructed gradient flow and network prediction (default 0.4).
pref.tip.atolye.cellposeCellprob=🩺 Clinical: Sensitivity to faint cells (lower values capture paler cells).\n💻 Computation: Foreground logit threshold in [-6, +6] before flow integration (default 0.0).
pref.tip.atolye.stardistThreshold=🩺 Clinical: Suppresses false-positive detections in crowded overlapping nuclei.\n💻 Computation: Minimum center object probability [0, 1] prior to star-convex polygon NMS (default 0.5).
pref.tip.atolye.stardistPixelSize=🩺 Clinical: Effective magnification resolution at which StarDist reads the WSI (0.5 µm ≈ 20×).\n💻 Computation: Physical tile sampling spacing from the WSI pyramid (µm/px > 0, default 0.5).
pref.tip.atolye.stardistCellExpansion=🩺 Clinical: Width of the approximated cytoplasmic ring grown outward from each nuclear contour.\n💻 Computation: Euclidean dilation radius (µm) clipped at Voronoi boundaries between neighboring nuclei (default 5.0).
pref.tip.atolye.pixelSize=🩺 Clinical: Microscope magnification equivalent used for classical nucleus detection (0.5 µm ≈ 20×).\n💻 Computation: Resampled MPP spacing before Watershed (µm/px; halving increases pixel count 4×, default 0.5).
pref.tip.atolye.cellExpansionNuclear=🩺 Clinical: Approximated cytoplasmic ring added around nuclei in nuclear IHC and H&E workflows.\n💻 Computation: Constrained morphological dilation distance outward from nuclear polygon (µm, default 5.0).
pref.tip.atolye.cellExpansionCyto=🩺 Clinical: Wider cytoplasmic ring for abundant macrophage cytoplasm (CD68) and epithelial membranes (HER2).\n💻 Computation: Voronoi-clipped outward dilation radius from nuclear contour (µm, default 7.0).
pref.tip.atolye.sigma=🩺 Clinical: Prevents coarse chromatin clumps from over-splitting a single nucleus into fragments.\n💻 Computation: Standard deviation σ (µm) of the 2D isotropic Gaussian filter before local maxima seeding (default 1.5).
pref.tip.atolye.backgroundRadius=🩺 Clinical: Compensates uneven background staining near tissue edges or folds.\n💻 Computation: Structuring-element radius for rolling morphological opening background subtraction (µm; 0 = off, default 8.0).
pref.tip.atolye.minArea=🩺 Clinical: Excludes apoptotic debris, platelets, and dust specks from cell counts.\n💻 Computation: Lower area bound for segmented connected components (µm², default 10.0).
pref.tip.atolye.maxArea=🩺 Clinical: Excludes large pigment blobs or unsplit syncytial clumps from single-cell counts.\n💻 Computation: Upper area bound for segmented nuclear polygons (µm² ≥ minArea, default 400.0).
pref.tip.atolye.medianRadius=🩺 Clinical: Removes scanner salt-and-pepper noise while preserving crisp nuclear edges.\n💻 Computation: Non-linear 2D median rank-filter radius (µm; 0 = disabled, default 0.0).
pref.tip.atolye.detectionThreshold=🩺 Clinical: Minimum counterstain darkness required to detect pale vesicular nuclei.\n💻 Computation: Minimum optical density threshold for foreground nuclear seeding after background subtraction (OD, default 0.1).
pref.tip.atolye.detectionChannel=🩺 Clinical: Selects which stain component drives nucleus detection (use Optical density sum if heavy DAB masks hematoxylin).\n💻 Computation: Input channel after color deconvolution (Hematoxylin OD or Optical density sum).
pref.tip.atolye.watershed=🩺 Clinical: Splits touching tumor or lymphoid nuclei so clusters are counted as individual cells.\n💻 Computation: Marker-controlled Watershed partitioning over distance transform and intensity valleys (default enabled).
pref.tip.atolye.pixScale=🩺 Clinical: Speeds up pixel-level H-score scanning over large tissue regions.\n💻 Computation: Pyramid downsample factor ≥ 1.0 (1.0 = full base resolution).
pref.tip.atolye.classifierName=🩺 Clinical: Project identifier under which your trained tumor–stroma classifier is saved and loaded.\n💻 Computation: JSON classifier key inside project/classifiers/pixel_classifiers/ (default tumor-stroma-RF).
pref.tip.atolye.minObjectArea=🩺 Clinical: Filters out isolated false-positive stromal specks from being converted into tumor islands.\n💻 Computation: Minimum connected-component polygon area retained from pixel classifier masks (µm², default 10000.0).
pref.tip.atolye.minHoleArea=🩺 Clinical: Fills small intratumoral gland lumina or retraction gaps inside contiguous tumor beds.\n💻 Computation: Maximum interior polygon hole area filled during mask vectorization (µm², default 5000.0).
pref.tip.atolye.maxTrainingSamples=🩺 Clinical: Prevents UI freezes when large training annotations are drawn.\n💻 Computation: Cap on randomly subsampled feature rows fed into the Random Forest / MLP trainer (0 = unlimited, default 100000).
pref.tip.atolye.warnNuclearCount=🩺 Clinical: Flags pauci-cellular biopsy foci where a few cells can swing Ki-67 percentages (Nielsen recommendation).\n💻 Computation: Sample-size QC warning triggered when total detected nuclei N < threshold (default 500).
pref.tip.atolye.warnGenericCount=🩺 Clinical: Alerts the user when too few cells are present for stable proportion estimates.\n💻 Computation: Appends a low-sample warning banner when detection count N < threshold (default 200).
pref.tip.atolye.warnTissueAreaMm2=🩺 Clinical: Reminds the reader that tiny ROIs may under-sample heterogeneous tissue.\n💻 Computation: Triggers a small-area QC banner when selected ROI area (mm²) < threshold (default 1.0 mm²).
pref.tip.atolye.exportFolder=🩺 Clinical: Folder inside the project where measurement tables for Excel/R/Python are collected.\n💻 Computation: Output subdirectory relative to the QuPath project root (default exports).
pref.tip.atolye.exportSeparator=🩺 Clinical: TAB (.tsv) avoids decimal-comma collisions when opening tables in European/Turkish Excel.\n💻 Computation: Plain-text column delimiter character ('\\t' or ',').
pref.tip.atolye.exportScope=🩺 Clinical: Chooses whether to export only the currently open WSI or every slide in the project.\n💻 Computation: Export iteration scope ('image' = active ImageData, 'project' = all ProjectImageEntry items).
pref.tip.atolye.exportDet=🩺 Clinical: Exports single-cell rows (can contain hundreds of thousands of rows per slide).\n💻 Computation: Boolean toggle serializing PathDetectionObject measurement lists.
pref.tip.atolye.exportAnn=🩺 Clinical: Exports one summary row per drawn region/annotation.\n💻 Computation: Boolean toggle serializing PathAnnotationObject summary measurements.
pref.tip.atolye.exportGeo=🩺 Clinical: Transfers drawn region polygons to external viewers or Python/ML pipelines.\n💻 Computation: Exports JTS geometries as an RFC 7946 GeoJSON FeatureCollection.
pref.tip.atolye.exportColumnsMode=🩺 Clinical: Keeps exported tables compact by retaining either all columns or only selected summary metrics.\n💻 Computation: Column projection mode ('all' = full schema, 'subset' = whitelist filter).
pref.tip.atolye.exportColumns=🩺 Clinical: Measurement column headers included when subset mode is active.\n💻 Computation: Pipe-delimited ('|') column whitelist string (blank uses curated summary defaults).
pref.tip.atolye.exportPrefix=🩺 Clinical: Prepends a study or cohort code to exported filenames (never enter patient identifiers).\n💻 Computation: Literal prefix prepended to output filenames.
pref.tip.atolye.exportDateSubfolder=🩺 Clinical: Prevents exports from different days from overwriting one another.\n💻 Computation: Appends an ISO-8601 (YYYY-MM-DD) date directory to the output path.
pref.tip.atolye.exportLocation=🩺 Clinical: Saves tables to a shared research folder outside the QuPath project directory.\n💻 Computation: Absolute target directory path (blank defaults to <project>/<exportFolder>).
