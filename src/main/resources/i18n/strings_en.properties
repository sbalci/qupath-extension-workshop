script.6542cc6fbe0a=Model: fixed "KongNet MIDOG" for H&E mitoses (MIDOG 2025 winner), the only TIA Toolbox model suited to mitosis here. To experiment with nucleus/cell detectors (PanNuke/CoNIC/MONKEY/MapDe), use Utilities → Python bridges & foundation models → "TIA Toolbox — bölge modelleri" (imports every class). Model list/licences: module page "Mitosis models".\nPython + bridge are detected automatically (tiatoolbox-runtime/.venv and handson/python/tiatoolbox/). Device: cuda for GPU.\nSensitivity threshold: KongNet default 0.99 (very conservative — few/no detections). Lower for more mitoses (e.g. 0.5); blank = model default. Lower thresholds produce more detections and more false positives — verify predictions visually.\nLocal model: "Download model locally" downloads weights under the data root ONCE; then check "Work offline" to run without network access (like GrandQC).
