script.af351c8fee8e=Generalization/batch effect: FM embeddings may encode the scanner/center signature more than biology (de Jong 2025). Validate across multiple centers; if needed, apply stain normalization (Stain normalization appendix).
script.6f3b61683409=Input integrity: FM output can be corrupted by adversarial perturbations that are invisible to the eye (UTAP — Wang et al. 2026). Feed only trusted, unmodified pixels; check the output for plausibility.
script.76074ad52153=Validation: no FM output should become a clinical decision without passing the plausibility/validation checks of the Evaluating AI Tools appendix.
