script.1a1597c219e8=%,d images hold %,d copy groups in total: the same summary sits on the slide as "name", "name (2)", "name (3)". The copies can hold different numbers, and this tool cannot decide which one is current.\n\nExamples (slide · name: copy numbers; 1 = the name without a number):\n%s\n\n"All copies": each copy is written to its own columns under its own name ("name · measurement", "name (2) · measurement"); a copy information column is added to the table.\n\n"Newest only": in each group only the highest-numbered copy enters the table. If the newest copy is not locked, that group does not appear in the table at all. Nothing is deleted from the slide.\n\nCancel: nothing is written.\n\nWhich should be written?
