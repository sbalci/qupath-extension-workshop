script.04273d6ac80a=EARLIER RESULT REPLACED\n%,d class region(s) and %,d old summary annotation(s) created by the tool itself were deleted (other objects inside them were kept). No region you drew and no unmarked summary was deleted; the summary region was kept and the measurements were recalculated in it.
script.a2c2f2d27f11=This slide already has %,d tumor/stroma summary annotation(s); the number of class regions that Replace could delete is %,d.\n\n"Add" deletes nothing; the new result becomes a separate summary (such as "Tümör-Stroma Özet (2)") with its own class regions (if the summary is switched off, the new regions are named like "Tumor (2)"). The earlier summaries stay as they are.\n\n"Replace" deletes the earlier Tumor/Stroma class regions this wizard produced — corrections you made by hand to them go too. The region you used as the summary is NEVER deleted: its outline, name and class are kept and only its measurements are recalculated in the same annotation. Only old summary annotations that the tool itself created are deleted; summaries that are not marked by the tool (left over from an older version) stay as they are. Other objects inside (cell detections, your own annotations) are not deleted.\n\nCancel: nothing is run and nothing is written.\n\nWhat should happen to the earlier tumor/stroma result?
