script.3a8ffbde40a5=Possible cause: a native crash — memory access violation (0xC0000005 / segfault). It usually results from a libvips/JVM DLL conflict or from materialising a very large image in memory.\nSuggestion: try WSL mode (the recommended route on Windows), tick "Rigid registration only" or reduce the "max. processed size (px)" value.
script.a149d2f1d931=Possible cause: insufficient memory (OOM) — the process may have been terminated by the system.\nSuggestion: if you use WSL, raise the memory limit in .wslconfig; reduce the "max. processed size (px)" value or run with fewer slides at the same time.
script.33d3b03e1046=Possible cause: the disk is full.\nSuggestion: free up space in the working/output folder; if you are in WSL mode, also check the size of the WSL virtual disk (vhdx).
script.f068046f297e=Possible cause: the VALIS Python environment (venv) was not found or is configured incorrectly.\nSuggestion: verify the Python path on the "Configure" screen; for the installation steps see Kaynaklar → İleri kurulumlar § VALIS.
script.f58570c6722d=Possible cause: a slide file was moved/deleted/is not accessible.\nSuggestion: verify the project slide paths; if needed, reconnect them with "⟳ Refresh" in QuPath.
script.56b8677ee6dc=Possible cause: a problem with the Java/Bio-Formats engine.\nSuggestion: try WSL mode; if the problem persists, examine the whole log file ("Open log folder").
