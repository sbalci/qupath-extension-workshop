script.422a4173507c=A split in metadata cannot be ignored; these checks ALWAYS run and cannot be disabled:\n  • one slide cannot be written to multiple splits,\n  • processing stops if the slide already has tiles in another split of this dataset,\n  • processing stops if another slide from the same patient has a different project split,\n  • slides with and without splits cannot be written to the same dataset,\n  • processing stops without a patient ID (no confirmation override).\nThe script reads existing splits; it does not assign them.
script.1a6cade51ab0=General principles\n  1. Specify scale with µm/px, not magnification; field of view = tile (px) × µm/px.\n  2. Enable overlap only for reassembly or structures cut at edges.\n     Overlapping tiles are near-duplicates and must stay in the same split.\n  3. Split by patient, not tile (Split and leakage tab).\n  4. Exclude background and artefacts before tiling: tissue detection, Ignore* annotations, minimum coverage.\n  5. Record settings and selection strategy in the dataset folder name and tile list.\nThere is no single correct setting; it depends on the task and model.
script.1a1d63ded5bb=Purpose:
script.32dda5ecb3ae=Minimum tissue must be between 0 and 100.
script.f40f8cbb77d2=White threshold must be between 0 and 255.
script.f926121d0385=When "Tile list only" is selected, the tile list must be written; otherwise no output remains.
script.6e9ec408d92c=Tile size must be positive.
script.0cf85ef92df6=Overlap must be between 0 and the tile size.
script.8e93cdec978b=Minimum coverage must be between 0 and 100.
script.872f63359aff=Maximum tiles per label must be zero or positive.
script.4f430437da6b=JPG quality must be between 1 and 100.
script.d26b732a080f=At least one label must be checked.
script.d6a9056600e1=Output folder cannot be empty.
script.f789ee23e760=At least one split key is required; leaving it empty would disable split checks.
script.33772ce511e9=Tile size, overlap, maximum tiles and JPG quality must be integers; resolution and coverage must be decimals (e.g. 512 / 64 / 0 / 90 / 0.5 / 50).
