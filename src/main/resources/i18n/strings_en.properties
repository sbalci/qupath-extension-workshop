script.6d0d550fbb7f=Tile classification / slide-level model (MIL)
script.e4ffb6e69c80=Overlap 0: the same tissue is not counted twice and tiles share no pixels.\n
script.15b89aa1087d=Minimum coverage 50: edge tiles that are mostly background or a neighbouring region are dropped.\n
script.accea3191a6b=Every slide is cut at the same µm/px; 20× and 40× scans give the same physical area.
script.9ac0979c6429=Feature extraction with a foundation model
script.6eee032e900d=Common starting point: 224 px, 0.5 µm/px. Look at the model card FIRST: tile size and µm/px must equal the values\n
script.496bf826f1f8=the model was trained with. At the wrong scale the model gives no error, it gives wrong answers.\n
script.54555cad1a86=Overlap 0: when embeddings are pooled at slide level, the same tissue is not weighted twice.
script.d5463859d11d=Segmentation training (image + mask)
script.6ef6daa0916f=Mask mode: a matching label mask is written for every tile (PNG is required; JPG corrupts label values).\n
script.36dc67156acc=Overlap 64 px: structures cut at a tile edge appear whole in the neighbouring tile.\n
script.baa800711124=Coverage 0: boundary tiles are needed too; the model learns the boundary.
script.b8df358264a2=Cell / nucleus-level training
script.7994f09cb462=A fine scale for cell detail (≈ 0.25 µm/px, 40×). A scale finer than the slide's own µm/px does not create new detail.\n
script.23bbc4f239aa=Small overlap: a nucleus cut at the edge is whole in the neighbouring tile.
script.550b104ad31f=Tiles for sharing
script.2f452fa46f7f=Overlap 0: shared tiles must carry no common information; the slide must not be reconstructible from the tiles.\n
script.f4e68cd88337=Before sharing, look at the file names and the tile list: the slide name must not carry an identifier.
