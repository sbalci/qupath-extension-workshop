script.168ae77dcf81=HistoART — artifact detection (WSI quality control)
script.71a4bb03610a=Python environment only. The weights (didsr/HistoArt, OPEN) are fetched separately with button ③ "Download model" of the wizard. The DLA variant is open/CC0 (~94 MB); the FMA variant is a fine-tuned UNI and its backbone (MahmoodLab/uni) is GATED (CC-BY-NC-ND 4.0 + HF access approval) — timm is needed only for FMA. The nvidia-*/triton wheels in the upstream requirements.txt are DELIBERATELY not taken (a Linux lock file; solved by the CUDA torchBackend).
script.bd9a4f9844ab=Python environment only. The weight (nuclick_original-pannuke, ~255 MB) is fetched separately with button ③ of the wizard; because it was trained on PanNuke it is CC BY-NC-SA 4.0 (no commercial use). The network is TIA Toolbox's BSD-3-Clause reimplementation — the upstream nuclick_torch (CC BY-NC-SA) is not bundled. scikit-image>=0.26: NuClick.postproc calls `remove_small_objects(..., max_size=)`; this kwarg arrived in 0.26 (tiatoolbox 2.1.3 already pins it, the floor is written explicitly).
