script.dfcd82089a2a=Outputs (results / ome / geojson / multiplex) go under the output folder; blank uses the working folder. Native mode allows output on another drive (e.g. E:\\ for large OME-TIFFs). Docker: input AND output must be UNDER the working folder (one mount → /work). Native: python.exe must point to the VALIS venv; install libvips + Java separately. WSL (RECOMMENDED on Windows — native Windows VALIS may crash in this environment): provide Python inside WSL (venv with valis-wsi + pyvips[binary]); Windows paths are converted automatically to /mnt/…. WSL has no Docker-style single-root requirement.
