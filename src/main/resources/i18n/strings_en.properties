script.c10fbc709b72=Check slides to register (in the SAME folder as the source; VALIS registers ≥2 slides together). "Marker name" is the channel prefix. "Stain" is the deconvolution type: H-DAB for IHC (→ {marker}-DAB + -Hematoksilen), H&E for H&E (→ -Hematoksilen + -Eozin); names containing "HE" select H&E automatically. "Colour" is the marker's SIGNAL channel (DAB/Eosin) colour in QuPath — choose a different colour per marker (defaults are already distinct). Colour affects only MULTICHANNEL multiplex; the natural-colour composite uses actual stain colours. Hematoxylin is always blue-purple.
