script.7a5d76d61df4=Strip ≠ cell appearance: the color strip is a legend for the MEAN OD value; granular-strong and diffuse-weak staining can share the same mean. The real reference is the cell crops above.
script.23687f3eb12e=With very large detection sets, reclassifying on every release can cause lag — so "Apply live" can be turned off.
script.345e0989fa7a=Caution: the default thresholds are calibrated for DAB; use them as a starting point for this chromogen, not as a validated default.
script.f4ed80f726f6=1) Strip ≠ cell appearance — a flat color swatch at OD 0.4 does NOT mean "a 2+ cell looks like this"; the mean can be the same for different staining patterns. That is why the crops exist.
script.c8e03db77b62=2) Colors depend on the stain vector — the strip is generated from the image's current vector estimate; a wrong estimate shows wrong colors. Run the Stain vector wizard first (Utilities → Stain & color).
script.7a646d23c8e4=3) Crops are single examples — each slot shows the ONE cell CLOSEST to the target OD; it cannot show the variety around that value. The whole distribution is in the histogram.
script.e05d5a8d4fa6=4) A threshold moves the result directly — dragging a threshold changes the 1+/2+/3+ distribution and the H-score by definition; there is no single "correct" threshold. Choose a threshold consistent with your method reference and document it; do not change it from slide to slide within the same study. "Suggest automatically" (3-threshold Otsu) is only a data-driven starting suggestion — it makes no claim of methodological accuracy.
script.153e054395ab=5) It only reclassifies — it does not touch the detection/expansion parameters (rerun the module for those). The pixel-based H-score is NOT recomputed; stale measurements are cleared on every apply.
script.f82e77c97fbe=6) Size cost of live apply — with large sets, reclassifying on every release can lag; that is why it is an on/off option.
script.dfa197d9fb6c=7) It produces measurements, not interpretation — it does not suggest clinical thresholds/categories.
script.a3a5b4b6c6b0=8) Live apply consumes the undo stack — every apply records one Ctrl+Z step and QuPath keeps 10 steps; after a long tuning session, do not rely on Ctrl+Z to return to the pre-wizard state. Reset + dragging is the lossless way back from the measurements.
script.22b9462393ab=9) Pixel-level alternative — pixel color thresholding already exists in QuPath: Classify → Pixel classification → Create thresholder. This wizard works one layer above, on the mean chromogen OD per cell; the two complement each other rather than back each other up.
script.fa37f3451c5e=10) The default thresholds are calibrated for DAB — for other chromogens such as AEC they are a starting point, not a validated default.
