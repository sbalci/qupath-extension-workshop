script.94f0d15b2170=This image has no colour deconvolution (stain) vectors.\n\nPossible cause: the image type is not brightfield (e.g. fluorescence/other).\n\nNext steps:\n  • Use [Extensions → Atölye → Utilities → Basic tools → Set image type] to select\n    Brightfield (H&E) or Brightfield (H-DAB).\n  • Native QuPath command: Analyze → Preprocessing → Estimate stain vectors\n  • Details:\u0020
script.d1571e7fdcdb=Estimating stain vectors from pixels in the selected region. Please wait…
script.5f33cf07763a=Inspect the new vectors. If suitable, choose [Apply] (reversible); otherwise [◀ Back to report] keeps the image unchanged.
script.3dccd7576426=Select a representative REGION to estimate stain vectors.\n\nSteps:\n  1. Draw a SMALL rectangle/polygon annotation containing both stains\n     and some background (a large region unnecessarily increases downsampling)\n  2. Keep that annotation selected (click it)\n  3. Choose "↻ Try again" below\n\nQuPath estimates from the pixels in this region.\n(Official command: Analyze → Preprocessing → Estimate stain vectors ·\u0020
