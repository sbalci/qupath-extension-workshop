cell.noImage.title=No image open
cell.noImage.body=Open a slide first (double-click it in the Project panel), then run this script again.
cell.noRoi=Select the area annotation to measure: draw a closed region with Rectangle [R], Polygon [P] or Brush [B], then click it. The selected annotation has a YELLOW border.
cell.noScale=Pixel calibration is missing; mm² cannot be calculated. Open Utilities → Basic tools → Calibration (pixel size).
cell.results=Parameters : threshold=%.2f  sigma=%.2f  expansion=%.1f µm\n────────────────────────────\n  Total cells         : %,d\n  Annotation area     : %.2f mm²\n  Cell density        : ~%,d cells/mm²\n  Time                : %.1f s\n\n⚠️ Research and educational measurements only.
cell.title=Quick cell detection
cell.instructions=Draw and SELECT a rectangular annotation (R; yellow border), then click "Run".\nChange the thresholds and run again; the results update below.\nBehind the scenes: deconvolution → Gaussian (σ) smoothing → threshold (binary mask) → distance transform + watershed (separate touching nuclei). To see these steps on your slide, open Utilities → Image-processing concepts.
cell.threshold.tip=Binary-mask threshold: pixels ABOVE this Hematoxylin OD value become nuclear candidates.\nChanging it changes the number and shape of detected objects\n(Bankhead: binary image / thresholding). Thresholding alone is insufficient;\ndistance transform + watershed then separate touching nuclei.
cell.sigma.tip=Gaussian filter: a larger σ (sigma) smooths the image more.\nLarger σ reduces over-segmentation but may merge touching nuclei;\nvery small σ may split one nucleus into several objects.
cell.expansion.tip=ROI expansion (µm): expand each nuclear mask outward to approximate\na cell/cytoplasmic region. 0 = nucleus only.
