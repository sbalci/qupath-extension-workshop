script.3de093221862=Image only: RGB tiles. Image + label mask: a mask built from the annotation classes (for segmentation training).
script.953642ef7970=Selected annotation(s): only the ROIs you selected. All annotations: every annotation on the slide.
script.40df2db6df15=Edge length of each tile (pixels). Typical: 224, 256, 512.
script.0534807c8def=Resolution (µm/px):
script.5cf7fce8ea43=Target resolution; gives the same physical area on 20× and 40× slides. If the slide is not calibrated it is interpreted as a downsample factor.
script.babcdc19a188=Overlap (px):
script.77a5385ee45f=Pixels shared between neighbouring tiles. 0 = no overlap. If >0, random splitting at tile level leads to leakage.
script.9a5649a42cb2=Format:
script.cdc98ea4bae3=PNG: lossless. JPG: small but lossy. TIFF: lossless, large. Forced to PNG in mask mode.
script.a20e7e828354=JPG quality (1–100):
script.cfe99d363120=Used only if JPG is selected.
script.ceb0911c4527=Subtract exclusion regions from the others
script.43ed45167b26=Subtract child annotations from the parent annotation
script.826589053e36=Foldering:
script.62f462526d47=Tile label: the annotation's class, its name, or both. Unclassified and unnamed annotation: Sinifsiz.
script.5a43cd90414c=Labels:
script.5e1546d7005c=The labels and annotation counts that this slide will produce with the selected scope and foldering. An unticked label is skipped. The list refreshes when scope / foldering / exclusion changes.
script.75a003f9b6e1=Exclusion classes:
script.f27a45f5aa8f=Separate with commas; a trailing * means prefix (e.g. Ignore*, Artifact, Fold, Blur). These classes produce no tiles.
script.996b19cd30a9=Exclusion annotations such as folds or pen marks are cut out of the other regions and discarded.
script.2e28ed29431a=For nested annotations such as Tumor inside tissue, the parent region is tiled with the child region subtracted.
script.d3cb3ce18941=Minimum coverage (%):
script.f30261966e0c=At least this fraction of the tile's area must lie inside the label region. 0 = any overlap is enough; to drop edge tiles use e.g. 50.
script.32d8b49ffe28=Boundary tiles: if a tile touches two label regions, it is written only to the label with the largest coverage. The same pixels never go into two folders; this setting cannot be turned off.
script.fdb43c93704e=Minimum tissue (%):
script.fb6f8a35b97d=At least this fraction of the tile's pixels must be tissue (darker than the whiteness threshold). 0 = off. Removes empty-glass tiles if the annotation was drawn generously.
script.9c5c32899757=Whiteness threshold (0–255):
script.536f7b7253a3=Pixels with a gray value below this count as tissue. 220 is a common starting point; raise it for pale staining.
script.5da3306ceb16=Maximum per label:
script.96c634df2520=0 = unlimited. If you give a number, that many tiles are chosen at random (reproducibly) from each label. The cap applies to THIS SLIDE and after the tissue filter; the cluster-wide balance is shown by the cluster summary in the result window.
script.f6d7fb2b11e1=Write the label into the file name
script.203a66546c4b=Write the split into the file name
