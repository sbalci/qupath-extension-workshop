script.a6d0de40a16d=%,d images hold %,d copy groups in total: the same result sits on the slide as "name", "name (2)", "name (3)". The copies can hold different numbers, and the export cannot decide which one is current.\n\nExamples (slide · name: copy numbers; 1 = the name without a number):\n%s\n\n"All copies": everything is exported. The data files keep their format; the copies are listed in the result window and in the ".kopyalar.txt" file in the export folder.\n\n"Newest only": in each group only the highest-numbered copy stays; older copies and the objects inside them (annotations, detections) are not exported. Nothing is deleted from the slide.\n\nCancel: nothing is exported.\n\nWhich should be exported?
