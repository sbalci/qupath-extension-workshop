script.959092fda2c3=Model: the official MIDOG 2025 Task 1 reference (FCOS-ResNeXt101), fixed. Weights and reference code are not bundled; "Download model locally" fetches both once (weights: release v1.0.0; code: pinned commit — model setup and tiled inference use that code unchanged; no LICENCE file, research/teaching workflow under the user's responsibility). Reinstall midog-fcos if it was installed before this version (SimpleITK + pyyaml added).\nPython + bridge are detected automatically (midog-fcos venv and handson/python/midog/). Device: cuda for GPU.\nTarget resolution: the ROI is resampled to this µm/px before FCOS (default 0.25: the model was trained at MIDOG image base level, ~40×; at 0.5, mitoses are half the size seen during training). Sensitivity threshold: reference 0.548; lower for more detections (e.g. 0.3) — also more false positives, so verify visually.
