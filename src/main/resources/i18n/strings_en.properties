script.fcd4e17529fd=This slide's image type is Brightfield (H-DAB), but no stain named "Hematoxylin" is defined.\nDefined stains: %s\n\nThis tool needs the Hematoxylin and DAB channels. To continue, QuPath's default H-DAB stain vectors must be applied. This CHANGES the slide's CURRENT stain vectors; vectors you estimated yourself will be lost.\n\nApply the default H-DAB stain vectors?\n\nIf you answer "No", nothing is changed and the tool does not open.
