script.53ec67e56b06=You do not seem to have access to the model backbone. This model is gated on Hugging Face; access is not granted automatically.\n\nWhat to do:\n  1. Open huggingface.co/facebook/dinov3-vith16plus-pretrain-lvd1689m, sign in and accept the licence terms.\n  2. Wait for access approval (the time depends on Meta).\n  3. In your Hugging Face account, under Settings → Access Tokens, create a token of type "read".\n  4. Open a command window (Windows: Start → "cmd"), run this command and paste the token:\n       %s\n  5. Run the wizard again.\n\nUntil access arrives you can use the "Atypical subtyping — MIDOG25 EffNetV2" entry; that model is not gated.
