script.509962e49777=Default channel mode applies to IHC slides with no manual "Stain" selection and no H&E inferred from the name: hed = Hematoxylin + DAB (RECOMMENDED), dab = DAB only, rgb = raw RGB. H&E rows with "Stain = H&E" produce Hematoxylin + Eosin. Level 0 = full resolution (slow/large); 2 ≈ a useful viewing balance; level 3 is faster for quick "↻ Merge again" trials (smaller warp + write).
script.943812e20891=TWO OUTPUT TYPES — choose for your purpose (details: Appendices → Image Registration §7.2):\n  • COMPOSITE OFF (default) → MULTICHANNEL multiplex (multiplex_*.ome.tiff). QuPath type = FLUORESCENCE; toggle each channel and overlay 2–3 markers. Use this to DISTINGUISH/COMPARE markers.\n  • COMPOSITE ON → NATURAL-COLOUR brightfield RGB (multiplex_composite_*.ome.tiff, Beer–Lambert). QuPath type = BRIGHTFIELD; white background, natural stain colours, "SLIDE-LIKE" appearance — but ONE image, no channel selection. Natural appearance for one slide; a synthetic composite for multiple slides (overlapping stains darken).
