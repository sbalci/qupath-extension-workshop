script.9b0927a8bf3d=Image-processing concepts — on your own slide
script.220d9ae88abc=This tour shows the "behind the scenes" of cell detection in digital pathology step by step on your own open slide. For the most effective use, draw and select a SMALL region containing nuclei (R tool); if nothing is selected, the viewer's current view is used. The previews are read-only — they do not modify your slide.\n\nSource: Pete Bankhead's image-processing glossary for digital pathology (CC-BY 4.0). For the workshop counterparts of the same concepts: Appendix — Image Analysis Fundamentals.
script.77541b99a7d2=1 · Digital image and LUT
script.6bd2b7b26c6b=An image is a numeric grid in which every cell is a pixel value. The color you see on screen is those numbers painted through a "lookup table" (LUT). A LUT or brightness/contrast changes only the DISPLAY; it does not touch the pixel values used in analysis. On the left is the original RGB, on the right the same data in gray (intensity) display — same data, different appearance.
script.a17ad1020ef7=2 · RGB → channels
script.e128d75f9823=In an RGB image every pixel has three values: red, green, blue. These are separate intensity planes; added together they give the color on screen. In H&E, hematoxylin is close to blue, so it appears dark in the red channel and light in the blue channel — this is the basis of color separation.
script.134b38eac0bf=3 · Color deconvolution (Hematoxylin + DAB/Eosin)
script.2bdab0b9ee96=Color deconvolution separates RGB into single-channel intensity images according to the stain color (Ruifrok–Johnston). On the left is hematoxylin, on the right the second stain (DAB/Eosin) intensity — dark = a lot of stain.\n\nLimits (Bankhead): the method can give "impossible" results (negative stain values); strongly DAB-positive (brown) pixels usually also carry a high hematoxylin value. For the correct stain vector: Utilities → Stain & color → Stain vector wizard.
script.4cac2d8a0f94=4 · Gaussian filter (σ)
script.680d9ae4b848=A Gaussian filter reduces noise by replacing each pixel with a weighted average of its neighbors. Smoothing increases as σ (sigma) grows. A very small σ can split a single nucleus into pieces; a very large σ merges adjacent nuclei. (Here σ is in preview pixels; in QuPath it is in µm.)\n\nσ increases from left to right in the hematoxylin channel — watch the effect of smoothing.
script.723b960da15f=5 · Thresholding → binary image
script.ac866a2671c5=Thresholding turns pixels above an intensity value into "foreground" (white) and those below into "background" (black). Three different thresholds on the same channel — note how much the choice of threshold changes the number and shape of the objects found. Bankhead's lesson: a threshold ALONE is not enough for nucleus detection; more processing (distance + watershed) is needed afterwards.
script.0a1bc8ded132=6 · Distance transform + watershed
script.da1f1264ef91=In a binary mask, nuclei that touch stick together as a single object. The distance transform assigns each foreground pixel its distance to the nearest background — nucleus centers get the highest values. These centers become "seeds"; watershed grows regions from the seeds and separates adjacent nuclei (not all of them). Below, the thresholded mask and the estimated centers (distance peaks) are marked. The actual splitting happens in QuPath's watershed detection: the Cell detection module.
script.1a6c1dcf6571=7 · Combine the workflow — this is the Cell detection module
script.86296f1f8b47=Combining these steps gives a cell-detection pipeline:\n   deconvolution → Gaussian (σ) → threshold (binary) → distance + watershed → objects.\nThe Cell detection module does exactly this; the threshold and σ in "Advanced settings" control the steps you have seen.\n\nBankhead's warning: such a simple pipeline looks good only on a few images and at low magnification; at high magnification errors become obvious. Real applications need many more tunable parameters — that is why you calibrate the thresholds on your own slide after the Cell detection module.\n\n
