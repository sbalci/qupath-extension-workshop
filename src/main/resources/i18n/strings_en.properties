script.90de9edecfc4=For each cell (detection) I will write the numeric measurements, together with label columns (cell_class,\nregion_class), to a TSV matrix ready for machine learning.\n\nThis script DOES NOT TRAIN A MODEL — it only produces the X (features) + y (labels) matrix.\nModelling is done on the Python / R side.\n\nOutput folder:\n  <project-folder>/%s/YYYY-MM-DD_HHmmss/\n\nWhich mode do you want?\n  • This image only — the live hierarchy of the open slide\n  • Whole project   — every slide + a combined _all_features.tsv
