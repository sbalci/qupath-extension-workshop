script.28e2923d500a=In the left panel's Project tab, double-click a slide, or drag a slide file (.svs, .ndpi, .tiff) directly into the QuPath window.
script.5ac5f501fc16=Welcome — QuPath interface tour
script.c42f174d2352=This tour introduces the QuPath interface step by step. Each page explains one element; the relevant tab, button or region is marked with an orange frame in the live window. In some steps the relevant command is run automatically as an example (e.g. the Brightness/Contrast dialog opens, the Points tool is activated). For the best experience, first open a slide\u0020
script.65df2bf027c3=so that the viewer and metadata tabs are filled in as well.\n\nNavigate with the Next / Back buttons; if you want the wizard window to stay on top, leave the "Keep on top" box below checked. The "Show automatically" box triggers the highlight and the example command on every page. This wizard is inspired by Pete Bankhead's qupath-extension-training extension (link on the last page).
script.a0ac9f6e6995=Viewer — the central area where the slide is shown
script.5a8103642ca9=The viewer is the large central area where the slide is displayed. You move around the WSI on a resolution pyramid, like Google Maps: the mouse wheel zooms in and out, and with the Move tool active you pan by clicking and dragging. All detections and annotations are drawn on top of this area. To fit the whole slide to the window, use View → Zoom → Zoom to fit.
script.904a5d4792e7=Overview navigator (top-right corner of the viewer)
script.51f94b4922bb=The small overview (navigator) window in the top-right corner of the viewer shows your position in the whole slide — it prevents the "I'm lost" feeling at high magnification. The rectangle on it is the area currently visible; you can click the small window to jump quickly to another region. Its position is fixed — QuPath always places it in the top-right corner (it cannot be moved). The only thing you can adjust is its visibility: you can show or hide the overview from the View menu or from the viewer display menu in the toolbar (screen/monitor icon). Note: "Highlight this region" frames the entire viewer; the navigator is the small box at the top-right corner of that frame (it cannot be marked separately because it is drawn over the image).
script.9ab2ba2874e2=Side panel — analysis tabs
script.ae676bbe55d9=The panel on the left edge is the control center of the analysis; it is organized into tabs: Project, Image, Annotations, Hierarchy and Workflow. You switch to a view by clicking its tab. On the following pages we will get to know each tab one by one. If the panel feels narrow, you can widen it by dragging its edge.
script.e96bf140c032=Project tab — slide list
script.22efbeaa58e6=The Project tab lists all slides in the project with their thumbnails. Double-clicking a thumbnail opens the slide in the viewer; right-clicking offers operations such as adding a description or assigning an image type. Projects are the professional way to keep many slides together and apply the same analysis to all of them. If you have not opened a project yet, this tab looks empty.
script.6d57b33e67dd=Image tab — pixel size and metadata
script.dacefe61002e=The Image tab shows the metadata of the open slide: pixel size (µm/px), image dimensions, scanner model and stain type. The most critical number here is the pixel size — QuPath learns the physical scale from it, and every detection/measurement depends on it. If you see 1.0 µm/px, the metadata is missing; go back to the calibration step in the Introduction module. The image type (Brightfield H&E / H-DAB / Fluorescence) is also shown on this tab and determines stain separation.
script.237946e06110=Annotations tab — drawn ROIs and classes
script.7c9e7eb1969d=The Annotations tab lists all ROIs (regions of interest) created by hand or by an algorithm, together with their classes. Clicking an annotation selects it in the viewer; with a right-click you can assign a class, give it a name or delete it. Classes such as tumor and stroma are managed here with colors.
script.08f2ef217f06=Hierarchy tab — object tree (annotation → detection)
script.29ffbfb5cce2=The Hierarchy tab shows the tree structure of objects: slide → annotation → detection. Cell detections found inside an annotation sit under it in this tree. The difference between an annotation and a detection becomes visible here: an annotation is a region drawn by hand, whereas a detection is an object found by an algorithm and is always inside an annotation.
script.32fdd39ff186=Workflow tab — a record of what you did
script.345d3241ab28=The Workflow tab records the operations you perform in the session in order — a kind of automatic log. From here you can turn all the steps into a re-runnable Groovy script (Create script), which makes it easy to repeat the same analysis on other slides. Double-clicking an entry reopens that command with the same settings.
script.cdab116fd393=Toolbar — overview
script.9ef157ff5a11=The toolbar at the top offers the most frequently used commands with one click: navigation and drawing tools, brightness/contrast, visibility switches, measurement tables and the script editor. If you hover over a button and wait, a tooltip with its name and shortcut appears. We will get to know the prominent buttons on the following pages.
script.cb78071c9a40=Drawing tools — Move, Rectangle, Polygon, Brush, Wand
script.5ca0299c8177=The drawing tools sit side by side in the toolbar: Move (navigation, shortcut M), Rectangle (R), Ellipse (O), Polygon (P), Brush (B) and Wand (a magic wand that follows edges, W). To draw a region, select the relevant tool and drag in the viewer. When you are done, it is a good habit to return to the Move tool — otherwise you may draw a new annotation by accident. (This step activates the Move tool as an example.)
script.c38d2983351b=Points — counting / marking tool
script.295906432abf=The Points tool is used to mark and count individual cells by hand — for example when making a reference count. Each click leaves a point; you can create separate point sets for different classes. This is a practical way to check the accuracy of automatic detection by eye. (This step activates the Points tool as an example.)
script.6cbb07189bc3=Exercise — draw a RECTANGLE
script.3bdaf922a3cf=Your turn! The Rectangle (R) tool has been selected for you. Draw a rectangle annotation by clicking and dragging on the image. When the wizard detects the drawing, it moves on to the next exercise automatically. (This exercise needs an open slide; if you prefer not to, you can skip it with "Next ▶".)
script.fb8bc6b41545=Exercise — draw an ELLIPSE
script.ea5369c5b04a=The Ellipse (O) tool has been selected. Draw an ellipse by clicking and dragging on the image. If you drag with Shift held, it becomes a circle. It advances automatically once the drawing is detected.
script.e36003708bf9=Exercise — draw a POLYGON
script.be606e4f6b83=The Polygon (P) tool has been selected. Create a polygon by clicking the corners one by one; close it by double-clicking (or by returning to the first point). If you prefer, you can also draw by clicking, dragging and releasing. It advances automatically once the polygon is completed.
script.e9dcec55bf7c=Exercise — add POINTS
script.3cbe2f1eadfb=The Points tool has been selected. Mark one or several points by clicking on the image (used for counting/marking). When you add a point, the message below is updated; continue the tour with "Next ▶". Congratulations — you have tried all five drawing tools!
script.385528c958ff=Selection mode — selecting objects instead of drawing
script.bda6c09402f6=The Selection mode button turns the behavior of the tools from "drawing" to "selecting". When it is on, the area you drag with a drawing tool does not create a new annotation; it selects the existing objects that fall in that area. It is useful for processing many cells or annotations in bulk. (This step turns selection mode on as an example; when the tour closes, the previous state is restored.)
script.6056e2ddcf11=Brightness & Contrast — changes only the display
script.866bf6eb5b76=The Brightness & Contrast dialog (sun icon in the toolbar, or Shift+C) changes only what you see on screen; it does not touch the pixel values used in analysis. You can freely play with the contrast — your measurements are not affected. In H&E you can tell the signal apart by switching the R/G/B channels on and off, and in H-DAB the hematoxylin/DAB channels. (This step opens the dialog as an example.)
script.dbd81eb0091d=Visibility: show/hide annotations/detections, fill
script.00c6061acb0e=The visibility switches in the toolbar control what you see on a crowded slide: show/hide annotations, show/hide detections, and fill or empty their interior. Showing thousands of cells filled in, rather than as outlines, makes the distribution much more legible from a distance. You also toggle connections and the classification overlay here. (These switches are only highlighted; they are not run automatically because triggering them would hide objects.)
script.851924a132eb=Opacity slider — overlay transparency
script.99f8427f435f=The opacity slider adjusts the transparency of object and classification overlays. Dragging it left fades the overlay and shows more of the H&E underneath; dragging it right makes the overlay more prominent. It is very useful when checking the tissue beneath a pixel classifier mask.
script.ad1478919b5c=Measurement tables
script.bf10e9188237=The measurement tables button opens a table with all measurements of the selected objects (annotation or detection): area, counts, density, stain optical density and more. Clicking a row in the table selects the corresponding object in the viewer. These tables are the basis of export (the Data export module). (This step opens the button's menu as an example.)
script.6d8fa6fe8412=Script editor — scripts and console
script.948d5b2a6078=The Script editor is QuPath's Groovy console; it is the way to automate repetitive work. All helpers of the workshop extension are in fact scripts that run from here. It can also be opened from the menu with Automate → Script editor. Don't be afraid — you can do most things from the menus; scripts are only for repetition and scaling. (This step opens the editor as an example.)
script.bc9428240283=Command List (Ctrl/⌘+L) — the fastest navigation
script.cb1b72a4c6c8=The Command List (Ctrl+L / ⌘+L) is QuPath's "command palette": it opens a searchable window, and instead of browsing menus you type the name of the command and run it. Searches such as "cell detection", "estimate stain vectors" or "brightness" remove the burden of memorizing menu paths. Make this your first reflex when you cannot remember a command. (This step opens the Command List as an example — it is a keyboard shortcut, not a toolbar button; close the window and continue.)
script.23b149508e41=qupath-extension-training — official tour extension (GitHub) ↗
script.5f614c5d208d=Tour complete — next steps
script.39578be112a8=You have completed the tour. For the written counterpart of these pages, the panel table and keyboard shortcuts, see the "Introduction to QuPath — Interface tour" section. For a deeper, English, button-level official tour with live highlighting, you can install Pete Bankhead's qupath-extension-training extension (link below). Next step: Cell detection.\n\n⚠️ This wizard is for educational purposes only; it produces no measurement or clinical decision.
