script.b89b0d40335a=Warpy (qupath-extension-warpy, BIOP) INSTALLATION — recommended FROM THE BIOP CATALOG:\n\n1. Extensions → Manage extensions → Manage extension catalogs → Add.\n2. Paste the catalog URL:\n\u0020\u0020\u0020\u0020\u0020
script.12e771e3b104=\u0020\u0020\u0020(the button below opens/copies this address.)\n3. Install Warpy from the catalog — it provides the build that MATCHES your QuPath version (safer than a manual .jar;\n   a wrong-version manual .jar may fail to load).\n4. RESTART QuPath.\n\nFiji is ALSO required (a SEPARATE application; the registration is done in Fiji):\n  • Download Fiji from\u0020
script.b8b1bb2d315d=\u0020("Download Fiji" button) and extract the archive.\n  • In Fiji, enable the PTBIOP update site + set up the elastix wrappers\n    (Plugins → BIOP → Set and Check Wrappers). BigWarp comes with the Fiji core.\n\nShall I open the BIOP catalog page now?
script.a8d028214f86=FIJI PLUGINS (for Warpy registration) — with Fiji open:\n\n1) PTBIOP update site (BigDataViewer-Playground + Warpy commands):\n   Help → Update… → (when the check finishes) Manage update sites → CHECK PTBIOP in the list →\n   Close → Apply changes → RESTART Fiji.\n   ⚠ The menu you need is "BigDataViewer-Playground" (hyphenated) — NOT plain "BigDataViewer".\n   If "BigDataViewer-Playground" does not appear even with PTBIOP enabled: Apply changes + restart;\n   if it is still missing, untick and re-tick PTBIOP and Apply again (clean download) and check the errors in the Update window.\n   If the JAR is installed (jars/bigdataviewer-playground-*.jar EXISTS) BUT the menu is missing: your Fiji has a JAR CONFLICT\n   (experimental "SciJava-Ops"/scijava3 -SNAPSHOT jars conflict with classic SciJava → the menu registration is dropped).\n   These usually come from the "Fiji-Latest" (nightly, sites.imagej.net/Fiji) update site:\n   Manage Update Sites → UNTICK "Fiji-Latest" (keep ImageJ/Fiji/PTBIOP/ElastixWrapper enabled) → Apply → restart.\n   Window → Console shows the startup error. Safest: a CLEAN Fiji (fiji.sc) with ONLY PTBIOP enabled.\n\n2) elastix (automatic affine + spline; NOT a Fiji plugin, an external executable):\n   • Download (tested version 5.0.1):\u0020
script.e3641b6e9da3=\u0020→ Windows zip → extract it to a folder.\n   • If it does not run on Windows, install the "Visual C++ redistributable".\n   • Fiji → Plugins → BIOP → Set and Check Wrappers → give the paths of elastix.exe and transformix.exe.\n\n3) BigWarp: comes with the Fiji core (no installation needed).\n\nThen restart Fiji; the Warpy command appears under Plugins → BigDataViewer-Playground → Sources → Register.\nShall I open the elastix release page now?
