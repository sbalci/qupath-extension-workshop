script.f1a635a0162a=A cluster folder carrying the settings in its name is created under this folder (karo_<size>px_<µm>um_ov<overlap>).
script.58df8e6cd188=Folder layout:
script.4e822a8e755a=Most deep-learning tools expect <class>/<file>. A slide folder makes slide-level splitting easier.
script.84748e372086=<slide>__<Label>__ds<d>_x<X>_y<Y>. If off: <slide>__ds<d>_x<X>_y<Y>.
script.80d2b88cd043=If on, the split also goes into the file name: <slide>__<split>__<Label>__…
script.d434f4a2895e=Tiles are not written to disk; only a coordinate list is produced. You read the tiles from the slide later with your own code (no disk space or duplicate problems).
script.139d2010266b=Preview:
script.047616b9b247=Boxes of the written tiles on a small image of the slide, coloured by label. For checking the export by eye.
script.04ba91cd4df6=Tile list:
script.496470bc4e64=One row per tile: split, label, x, y, coverage, file. Use this list, not the folders, for training.
script.10a585663b48=If the metadata contains a split it is ALWAYS read, and a <Split>/ level is put in front of the folders (train / val / test). If there is no split, this level is not created.
script.0015bf40b9f7=Split keys:
script.0a127b1e8d21=Looked up first in the annotation's metadata, then in the project entry's metadata. Separate with commas.
script.0290919acbbe=Patient keys:
script.3cf02b584048=Keys in the project entry's metadata that carry the patient ID. Separate with commas.
