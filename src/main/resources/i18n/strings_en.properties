script.1c91713d87b9=Annotations panel → select the class → draw several representative regions with Brush (B).\nRequired classes: Tumor, Stroma, Ignore* (empty glass/background — prevents the model\nfrom forcing those pixels into Tumor/Stroma). Selected optional classes\nare included as separate model classes; unselected ones are excluded from training.\nDraw small, varied examples; large filled regions waste the example budget.\nNote: the model learns only from THIS slide and has limited generalisation to other slides —\nsee Annotation Strategy §4b for training with multiple slides.
