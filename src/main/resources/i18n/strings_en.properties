script.08b4993f18ec=AFFINE ALIGNMENT — (A) automatic vs (B) manual:\n\n⚠ IMPORTANT: The wizard's (A) AUTOMATIC path requires a build of Align that CONTAINS the "AutoAligner" class.\n   The PUBLISHED 0.5.0 release does NOT CONTAIN it (AutoAligner exists only on the development/main branch). So even\n   if you install Align, (A) stays DISABLED in 0.5.0 — this is normal. In that release:\n     • align with [Analyze → Alignment → Interactive image alignment] (Align must be INSTALLED),\n     • paste the 6 numbers shown into the (B) Manual matrix box and click "Transfer with manual matrix".\n   (A) is enabled automatically only if an Align build containing AutoAligner is installed.\n\nINSTALLING qupath-extension-align (for Interactive image alignment — the (B) path and GUI alignment):\n\nBEST — install from the official CATALOG (it provides the build that MATCHES your version):\n  Extensions → Manage extensions → Manage extension catalogs → official QuPath catalog → Align → install.\n\nManually with a .jar:\n  1. Open the GitHub release page (below) and find the latest version compatible with YOUR QuPath version.\n  2. Download "qupath-extension-align-X.Y.Z.jar" — NOT "-javadoc"/"-sources" or the source (zip/tar.gz); the plain .jar (~48 KB).\n  3. DRAG AND DROP the .jar onto the QuPath window.\n  4. RESTART QuPath; open this wizard again.\n\nIF YOU ALREADY INSTALLED IT BUT IT IS NOT RECOGNIZED (and the Analyze → Alignment menu is MISSING too):\n  Most likely a VERSION MISMATCH — QuPath does NOT load an incompatible extension (no menu appears, its classes are not visible).\n  • Check your QuPath version (Help → About).\n  • Look at the log (View → Show log; search for "align") — the incompatibility/load error is written there.\n  • Install the Align that matches your version from the CATALOG instead of a manual .jar (0.5.0 may fail to load on some 0.6/0.7 versions).\n\nShall I open the GitHub release page now?
