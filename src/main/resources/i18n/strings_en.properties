script.5410888c6e0d=② Install the Fiji application and its plugins
script.aa6579253a46=Fiji is a SEPARATE application (fiji.sc). Download it with "Download Fiji" and extract the archive; choose the executable path with "…". Then install the Fiji plugins: the PTBIOP update site + the elastix wrappers (BigWarp comes with Fiji).
script.b76129e15f0d=③ Open the project in Fiji and run the registration
script.ec0253d9c853=After Fiji opens (menu: BigDataViewer-Playground — HYPHENATED; NOT plain "BigDataViewer". If it is missing, install PTBIOP as in ②):\n  a) Plugins → BigDataViewer-Playground → BDVDataset → Create BDV Dataset (QuPath) → open project.qpproj (unit: mm).\n  b) Plugins → BigDataViewer-Playground → Sources → Register → QuPath - Create Warpy Registration:\n     rigid → elastix affine → elastix spline → (opt.) BigWarp → the transform is WRITTEN to the QuPath project (transform_<target>_<source>.json).
script.1fbd7084c582=④ Back in QuPath → transfer the annotations
script.70dfaeed0656=Open the TARGET (fixed) slide in QuPath, click "↻ Refresh sources", choose the source and press "Transfer annotations". Verify the overlap with the opacity slider.
