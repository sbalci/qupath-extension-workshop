name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Pinned release tag (e.g. v0.2.2-rc8)'
        required: true
        type: string
      publish:
        description: 'Publish only after explicit approval; false verifies without publishing'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: extension-release-promotion
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release tag safely
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['REQUESTED_TAG'] if os.environ['EVENT_NAME'] == 'workflow_dispatch' else os.environ['GITHUB_REF'].removeprefix('refs/tags/')
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?', tag):
              raise SystemExit('Invalid release tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('tag=' + tag + '\n')
          PY
      - name: Promotion regression tests (no release)
        run: python3 -m unittest discover -s tools -p test_release_promotion.py -v
      - name: Retrieve and verify exact acceptance-tested bytes (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: python3 tools/promote-candidate.py --tag "$RELEASE_TAG" --release-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/verified-release"
      - name: Record verification scope
        run: |
          echo 'Exact accepted JAR verified. GUI, representative real-slide, barcode and intended-OS acceptance remain NOT RUN. No clinical validation is established.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: verify
    # Tag pushes and default dispatches are verification-only, never publication.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    environment: release-promotion
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reverify original pinned artifacts immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: python3 tools/promote-candidate.py --tag "$RELEASE_TAG" --release-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/verified-release"
      - name: Create new release with exact verified files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          repo = os.environ['GITHUB_REPOSITORY']
          p = json.loads(Path('docs/release-candidates', tag + '.json').read_text())
          jar = Path(os.environ['RUNNER_TEMP'], 'verified-release', p['jar_name'])
          if jar.stat().st_size != p['jar_bytes'] or hashlib.sha256(jar.read_bytes()).hexdigest() != p['jar_sha256']:
              raise SystemExit('Staged JAR changed after verification')
          environment = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/environments/release-promotion']))
          if not any(rule.get('type') == 'required_reviewers' and rule.get('reviewers') for rule in environment.get('protection_rules', [])):
              raise SystemExit('Configure required reviewers for release-promotion before publishing')
          # Only a positively identified HTTP 404 permits a new release.
          result = subprocess.run(['gh', 'api', '--include', f'repos/{repo}/releases/tags/{tag}'], capture_output=True)
          status = result.stdout.decode(errors='replace').splitlines()
          if result.returncode == 0 or not status or not __import__('re').fullmatch(r'HTTP/\S+ 404(?: .*)?', status[0]):
              raise SystemExit('Existing release or release lookup failure; refusing to publish/overwrite')
          args = ['gh', 'release', 'create', tag, '--repo', repo, '--target', os.environ['GITHUB_SHA'],
                  '--title', tag, '--generate-notes', '--draft']
          notes = Path('docs/releases', tag + '.md')
          if notes.is_file():
              args += ['--notes-file', str(notes)]
          if any(suffix in tag for suffix in ['-rc', '-alpha', '-beta']):
              args += ['--prerelease', '--latest=false']
          args += [str(jar), str(jar) + '.sha256', str(jar) + '.verification.json']
          subprocess.run(args, check=True)
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/{tag}']))
          expected = {f.name: f for f in [jar, Path(str(jar)+'.sha256'), Path(str(jar)+'.verification.json')]}
          assets = release['assets']
          if release['draft'] is not True or {a['name'] for a in assets} != set(expected) or len(assets) != len(expected):
              raise SystemExit('Release asset verification failed; leaving draft')
          for asset in assets:
              local = expected[asset['name']].read_bytes()
              downloaded = subprocess.check_output(['gh', 'api', '-H', 'Accept: application/octet-stream', f"repos/{repo}/releases/assets/{asset['id']}"])
              if asset['size'] != len(local) or downloaded != local:
                  raise SystemExit('Uploaded asset differs; leaving draft')
          # Only the verified draft becomes public. Failures leave a draft for review.
          subprocess.run(['gh', 'api', '--method', 'PATCH', f"repos/{repo}/releases/{release['id']}",
                          '-F', 'draft=false'], check=True, stdout=subprocess.DEVNULL)
          PY
