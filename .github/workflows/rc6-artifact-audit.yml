name: Published packaged-script safety audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # verifier compares the release resources with their exact commit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Test audit harness
        run: python3 -m unittest discover -s tools -p 'test_audit_packaged_scripts.py'
      - name: Build correction and verify actual JAR
        run: |
          ./gradlew --no-daemon clean build
          python3 tools/verify-candidate.py
      - name: Download immutable comparison artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit-artifacts/candidate
          curl --fail --location --retry 3 https://github.com/sbalci/qupath-extension-workshop/releases/download/v0.2.2-rc6/qupath-extension-workshop-0.2.2-rc6.jar -o audit-artifacts/published-rc6.jar
          curl --fail --location --retry 3 https://github.com/sbalci/qupath-extension-workshop/releases/download/v0.2.2-rc7/qupath-extension-workshop-0.2.2-rc7.jar -o audit-artifacts/published-rc7.jar
          python3 tools/verify-candidate.py --jar audit-artifacts/published-rc7.jar --source-ref 644a0bba12350781015787a77974df6c79b67d02 --expect-sha256 7ed24440452eaa49c101b624d3522312d69828169f89ce0e681fbf1de5a13e70
          gh api repos/sbalci/qupath-extension-workshop/actions/artifacts/12482561902/zip > audit-artifacts/candidate.zip
          unzip audit-artifacts/candidate.zip -d audit-artifacts/candidate
      - name: Test exact packaged scripts against safety contracts
        run: python3 tools/audit-packaged-scripts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-script-audit
          path: audit-artifacts/
          if-no-files-found: error
