name: Published rc6 safety audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Build correction and verify actual JAR
        run: |
          ./gradlew --no-daemon clean build
          python3 tools/verify-candidate.py
      - name: Download immutable comparison artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit-artifacts/candidate
          curl --fail --location --retry 3 https://github.com/sbalci/qupath-extension-workshop/releases/download/v0.2.2-rc6/qupath-extension-workshop-0.2.2-rc6.jar -o audit-artifacts/published-rc6.jar
          gh api repos/sbalci/qupath-extension-workshop/actions/artifacts/12482561902/zip > audit-artifacts/candidate.zip
          unzip audit-artifacts/candidate.zip -d audit-artifacts/candidate
      - name: Test exact packaged scripts against safety contracts
        run: python3 tools/audit-packaged-scripts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc6-artifact-audit
          path: audit-artifacts/
          if-no-files-found: error
